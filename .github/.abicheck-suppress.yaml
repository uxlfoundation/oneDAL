#
# Mirrors the namespaces already suppressed for libabigail in .github/.abignore.
#
# This file IS applied by the LinuxAbicheckScan job in ci.yml. `abicheck scan`
# supports --suppress at the CLI level (scan_cmd carries @policy_options); only
# the composite Action's scan branch omits the forwarding, so ci.yml passes it
# through `extra-args` instead. Verified locally: applying this file to a
# libonedal.so scan drops the internal-namespace findings it names (e.g.
# oneapi::dal::detail::v2::chunked_array_base::reset) and leaves every
# public-surface finding in place.

version: 1

suppressions:
  - namespace: "daal::**::internal::**"
    reason: "daal::*::internal is a documented non-public implementation namespace"
  - namespace: "oneapi::dal::**::backend::**"
    reason: "oneapi::dal::*::backend is a documented internal namespace"
  - namespace: "oneapi::dal::**::detail::**"
    reason: "oneapi::dal::*::detail is a documented internal namespace"
