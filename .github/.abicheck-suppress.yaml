#
# Suppressions for the LinuxAbicheckScan job in .github/workflows/ci.yml.
# Mirrors the namespaces already suppressed for libabigail in .github/.abignore.
#
# Every entry below was validated by running the scan with and without it
# against a baseline dumped by the *same* abicheck commit the scan pins, and
# checking the affected symbols against `nm -D` on both .so files. The counts
# quoted in each reason are from that run.
#
# ── The baseline and the scanner must be the same abicheck build ─────────────
#
# This matters more than any single entry here, so it is repeated in both
# workflows: the findings a scan produces depend on the abicheck version that
# dumped the baseline, not just on oneDAL's two trees. Measured, a
# schema_version 18 baseline read by a schema_version 24 scanner, against the
# same baseline re-dumped by the scanning version (oneapi::dal side):
#
#                                stale baseline    re-dumped baseline
#   internal_template_leaks                  46                     0
#   experimental_removed                     93                     4
#   constant_changed                         44                     2
#   type_vtable_changed                       0                     1
#   func_visibility_changed                   6                     6
#
# Both failure directions are in that table, and the second is the dangerous
# one:
#
#  * Over-reporting. The template-leak and experimental-removal detectors used
#    to key identity on the `name` field, which the two versions spelled
#    differently (`check_ranges` vs `oneapi::dal::decision_forest::detail::v1::
#    train_parameters<...>::check_ranges`), so affected declarations read as
#    removed-and-re-added even though `mangled`, visibility, provenance and
#    header were byte-identical on both sides; constants collapsed the same way
#    by hash (267 constants over 60 distinct hashes on the old side vs 92 on
#    the new). Current abicheck keys on stable identity instead, so a stale
#    baseline no longer manufactures these -- the 46 and the 44 above are 0 and
#    0 on today's scanner even *without* re-dumping.
#  * Under-reporting, which is what remains. A snapshot records which classes
#    of fact it was able to establish, and a detector whose evidence postdates
#    the snapshot declines to run rather than trust a stale fact. So the
#    schema-18 baseline makes the scan *miss* the one type_vtable_changed and
#    both genuine constant_changed findings that the matched baseline surfaces:
#    clang_vtable_facts_reliable, clang_deprecation_facts_reliable,
#    clang_field_initializer_facts_reliable, clang_restrict_facts_reliable and
#    clang_va_list_facts_reliable are all marked unreliable on it.
#
# abicheck does say so. Loading an older snapshot emits, on stderr and so into
# the job log, "Snapshot schema_version 18 predates this abicheck's
# schema_version 24: <the five flags> are marked unreliable on this snapshot,
# so the affected detectors will decline to trust these stale facts rather than
# risk a false positive purely from this tool upgrade. Detection coverage for
# these fields is reduced until this snapshot is regenerated with the current
# abicheck." The opposite direction -- a snapshot *newer* than the reader -- is
# a hard reject (serialization.py:794). But a warning is not a gate, and stale
# is the direction CI hits, since baselines are committed once and outlive
# several pin bumps. So it is on this repo to keep them in step: bumping the
# abicheck pin in ci.yml obliges re-dispatching
# .github/workflows/abicheck-baseline.yml, and both workflows pin the same
# commit for that reason.

version: 1

suppressions:
  # `**` crosses `::` as a globstar here (abicheck/abicheck#714), so
  # `oneapi::dal::**::detail::**` matches `oneapi::dal::detail::v1::x` as well
  # as `oneapi::dal::algo::detail::x`. Confirmed by abicheck's own diagnostic
  # text naming the rule that matched. Before #714 these globs went through
  # fnmatch.translate, where `**` was plain `.*` and the `::` either side was
  # literal -- so this spelling required a namespace segment *between* `dal`
  # and `detail` and missed `oneapi::dal::detail::` itself. That is why these
  # three entries need an abicheck at or after #714, i.e. the pin in ci.yml.
  - namespace: "daal::**::internal::**"
    reason: "daal::*internal is a documented non-public implementation namespace"
  - namespace: "oneapi::dal::**::backend::**"
    reason: "oneapi::dal::*backend is a documented internal namespace"
  - namespace: "oneapi::dal::**::detail::**"
    reason: "oneapi::dal::*detail is a documented internal namespace"

  # What the three namespace entries above actually match today, against a
  # version-matched baseline:
  #
  #  * daal::**::internal::** -- 4 imported_symbol_removed on libonedal.so.
  #    libonedal.so imports from libonedal_core.so, and 4 of the internal
  #    symbols it used to import are among the WEAK exports
  #    -fvisibility-inlines-hidden dropped (see func_visibility_changed
  #    below). Bucketed `compatible`, so these do not gate -- suppressing
  #    them just keeps the report about the public surface.
  #  * oneapi::dal::**::detail::** -- 2 constant_changed, both the same entry
  #    seen through the inline-namespace alias
  #    (oneapi::dal::detail::v1::cpu_feature_map and
  #    oneapi::dal::detail::cpu_feature_map, identical old and new value
  #    hashes: expr:3a04b5e463f1ca23 -> expr:6c4859024638b5ce). The constant
  #    detector does not collapse the two spellings the way the experimental
  #    one now does, so expect the count to halve to 1 if it ever gains the
  #    same treatment. This one is a *true positive*:
  #    main really did add `{ uint64_t(cpu_feature::amx_bf16),
  #    "Intel(R) AMX bfloat16" }` to cpu_feature_map in
  #    cpp/oneapi/dal/detail/cpu.hpp. It is an addition to an internal table,
  #    which is exactly what this namespace entry exists to allow.
  #  * oneapi::dal::**::backend::** -- currently matches nothing on either
  #    library. Kept deliberately, to mirror .abignore's libabigail policy and
  #    because backend:: is as internal as detail::; it is not load-bearing
  #    today.

  # Three change_kind-scoped entries, deliberately narrow: they silence one
  # finding kind each, not a whole severity category, so a genuine ABI break
  # of any other kind still fails the job.

  # 2026.0.0 -> main lost 2318 exported symbols from libonedal_core.so and
  # libonedal.so. Every one is a WEAK FUNC -- a COMDAT inline or template
  # instantiation that -fvisibility-inlines-hidden (added at makefile:134
  # after the 2026.0.0 tag) stopped exporting. Verified: zero STRONG symbols
  # and zero data objects lost; zero _ZTV/_ZTI/_ZTS lost; zero _ZGV guard
  # variables lost; and cross-linking every lost export against the 1556
  # undefined symbols required by all 183 built client objects gives an empty
  # intersection, i.e. nothing that actually ships resolves against them.
  # Such a symbol is emitted into every TU that uses it, so a client links
  # its own copy -- which is exactly what -fvisibility-inlines-hidden is for.
  #
  # This is the one entry here that suppresses a real change in what oneDAL
  # exports. It accounts for 77 of the 79 breaking findings on
  # libonedal_core.so and 6 of the 7 on libonedal.so, and it goes away by
  # itself once a post-inlines-hidden release is published as the baseline.
  - symbol_pattern: ".*"
    change_kind: "func_visibility_changed"
    reason: >-
      -fvisibility-inlines-hidden (makefile:134) stopped exporting COMDAT
      inline/template instantiations. All 2318 affected symbols are WEAK FUNC
      that clients instantiate locally; no STRONG symbol, data object, vtable,
      typeinfo or guard variable is affected, and no built client object
      references any of them.

  # An evidence gap, not an oneDAL change -- and, unlike the entries above,
  # this one is oneDAL's own risk call rather than a workaround.
  #
  # Types are reported as `type_vtable_changed` = BREAKING (2 on
  # libonedal_core.so, 1 -- system_parameters -- on libonedal.so) even though
  # both snapshots record an identical single-slot vtable, identical size_bits
  # and identical base_offsets. Confirmed by a control run: scanning the tree
  # against a dump of *the same binary* still emits the finding with exit 4, so
  # nothing differs between the two sides at all. abicheck simultaneously emits
  # a `layout_unverifiable` risk finding on the very same types ("one side
  # carries a layout descriptor but the other has no layout evidence ...
  # Informational and non-escalating").
  #
  # Reported upstream and answered deliberately: abicheck now cross-references
  # the two findings so the pairing is visible, but keeps the vtable one at
  # BREAKING on the stated grounds that demoting an unevidenced vtable
  # transition to RISK could hide a real ABI break. Re-verified on the pinned
  # commit: still 2 + 1, still BREAKING. So this entry is not waiting on an
  # upstream fix -- it is oneDAL choosing to accept that risk for these three
  # types, on the strength of the same-binary control run above, and it should
  # be revisited if the count ever changes or if any of the three gains a real
  # virtual member.
  - symbol_pattern: ".*"
    change_kind: "type_vtable_changed"
    reason: >-
      Evidence gap, not a change: fires on types whose vtable, size_bits and
      base_offsets are identical on both sides, and which abicheck
      simultaneously reports as non-escalating layout_unverifiable. Reproduced
      by scanning a binary against a dump of itself. Accepted deliberately --
      abicheck keeps this BREAKING by design, so the judgement is oneDAL's.

  # The same lost WEAK symbols, reported a second time under a second kind.
  #
  # oneapi::dal::preview::spmd::communicator<...>'s bcast, allgatherv,
  # allreduce and sendrecv_replace are reported as
  # experimental_removed_without_replacement (api_break) *in addition to* the
  # func_visibility_changed findings the entry above already covers. Verified:
  # all four are in the lost-WEAK set (the old side's WEAK exports minus every
  # symbol the new side defines is exactly these 4 under this stem), and
  # cpp/oneapi/dal/spmd/communicator.hpp still declares every one of them on
  # both sides. So this is one cause (-fvisibility-inlines-hidden) surfacing
  # under two kinds, not a second, independent removal. Exactly 4 findings, one
  # per symbol: an earlier abicheck reported each twice, once per
  # inline-namespace spelling (preview::spmd::v1::communicator and
  # preview::spmd::communicator), and the pinned commit deduplicates them.
  #
  # Scoped by symbol_pattern rather than namespace for the ADR-044 D2 reason:
  # abicheck's _passes_public_break_gate refuses to let a broad selector
  # (namespace/source_location) suppress a public-reachable api_break unless
  # the rule opts in with allow_public_break: true, and that opt-in would lift
  # the gate for every internal-namespace break, which is what the gate is
  # for. A symbol_pattern is a primary narrow selector and is exempt by
  # design. Note symbol_pattern is a regex fullmatch, not a glob.
  - symbol_pattern: "oneapi::dal::preview::.*"
    change_kind: "experimental_removed_without_replacement"
    reason: >-
      oneapi::dal::preview is oneDAL's documented experimental namespace, and
      these findings duplicate the func_visibility_changed findings for the
      same four symbols: all four are WEAK COMDAT instantiations dropped by
      -fvisibility-inlines-hidden and still declared in
      cpp/oneapi/dal/spmd/communicator.hpp on both sides.

  # Two entries an earlier revision of this file carried are deliberately
  # gone, because with a version-matched baseline they match nothing:
  #
  #  * internal_template_leaks_via_public_api -- was 46 findings, now 0. All
  #    46 were the version-skew artifact described at the top of this file:
  #    the detector keyed its instantiation set on the `name` field
  #    (diff_templates.py:512), which the two abicheck versions spelled
  #    differently, and every one of the 53 instantiations it listed as
  #    removed was still exported by `nm` on the new side. Current abicheck
  #    keys on stable identity, so this is 0 against a stale baseline too.
  #  * constant_changed (blanket, symbol_pattern ".*") -- was 44 on
  #    libonedal.so and 11 on libonedal_core.so, now 2 and 0. The same hash
  #    collapse. The 2 that survive are the genuine cpu_feature_map addition,
  #    and the oneapi::dal::**::detail::** entry above already covers them, so
  #    a blanket kind rule is not needed. Note that a future daal-side
  #    constant change would *not* be covered by any namespace entry here --
  #    daal's constants (e.g. daal::DAAL_DEFAULT_ALIGNMENT_MASK) sit in the
  #    `daal::` root -- which is the intended behaviour: a changed public
  #    constant should be looked at, not silenced.
