# Project-wide abicheck configuration (abicheck's docs/reference/config-file.md).
# Discovery matches this exact filename at the repository root, .github/, or
# .github/abicheck/ (this location, so everything abicheck needs sits in one
# directory); relative paths below still resolve against the repository root.
#
# CI does not read this file: the gate drives abicheck as a Python library
# (bundle_gate.py) and config discovery is a CLI-layer concern, so these
# settings are duplicated there -- `compile` is `_compile_context`,
# `scope.public` is `compare_snapshots`'s `scope_to_public_surface`, and the
# header roots are `onedal_libraries.py`'s `LIBRARIES`, per library, which is
# the one thing this file cannot express. bundle_gate.py is authoritative for
# CI; this file is what makes a local `abicheck scan` reproduce its scope and
# severity settings. Loading is strict -- an unknown key or wrong type is exit
# 64 -- so it holds only keys verified against abicheck 0.5.0 / main.

version: 1

sources:
  public_headers:
    - cpp/daal/include/**
    - cpp/oneapi/dal/**
  exclude:
    # Not part of either public API: internal helpers that only ship because
    # the install step copies whole directories.
    - cpp/daal/include/services/internal/**
    - cpp/daal/include/data_management/data/internal/**
    - cpp/oneapi/dal/**/detail/**
    - cpp/oneapi/dal/**/backend/**
    - cpp/oneapi/dal/test/**

# castxml (the default frontend) has no SYCL support and
# cpp/oneapi/dal/detail/common.hpp includes sycl/sycl.hpp, so the clang
# frontend driven by icpx is the only workable parser here, not a stopgap.
#
# Deliberately no `include_dirs:`. Include directories belong on the CLI,
# because the two sides of a comparison resolve them from different roots (a PR
# scan from the checkout root, the baseline job from `__baseline_src/`). Putting
# them here makes both sides load the same literal paths, which changes the
# include sequence on exactly one side; abicheck then refuses the comparison --
# verified, `NOT_COMPARABLE` (exit 6), "profile_fingerprint mismatch; differing
# fields: include_sequence" -- where the same scan without it exits 4, i.e.
# actually compares. Per-artifact driver flags (-fsycl) stay on the CLI for the
# same reason.
compile:
  frontend: clang
  std: c++17

# Restrict findings to the exported public surface: the main false-positive
# control, matching what .github/.abignore asserts for libabigail.
scope:
  public: true

# oneDAL ships no suppression file -- policy.yaml reclassifies findings instead
# of deleting them. These two keys are inert while no --suppress is passed, and
# are kept so that any suppression file added later has to be well-formed and
# has to justify every entry.
suppression:
  strict: true
  require_justification: true

# `scan --against` historically computed its exit code from its own verdict and
# ignored the severity model; abicheck #700 wired the two together but kept
# "legacy" as the default. Opting in is what lets the severity block below
# decide whether CI fails. The preset stays `default` on purpose --
# abi_breaking=error, so a genuine break still fails -- and the kinds oneDAL
# needs to tolerate are reclassified per kind in policy.yaml, which keeps them
# in the report, rather than silenced by a quieter preset.
exit_code_scheme: severity

severity:
  preset: default
