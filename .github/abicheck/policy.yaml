# Reclassify rules for the abicheck gate (ci.yml). Why: .github/abicheck/README.md.
reclassify:
  # WEAK inline and template symbols hidden by #3604; GLOBAL removals still break.
  - kind: func_removed_elf_only
    binding: weak
    symbol_pattern: '.*'
    to: risk
    reason: WEAK inline function hidden by #3604.
  - kind: func_visibility_changed
    binding: weak
    symbol_pattern: '.*'
    to: risk
    reason: WEAK inline function hidden by #3604 (headers depth).
  - kind: var_removed_elf_only
    binding: weak
    symbol_pattern: '.*'
    to: risk
    reason: WEAK template static data member hidden by #3604.
# A rule no finding matches is reported as unused, to be deleted at rotation.
unused_rules: warn
