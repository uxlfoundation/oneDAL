# Verdict policy for both abicheck jobs in .github/workflows/ci.yml:
# LinuxAbicheckScan (blocking, binary depth) and LinuxAbicheckL2Scan (advisory,
# header depth) pass this same file as `policy-file`. Every measurement below is
# from the blocking job unless it says otherwise.
#
# A policy file, not a suppression file, deliberately: a suppression rule
# *removes* a matching change before the verdict and the counts are computed, so
# the finding leaves no trace in the report -- not the finding, not a count, not
# a note that a suppression file was in effect. A policy rule changes only the
# classification, so every difference stays in the report while the verdict still
# answers "did oneDAL break its ABI".
#
# This file is load-bearing, measured: the same comparison with no `reclassify:`
# block at all is BREAKING on five of the six libraries, 1952 breaking findings,
# exit 4. With this file: 0 breaking, exit 0, COMPATIBLE_WITH_RISK, and all 1952
# still printed as risk. There is no `overrides:` block: no change kind is
# demoted for every symbol it could ever fire on.
#
# Negative control for that scoping, on the shape ci.yml actually runs: take one
# of those tolerated symbols in the 2026.0.0 baseline snapshot --
# `oneapi::dal::v1::exception::~exception()`, WEAK, no longer exported by main --
# and flip only its recorded linkage to `global`. Same comparison, same command:
# libonedal_parameters.so moves COMPATIBLE_WITH_RISK -> BREAKING with exactly one
# breaking finding (its risk count drops 13 -> 12, i.e. that one finding changed
# bucket and nothing else did) and the run exits 4. A STRONG export disappearing
# gates; a WEAK one is reported and does not.
#
# These rules exist for one cause and should be deleted, not left to rot, once a
# post-`-fvisibility-inlines-hidden` release is published as the baseline. That
# is not left to good intentions: every rule carries `expires: 2027-03-01`, and
# an expired reclassify rule never matches, so on that date the 1952 findings
# return to `break` and this gate goes red until someone either re-captures the
# baseline (the real fix) or re-dates the rules with a fresh justification.
#
# Scope note: the blocking gate compares directories, which is abicheck's release
# fan-out, and that path is binary-depth by contract -- no header AST, and this
# build carries no DWARF. So no type, layout, enum or constant facts reach *that*
# comparison at all, and a rule about them can never fire there. Earlier revisions
# of this file carried five such rules (three named types' `type_vtable_changed`,
# `oneapi::dal::preview`'s `experimental_removed_without_replacement`, one
# internal `constant_changed`), deleted for that reason.
#
# LinuxAbicheckL2Scan does reach header depth with this file in effect, so one of
# the five -- `experimental_removed_without_replacement` -- is fireable again
# there: it is exactly the kind behind the four `oneapi::dal::preview` SPMD
# findings that job reports. Leaving it out is deliberate, not an oversight: four
# named removals reported once in an advisory job beat the same four silently
# reclassified. The other four are not restored either: no L2 leg reports a
# `type_vtable_changed` or `constant_changed` finding, and every leg reports
# `layout_unverified_detectors: ['dwarf', 'advanced_dwarf', 'layout_descriptor']`
# because this build ships no DWARF. Any restoration has to
# be re-measured against the L2 shape, not lifted from git history; the reasoning
# is under "What it finds that binary depth cannot" in
# .github/abicheck/README.md.
#
# The abicheck build that dumps a baseline and the one that reads it must be the
# same, or findings change for tooling reasons alone. That rule, its measurements
# and the rest of this gate's design are in .github/abicheck/README.md.

base_policy: strict_abi

reclassify:
  # ── The -fvisibility-inlines-hidden demotion, bounded ───────────────────────
  #
  # 2026.0.0 -> main stopped exporting a large set of symbols from five of the
  # six libraries. Every one is a WEAK FUNC -- a COMDAT inline or template
  # instantiation that -fvisibility-inlines-hidden (added at makefile:134 after
  # the 2026.0.0 tag) demoted. Verified: zero STRONG symbols and zero data
  # objects lost; zero _ZTV/_ZTI/_ZTS and zero _ZGV guard variables lost;
  # cross-linking every lost export against the 1556 undefined symbols required
  # by all 183 built client objects gives an empty intersection; and the new
  # binaries' own .symtab still defines every one of them as LOCAL FUNC. The
  # code was not removed, only its export visibility was demoted, and no
  # consumer can hold an undefined reference to a definition its own headers
  # force it to emit -- there is no `extern template` anywhere in the installed
  # headers (grep of cpp/daal/include + cpp/oneapi: zero hits), so a consumer
  # TU always has its own copy.
  #
  # Which kind they arrive under depends on the depth, and both are needed.
  # On the release fan-out the blocking job runs there is no header AST, so
  # every one comes through the ELF export-table delta as
  # `func_removed_elf_only` -- measured, 1952 across the five libraries
  # (1414 + 237 + 272 + 17 + 12), and zero `func_visibility_changed`.
  #
  # Header depth is different, and a revision of this file that dropped the
  # `func_visibility_changed` rules on the strength of the binary-depth
  # measurement alone was wrong: with a declaration available, abicheck can say
  # *visibility changed* instead of *export removed*, and it does. Measured on
  # `libonedal_core.so` at header depth with those rules absent: 230
  # `func_visibility_changed`, every one WEAK, all `breaking`, verdict BREAKING,
  # exit 4 -- on a leg that is COMPATIBLE_WITH_RISK with them present. Same
  # cause, same symbols, different kind name because the evidence is richer.
  # 229 of the 230 sit under `daal::`; the one that does not is
  # `NumericTable::getValue<int>`, the same leading-return-type template already
  # named below for the removal kind.
  #
  # Gives up: gating on the removal of a symbol the library itself built with
  # vague (WEAK/COMDAT) linkage, inside the three namespaces named below. That
  # is provider-side evidence, not proof of consumer safety, which is why these
  # stay visible as risk findings instead of being suppressed: the `extern
  # template` check above is the premise that makes them safe here, and it has
  # to be re-checked if oneDAL ever starts shipping explicit-instantiation
  # surface.
  #
  # ── Why these selectors, and what they bound ────────────────────────────────
  #
  # `binding: weak` is the fact that justifies the demotion, but abicheck's
  # selector grammar makes it conjunctive-only: it can narrow another selector
  # but never stand alone, so a rule needs an identity selector too. An earlier
  # revision spelled that as `symbol_pattern: ".*"`, which bounds nothing -- it
  # demotes *every* weak function removal oneDAL will ever make, including ones
  # nobody has looked at.
  #
  # `namespace:` bounds it instead, and the bound is real rather than nominal.
  # Measured, same comparison: the three namespace rules below demote 1943 of
  # the 1952 and leave 9 findings breaking (exit 4) -- so the rules are not a
  # blanket. Adding the six explicitly-named symbols brings it to 1952 demoted,
  # exit 0, with a per-library risk table identical to what `symbol_pattern:
  # ".*"` produced (305 / 1417 / 420 / 23 / 28 / 0). Same outcome, bounded scope.
  #
  # Direct proof the bound gates: inject a *new* weak function removal into the
  # baseline snapshot (declarations inventory plus .dynsym, so the detector
  # actually sees it) and re-run. `otherproj::foo::bar()` -- outside all three
  # namespaces -- comes out breaking, exit 4. `daal::brandnew::foo()` comes out
  # demoted to risk. That second result is the honest limit of what a selector
  # grammar can express: a *new* weak removal inside daal::/oneapi::/sycl:: is
  # still auto-demoted. Closing that needs per-finding acknowledgments, which
  # abicheck implements engine-side but does not expose to the CLI or the Action
  # ("no `--acknowledgments` CLI flag yet", ADR-067 status). The upstream ask is
  # that loader; the file it would need here is 1952 entries -- one per
  # (symbol, component) pair, over 1689 unique symbols -- which is why it has to
  # be a bounded acknowledgment form (component + kind + cause + release range)
  # and not one record per finding.
  #
  # The six named symbols are not exceptions to the namespace bound, they are an
  # upstream matching defect. `namespace:` walks the *demangled* name's ancestor
  # chain, and these six are function templates whose demangled form begins with
  # a printed return type -- `auto& oneapi::dal::...`, `int daal::...`, `void
  # sycl::...` -- so the first `::`-segment is `auto& oneapi`, not `oneapi`, and
  # no namespace rule can match them. abicheck strips template arguments before
  # that walk but not a leading return type. This fails closed (the finding stays
  # breaking), so it is a usability defect rather than a hole, and naming the six
  # is a bounded workaround: a *seventh* such template would break the gate.
  - kind: func_removed_elf_only
    binding: weak
    namespace: 'daal'
    to: risk
    expires: 2027-03-01
    label: inlines-hidden-demotion
    reason: >-
      WEAK COMDAT inline/template export in the legacy `daal::` interfaceN
      surface, demoted to hidden by -fvisibility-inlines-hidden (makefile:134,
      added after the 2026.0.0 baseline tag), and reaching this gate through the
      ELF export-table delta because the binary-depth release fan-out has no
      declaration to report a visibility change against. Still defined as LOCAL
      FUNC in the new binary's .symtab, and no installed header declares
      `extern template`, so every consumer TU emits its own copy. A STRONG
      export disappearing is not matched by this rule and still gates.
  - kind: func_removed_elf_only
    binding: weak
    namespace: 'oneapi'
    to: risk
    expires: 2027-03-01
    label: inlines-hidden-demotion
    reason: >-
      Same -fvisibility-inlines-hidden demotion, in the `oneapi::dal::` surface.
      See the `daal::` rule above for the evidence; identical premises apply.
  - kind: func_removed_elf_only
    binding: weak
    namespace: 'sycl'
    to: risk
    expires: 2027-03-01
    label: inlines-hidden-demotion
    reason: >-
      Same -fvisibility-inlines-hidden demotion, for the DPC++ runtime's own
      inline surface that libonedal_dpc.so re-exported as WEAK COMDAT (17
      symbols, all under sycl::_V1::). oneDAL does not own this surface; it
      re-exported it by accident of COMDAT emission and no longer does.
  # The six function templates `namespace:` cannot reach, because their
  # demangled form is prefixed with a printed return type. Each is the same
  # -fvisibility-inlines-hidden demotion as the namespace rules above, named
  # individually so a seventh one is not silently covered.
  - kind: func_removed_elf_only
    binding: weak
    symbol: '_ZN6oneapi3dal6detail2v121homogen_table_builder5resetIdEERDaRKNS0_2v25arrayIT_EEll'
    to: risk
    expires: 2027-03-01
    label: inlines-hidden-demotion
    reason: >-
      auto& oneapi::dal::detail::v1::homogen_table_builder::reset<double>(...) --
      deduced-return function template, demangles with a leading `auto&` so no
      `namespace:` selector matches it.
  - kind: func_removed_elf_only
    binding: weak
    symbol: '_ZN6oneapi3dal6detail2v121homogen_table_builder5resetIfEERDaRKNS0_2v25arrayIT_EEll'
    to: risk
    expires: 2027-03-01
    label: inlines-hidden-demotion
    reason: >-
      auto& oneapi::dal::detail::v1::homogen_table_builder::reset<float>(...) --
      same deduced-return case as above.
  - kind: func_removed_elf_only
    binding: weak
    symbol: '_ZN6oneapi3dal6detail2v121homogen_table_builder5resetIiEERDaRKNS0_2v25arrayIT_EEll'
    to: risk
    expires: 2027-03-01
    label: inlines-hidden-demotion
    reason: >-
      auto& oneapi::dal::detail::v1::homogen_table_builder::reset<int>(...) --
      same deduced-return case as above.
  - kind: func_removed_elf_only
    binding: weak
    symbol: '_ZNK4daal15data_management10interface112NumericTable8getValueIiEET_mm'
    to: risk
    expires: 2027-03-01
    label: inlines-hidden-demotion
    reason: >-
      int daal::data_management::interface1::NumericTable::getValue<int>(unsigned
      long, unsigned long) const -- member function template, demangles with a
      leading `int` so no `namespace:` selector matches it.
  - kind: func_removed_elf_only
    binding: weak
    symbol: '_ZN4sycl3_V17handler4fillIdEEvPvRKT_m'
    to: risk
    expires: 2027-03-01
    label: inlines-hidden-demotion
    reason: >-
      void sycl::_V1::handler::fill<double>(void*, double const&, unsigned long)
      -- DPC++ runtime template, demangles with a leading `void` so no
      `namespace:` selector matches it.
  - kind: func_removed_elf_only
    binding: weak
    symbol: '_ZN4sycl3_V17handler4fillIfEEvPvRKT_m'
    to: risk
    expires: 2027-03-01
    label: inlines-hidden-demotion
    reason: >-
      void sycl::_V1::handler::fill<float>(void*, float const&, unsigned long) --
      same case as above.
  # ── The same demotion as `func_visibility_changed`, which is the kind it
  # arrives under once a declaration exists (header depth only; measured firing
  # zero times on the binary-depth gate). Scoped from the measurement rather
  # than mirrored from the removal rules above: all 230 findings on
  # `libonedal_core.so` are WEAK and 229 are under `daal::`, so there is no
  # `oneapi`/`sycl` rule here -- if a header-depth leg ever reports one outside
  # `daal::`, it should be added with its own count, not pre-emptively.
  - kind: func_visibility_changed
    binding: weak
    namespace: 'daal'
    to: risk
    expires: 2027-03-01
    label: inlines-hidden-demotion
    reason: >-
      Same -fvisibility-inlines-hidden demotion as the `func_removed_elf_only`
      rules above, reported as a visibility change because header depth has the
      declaration the binary-depth fan-out lacks: WEAK COMDAT inline/template in
      the legacy `daal::` interfaceN surface, still defined as LOCAL FUNC in the
      new binary's .symtab, with no `extern template` in any installed header. A
      STRONG export losing visibility is not matched by this rule and still
      gates.
  - kind: func_visibility_changed
    binding: weak
    symbol: '_ZNK4daal15data_management10interface112NumericTable8getValueIiEET_mm'
    to: risk
    expires: 2027-03-01
    label: inlines-hidden-demotion
    reason: >-
      The one of the 230 header-depth visibility findings `namespace: daal`
      cannot reach: int daal::data_management::interface1::NumericTable::getValue
      <int>(unsigned long, unsigned long) const demangles with a leading return
      type, so its first `::`-segment is `int daal`. Same symbol, same cause as
      the `func_removed_elf_only` entry above.
