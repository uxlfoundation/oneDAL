#
# Verdict policy for the LinuxAbicheckScan job in .github/workflows/ci.yml.
#
# A policy file, not a suppression file, deliberately: a suppression rule
# *removes* a matching change before the verdict and the counts are computed, so
# the finding leaves no trace in the report. A policy rule changes only the
# classification, so every difference stays in the report -- with its symbol and
# location -- while the verdict still answers "did oneDAL break its ABI".
# Measured on the real artifact: the six-rule suppression file this replaced
# dropped 17 findings while showing 3, six `func_visibility_changed` and one
# `type_vtable_changed` among them.
#
# `reclassify:` takes a suppression rule's selector grammar and keeps the
# finding, so four of the five tolerated things are scoped to the specific
# entities below; only `func_visibility_changed` is kind-global, for the reason
# recorded with it. Resolution order: `reclassify:` (first match in file order),
# then `overrides:`, then the base policy.
#
# Verified with this file by the abicheck commit both workflows pin
# (c599daf7), against the published baseline facts and against facts freshly
# captured by that commit -- both give the identical report -- on the
# no-debug-info build LinuxMakeDPCPP produces: bundle verdict NO_CHANGE, exit
# 0, 0 cross-library findings, every library COMPATIBLE_WITH_RISK with
# libonedal_core.so 79 findings, libonedal.so 59, libonedal_dpc.so 80,
# libonedal_parameters.so 2, libonedal_parameters_dpc.so 2,
# libonedal_thread.so 1 (COMPATIBLE). abi_breaking count 0, nothing removed
# from the report. Negative controls, measured on the per-library `scan` path
# this job replaced: with no policy file libonedal_core.so exits 4 (BREAKING,
# breaking=77); with every selector deliberately suffixed so each rule parses
# but matches nothing, libonedal.so moves COMPATIBLE_WITH_RISK -> API_BREAK,
# which is the proof the scoped rules and not the kind-global override
# reclassify those findings; and scanning 2026.0.0 against a main-side baseline,
# where symbols really are gone, still reports BREAKING with abi_breaking 28.
#
# Only `func_visibility_changed` and the `oneapi::dal::preview` rule match
# anything in this build configuration: without `--debug symbols` there are no
# vtable/layout facts and no public-constant values, so the three
# `type_vtable_changed` rules and the `constant_changed` rule are inert. They
# are kept because they were measured against a debug-info build of the same
# libraries, which is the configuration uxlfoundation/oneDAL#3725 would move
# this repository to.
#
# Each entry states the class of real break it would fail to *gate* on -- the
# honest cost of keeping these findings visible. In every case the finding is
# still reported, and the gate's SARIF carries a `policyReclassify` record
# naming the rule that fired, so the residual exposure is "a reviewer must
# look", not "a reviewer cannot know". The baseline and the scanner must be the
# same abicheck build or findings change for tooling reasons alone; that rule,
# and the measurements behind it, are in .github/abicheck/README.md.

base_policy: strict_abi

overrides:
  # 2026.0.0 -> main lost 2318 exported symbols from libonedal_core.so and
  # libonedal.so. Every one is a WEAK FUNC -- a COMDAT inline or template
  # instantiation that -fvisibility-inlines-hidden (added at makefile:134 after
  # the 2026.0.0 tag) stopped exporting. Verified: zero STRONG symbols and zero
  # data objects lost; zero _ZTV/_ZTI/_ZTS and zero _ZGV guard variables lost;
  # and cross-linking every lost export against the 1556 undefined symbols
  # required by all 183 built client objects gives an empty intersection. The
  # strongest evidence is the new binaries' own .symtab: all 2318 are still
  # present and defined there as LOCAL FUNC (1966/1966 and 352/352). The code
  # was not removed; only its export visibility was demoted.
  #
  # This accounts for 77 of the 79 findings on libonedal_core.so and 6 of the 7
  # on libonedal.so, and it goes away once a post-inlines-hidden release is
  # published as the baseline -- at which point this override should be deleted
  # rather than left to rot.
  #
  # Gives up: gating on a genuine visibility regression -- a STRONG exported
  # function that a future change stops exporting. It is the most dangerous
  # entry here and the one that cannot currently be narrowed. abicheck's
  # `binding:` selector is exactly the narrowing this wants, but binding
  # evidence is stamped onto the change record only on the removal path
  # (`Change.symbol_binding`, from the old side's `Function.elf_binding`);
  # oneDAL's findings take the other branch of diff_symbols.py's
  # _check_removed_function -- the symbol is still present and merely HIDDEN --
  # so `binding: weak` matches none of them, and `is_inline` is no proxy (an
  # in-class-defined, implicitly inline WEAK COMDAT member is recorded
  # is_inline false). Stamping `symbol_binding` on the visibility-changed
  # branch is a one-field upstream change; the day it lands this becomes a
  # `reclassify:` rule with `binding: weak` and STRONG demotions gate again.
  #
  # What this still buys over the suppression file it replaces was measured by
  # synthesizing that exact regression on a copy of the real snapshot
  # (oneapi::dal::v1::homogen_table::kind(), a non-inline non-template GLOBAL
  # symbol, set hidden and dropped from elf.symbols): under the suppression
  # file the visible finding set was byte-identical to the clean run's, exit 0,
  # the only trace being suppressed_count 16 -> 17, which nothing gates on.
  # Under this file the same regression appears as an additional
  # `[risk] func_visibility_changed` line naming the symbol and its header.
  func_visibility_changed: risk

reclassify:
  # ── Three named types: an evidence gap in abicheck's capture path, not a
  #    change in oneDAL ────────────────────────────────────────────────────────
  #
  # Three types report type_vtable_changed = BREAKING. Exactly four recorded
  # fields differ on each, all in the same direction -- the new side has no
  # layout facts at all: `vtable` loses its single slot (the implicit virtual
  # destructor, which all three types still have), `size_bits` and
  # `vptr_offset_bits` go to null and `base_offsets` to {}. Everything else on
  # the records is equal, including kind, virtual_bases, source_location,
  # data_size_bits, is_standard_layout and is_trivially_copyable.
  #
  # That asymmetry is abicheck's, not oneDAL's, and not baseline staleness: a
  # `dump` of the *current* tree under identical flags records
  # system_parameters with vtable = 1 slot, size_bits = 192 and base_offsets =
  # {base: 0}, byte-identical to the 2026.0.0 baseline's own record, while the
  # capture path records none of them. BREAKING is then reached through
  # `if t_old.size_bits is None or t_new.size_bits is None: return True` in
  # _vtable_transition_is_evidenced (diff_types.py:1227) -- an unknown size
  # refutes nothing. The same missing size_bits raises a paired,
  # non-escalating `layout_unverifiable` risk finding on the same type, and
  # that pairing is the reviewer's discriminator: a genuinely evidenced vtable
  # change has size_bits on both sides and so arrives *without* it. Reported
  # upstream and answered deliberately -- demoting an unevidenced vtable
  # transition could hide a real break -- so these are oneDAL's risk call, not
  # a wait on a fix.
  #
  # Gives up: gating on a real vtable change to one of these three types, which
  # these rules cannot tell from the capture gap. A vtable change on any other
  # type, including a same-named type elsewhere, still gates -- each rule is
  # scoped by the header the type is declared in. Delete them, do not let them
  # rot, when the capture gap is fixed upstream.
  - kind: type_vtable_changed
    symbol_pattern: "SerializableArgument"
    source_location: "cpp/daal/include/algorithms/algorithm_types.h"
    to: risk
    label: scan-layout-capture-gap
    reason: >-
      Scan-path capture gap, not an oneDAL change: the new side records no
      layout facts for this type (size_bits/base_offsets/vptr_offset_bits all
      absent), which abicheck counts as an evidenced vtable transition. Paired
      layout_unverifiable finding on the same type is the marker; `dump` of the
      same tree records the same vtable, size_bits and base_offsets as the
      baseline.
  - kind: type_vtable_changed
    symbol_pattern: "AlgorithmContainerIfaceImpl"
    source_location: "cpp/daal/include/algorithms/algorithm_container_base.h"
    to: risk
    label: scan-layout-capture-gap
    reason: >-
      Same scan-path capture gap as SerializableArgument, same paired
      layout_unverifiable marker.
  - kind: type_vtable_changed
    symbol_pattern: "system_parameters"
    source_location: "cpp/oneapi/dal/detail/parameters/system_parameters.hpp"
    to: risk
    label: scan-layout-capture-gap
    reason: >-
      Same scan-path capture gap as SerializableArgument, same paired
      layout_unverifiable marker.

  # ── oneapi::dal::preview: the same lost WEAK symbols under a second kind ────
  #
  # oneapi::dal::preview::spmd::communicator<...>'s bcast, allgatherv,
  # allreduce and sendrecv_replace also report as
  # experimental_removed_without_replacement. Verified: all four are in the
  # lost-WEAK set the override above accounts for, and
  # cpp/oneapi/dal/spmd/communicator.hpp still declares every one on both
  # sides -- one cause under two kinds, not a second removal. The namespace
  # selector matches the change's own identity, not its cause, so it cannot
  # reach a stable-namespace symbol whose cause happens to sit in preview::.
  #
  # Gives up: gating on a real removal from oneapi::dal::preview. An
  # experimental removal outside preview::, which the kind-global override this
  # replaces also covered, now gates.
  - kind: experimental_removed_without_replacement
    namespace: "oneapi::dal::preview"
    to: risk
    label: preview-experimental
    reason: >-
      oneapi::dal::preview is oneDAL's documented experimental namespace with
      no ABI promise. Today's four findings are the same lost WEAK COMDAT
      spmd::communicator symbols already reported as func_visibility_changed;
      the headers still declare all four on both sides.

  # ── One internal constant table ────────────────────────────────────────────
  #
  # A true positive worth printing and not failing on: main added
  # `{ uint64_t(cpu_feature::amx_bf16), "Intel(R) AMX bfloat16" }` to
  # cpu_feature_map in cpp/oneapi/dal/detail/cpu.hpp, an internal namespace.
  #
  # It arrives as two findings for one entity, under both
  # oneapi::dal::detail::v1::cpu_feature_map and
  # oneapi::dal::detail::cpu_feature_map with identical value hashes on both
  # spellings and both sides -- `v1` is a plain namespace re-exported by
  # `using v1::cpu_feature_map;` at cpu.hpp:103, which the snapshot records as
  # a second declaration. abicheck collapses the type and variable cases (the
  # "Duplicate type names skipped" warnings in this job's log); the constant
  # path has no equivalent, hence the pattern matching both spellings.
  #
  # Gives up: gating on a changed value of this one table. Every other constant
  # gates, including the daal:: root ones no namespace-scoped rule would cover.
  - kind: constant_changed
    symbol_pattern: "oneapi::dal::detail::(v1::)?cpu_feature_map"
    to: risk
    label: internal-cpu-feature-table
    reason: >-
      Internal (oneapi::dal::detail) CPU-feature name table gained an amx_bf16
      entry in main. Matched under both spellings because the
      `using v1::cpu_feature_map;` re-export at cpp/oneapi/dal/detail/cpu.hpp
      is recorded as a second declaration.
