# abicheck project configuration for both abicheck jobs in ci.yml, passed
# explicitly as their `build-config` input (it is not auto-discovered from here
# -- abicheck looks for `.abicheck.yml` at the repository root).
#
# Deliberately small, and now deliberately *consumer-only*: every setting the
# Action still takes as an input stays an input in ci.yml, so the two never
# disagree about the same knob. That leaves `bundle:` and `scope:` -- which the
# abicheck CLI used to accept as flags and no longer does, and which have no
# Action input.
#
# What is no longer here is the L2 header-AST `compile:` block, and its absence
# is load-bearing rather than an omission; see the end of this file.
#
# Measured with the pin both workflows carry, against the published 2026.0.0
# baselines: without this file the job is red (BREAKING, 218 cross-library
# findings, exit 4); with it, COMPATIBLE_WITH_RISK, exit 0, and a per-library
# table identical to the one the previous pin produced.

# oneDAL's SYCL libraries link MKL's SYCL interface libraries and the DPC++
# runtime, and nothing in the release directory provides them. abicheck's
# bundle analysis is unconditional since the `--no-bundle-analysis` flag was
# removed, and its resolver treats an unresolvable NEEDED soname as an
# intra-bundle dependency removal. Naming the providers as system-provided is
# the supported way to say "this library comes from outside the bundle" --
# abicheck ships a 43-entry default list, and these four are the ones oneDAL
# needs on top of it.
#
# Still load-bearing, and re-measured on the shape the gate now runs (a real
# ELF bundle on *both* sides -- the baseline-set's staged member binaries, not
# snapshots): dropping these four entries gives 212 `bundle_intra_dep_removed`
# findings, bundle verdict BREAKING, release verdict BREAKING, exit 4. With
# them: bundle COMPATIBLE_WITH_RISK, exit 0. The reviewer expectation that
# moving off raw-ELF construction onto stored-facts operands would make this
# list redundant does not hold -- an unresolvable NEEDED edge is unresolvable
# whichever way the operand was built.
#
# Entries are soname *stems* (no `.so.N`): abicheck matches a NEEDED soname
# exactly first, then falls back to a stem match, and the fallback only
# applies against a version-generic entry like these. What remains after this
# is 156 `bundle_intra_dep_signature_unverified` findings, reported and not
# gating (bundle verdict COMPATIBLE_WITH_RISK). The six `bundle_library_added`
# findings an earlier revision of this comment recorded are gone: they were an
# artifact of a snapshot-only old side, which made the whole bundle read as
# newly appeared. See "Staged member binaries" in .github/abicheck/README.md.
bundle:
  system_providers:
    - libmkl_sycl_blas
    - libmkl_sycl_lapack
    - libmkl_sycl_rng
    - libmkl_sycl_sparse

# What makes a library disappearing from the release red. `on_incomplete`
# governs abicheck's completeness axis, which is separate from the
# compatibility axis: a baseline snapshot with no counterpart in the new
# release directory is classified `not_supplied` ("NEW's inventory is not
# proven complete, so this is unmatched, not removed", ADR-065 D2), so it does
# not become a `removed library` finding and the step's
# `fail-on-removed-library: true` input never sees it. Measured by deleting
# libonedal_thread.so from the new side: exit 0 under the default `warn`,
# exit 1 under `block`. A full six-library release is a complete scope, so
# `block` does not touch a normal run (measured: exit 0, same verdict).
scope:
  on_incomplete: block

# ── No `compile:` block here, on purpose ────────────────────────────────────
#
# This file used to pin the L2 header-AST compile context (`frontend: castxml`,
# `std: c++17`). It cannot, now that the baselines are published as a
# baseline-set by `abicheck/abicheck/actions/baseline`: that action runs
# `abicheck dump` with only `-H`/`-I`/`--build-info`/`--depth`/`--version`/
# `--compression`/`-o`, and forwards neither `--config` nor `--sources`. A
# `compile:` block reaches a dump one of exactly two ways -- an explicit
# `--config`, or a `.abicheck.yml` auto-discovered *at the `--sources` tree
# root* -- and a baseline-set dump passes neither, so there is no route by which
# a pinned block could reach the baseline side at all. Copying this file to the
# workspace root does not help; discovery is anchored to `--sources`, not to the
# working directory.
#
# Pinning it on the candidate side alone is worse than not pinning it, and
# measurably so. A header-depth snapshot records its compile context as a
# profile fingerprint and abicheck refuses to compare across a mismatch, so a
# candidate that sets `std: c++17` against a baseline-set snapshot that could
# not becomes: "not comparable: old and new snapshots were extracted under
# different compile contexts (profile_fingerprint mismatch; differing fields:
# language_standard)", exit 16, no verdict. Measured on libonedal_parameters.so.
#
# With the block removed from both sides the two agree and the comparison is
# real. Measured, same pair: exit 0, `requested_depth`/`effective_depth`
# `headers`, `analysis_assurance.status: complete`, `depth_satisfied: true`,
# COMPATIBLE_WITH_RISK -- 0 breaking, 146 risk, 16 compatible additions, 3
# quality issues.
#
# Nothing is actually given up, which is why this is a fix and not a
# concession. The two keys were restating what abicheck resolves on its own:
# the config-less dump records `frontend: castxml` (`--ast-frontend auto`
# selects it when a supported castxml is on PATH, and abicheck requires
# >=0.6.11,<0.8.0 and never falls back to clang silently) and
# `language_standard: "probed:__cplusplus=201703L"` with
# `language_standard_explicit: "0"` -- C++17, probed from the frontend rather
# than asserted. Both sides now install the same checksum-pinned CastXML
# Superbuild (`dependency-source: system`, `install-deps: true`), so they
# resolve to the same fingerprint by construction, and any future divergence
# between publisher and consumer toolchains fails loudly at exit 16 instead of
# silently comparing across contexts -- which is the property the pinned block
# was there to provide.
#
# castxml is still what carries layout, and still buys nothing on this build:
# the clang JSON-AST backend "does not carry record size/alignment/offset
# layout", but measured, both frontends report `layout_unverified_detectors:
# ['dwarf', 'advanced_dwarf', 'layout_descriptor']` on every leg and agree on
# all five verdicts, because `LinuxMakeDPCPP` ships no DWARF for L1 to read
# either.
#
# The upstream ask that would let this block come back: a `build-config` input
# on `actions/baseline`, forwarded as `--config` to its `abicheck dump`. Until
# then a project that genuinely needs a non-default compile context -- one that
# `--ast-frontend auto` plus frontend probing does not already produce -- cannot
# publish a header-depth baseline-set at all.
