# abicheck project configuration for ci.yml's LinuxAbicheckScan job, passed
# explicitly as that step's `build-config` input (it is not auto-discovered
# from here -- abicheck looks for `.abicheck.yml` at the repository root).
#
# Deliberately only what has no other expression: every setting the Action
# still takes as an input stays an input in ci.yml, so the two never disagree
# about the same knob. That leaves the keys below -- the two the abicheck CLI
# used to accept as flags and no longer does, plus the L2 header-AST compile
# context, which the Action refuses as inputs on a release operand
# (`::error::` + exit 1, "the per-library fan-out never threads the L2 compile
# context to each pair's header dump") but reads from here without complaint,
# because the CLI *does* thread a config-supplied context per pair.
#
# Measured with the pin both workflows carry, against the published 2026.0.0
# baselines: without this file the job is red (BREAKING, 218 cross-library
# findings, exit 4); with it, COMPATIBLE_WITH_RISK, exit 0, and a per-library
# table identical to the one the previous pin produced.

# oneDAL's SYCL libraries link MKL's SYCL interface libraries and the DPC++
# runtime, which the baseline snapshots have no counterpart for: the old side
# of this comparison is six per-library snapshots, not a bundle, so every
# dependency edge reads as newly appeared. abicheck's bundle analysis is
# unconditional since the `--no-bundle-analysis` flag was removed, and its
# resolver treats an unresolvable NEEDED soname as an intra-bundle dependency
# removal (212 `bundle_intra_dep_removed` findings, enough to fail the job on
# its own). Naming the providers as system-provided is the supported way to
# say "this library comes from outside the bundle" -- abicheck ships a
# 43-entry default list, and these four are the ones oneDAL needs on top of
# it.
#
# Entries are soname *stems* (no `.so.N`): abicheck matches a NEEDED soname
# exactly first, then falls back to a stem match, and the fallback only
# applies against a version-generic entry like these. Six
# `bundle_library_added` findings remain after this -- one per oneDAL library,
# inherent to comparing snapshots against a real bundle -- and they are
# reported, not gating (bundle verdict COMPATIBLE).
bundle:
  system_providers:
    - libmkl_sycl_blas
    - libmkl_sycl_lapack
    - libmkl_sycl_rng
    - libmkl_sycl_sparse

# What makes a library disappearing from the release red. `on_incomplete`
# governs abicheck's completeness axis, which is separate from the
# compatibility axis: a baseline snapshot with no counterpart in the new
# release directory is classified `not_supplied` ("NEW's inventory is not
# proven complete, so this is unmatched, not removed", ADR-065 D2), so it does
# not become a `removed library` finding and the step's
# `fail-on-removed-library: true` input never sees it. Measured by deleting
# libonedal_thread.so from the new side: exit 0 under the default `warn`,
# exit 1 under `block`. A full six-library release is a complete scope, so
# `block` does not touch a normal run (measured: exit 0, same verdict).
scope:
  on_incomplete: block

# The L2 header-AST compile context. Only the toolchain-stable half lives here:
# the header set and the include root are per-workflow paths (the PR side reads
# the build artifact, the baseline side reads the tag's own source tree), so
# they stay `new-header:`/`new-include:` inputs in the two workflows.
#
# `frontend: castxml` is abicheck's own default, pinned rather than inherited
# because a frontend default that moved on its own would invalidate every
# published `.l2` baseline (see below), and because it is the frontend that can
# carry layout at all: the clang JSON-AST backend "does not carry record
# size/alignment/offset layout", so it cannot see a struct-layout break -- and
# this build ships no DWARF for L1 to see it instead. It buys nothing today:
# measured, both frontends report `layout_unverified_detectors: ['dwarf',
# 'advanced_dwarf', 'layout_descriptor']` on every leg, and the two agree on all
# five verdicts. abicheck requires castxml >=0.6.11,<0.8.0 and never falls back to
# clang silently, which is also why `dependency-source: conda-forge` is not
# optional on the steps that parse headers: Ubuntu 24.04's own castxml is
# 0.6.3 (too old, refused), and the PyPI `castxml` distribution is 0.4.5 and
# explicitly "not a supported default scanner setup". conda-forge's is 0.7.0.
#
# `std: c++17` is what oneAPI's public headers require; it is passed as
# `-std=c++17` and stated rather than inherited so a frontend default cannot
# move the parse out from under the baselines.
#
# Editing either key invalidates every published `.l2` baseline asset, and does
# so loudly rather than silently: a header-depth snapshot records the compile
# context it was extracted under as a profile fingerprint, and abicheck refuses
# to compare across a mismatch. Measured, by dumping baselines without `std:`
# and comparing them against a run that sets it: "not comparable: old and new
# snapshots were extracted under different compile contexts
# (profile_fingerprint mismatch; differing fields: language_standard)", exit 16,
# no verdict. That is why these two keys live here, in the one file both
# workflows pass as `build-config`, instead of as per-workflow inputs that could
# drift apart -- and why changing them obliges re-dispatching "Publish Abicheck
# Baseline" for every published tag in the same change.
compile:
  frontend: castxml
  std: c++17
