name: docker-validation CI

on:
  pull_request:
    branches:
      - main
    # The image runs only these files; `COPY .` adds the rest of the tree,
    # but nothing installs from it. Pushes to main are not filtered.
    paths:
      - 'dev/docker/**'
      - '.ci/env/**'
      - 'dev/download_tbb.sh'
      - '.github/workflows/docker-validation-ci.yml'
  push:
    branches:
      - main

permissions:
  contents: read

# A PR push cancels the older run of that PR. A push to main waits behind the
# running one, and a newer push replaces the waiting one, so the latest commit runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Docker validation
    if: github.repository == 'uxlfoundation/oneDAL'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build docker image
        run: docker build . --file dev/docker/onedal-dev.Dockerfile --tag onedal-dev:latest
