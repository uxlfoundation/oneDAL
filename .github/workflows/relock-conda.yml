# Re-pins gcc.bzl's conda builds and hashes on Renovate's GCC branches, since
# Renovate cannot compute them. Push token rules: see dev/bazel/README.md.
name: relock-conda

on:
  push:
    branches:
      - renovate/conda-forge-gcc_impl_linux-64-*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  relock:
    name: Re-pin the conda packages of gcc.bzl
    if: github.repository == 'uxlfoundation/oneDAL'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Re-pin
        run: python3 dev/bazel/deps/relock_conda.py
      - name: Push
        env:
          TOKEN: ${{ secrets.RELOCK_PUSH_TOKEN || github.token }}
        run: |
          if git diff --quiet; then
            echo "gcc.bzl already re-pinned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -am "build(bazel): re-pin the conda packages of gcc.bzl"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
