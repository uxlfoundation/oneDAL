# Called by ci.yml, ci-win.yml and ci-aarch64.yml: which build systems a pull
# request touches, so a Bazel-only dependency bump does not run the Make jobs.
name: Change-scope

on:
  workflow_call:
    outputs:
      make:
        description: "false when no changed file can affect a Make build"
        value: ${{ jobs.scope.outputs.make }}
      bazel:
        description: "false when no changed file can affect a Bazel build"
        value: ${{ jobs.scope.outputs.bazel }}

permissions:
  contents: read

jobs:
  scope:
    name: Build systems in the change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      make: ${{ steps.scope.outputs.make }}
      bazel: ${{ steps.scope.outputs.bazel }}
    steps:
      # The merge commit and its two parents: HEAD^1 is the target branch.
      - name: Checkout oneDAL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test the selector
        run: |
          python3 -m pip install --quiet pytest==9.0.3
          python3 -m pytest -q .ci/scripts/test_change_scope.py
      # The callers test the outputs for != 'false', so a failed or skipped
      # step here runs every job rather than none.
      - name: Classify the changed files
        id: scope
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          python3 .ci/scripts/change_scope.py --base HEAD^1 --head HEAD | tee -a "$GITHUB_OUTPUT"
