# CodeQL advanced setup. It replaces the repository's default setup, which
# never analyses pull requests from forks -- and most pull requests here come
# from forks -- so findings only surfaced after merge. The languages, query
# suite and categories match what default setup used, so existing alerts keep
# their history.

name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Same weekly slot default setup used: Thursdays, 08:10 UTC.
  schedule:
    - cron: '10 8 * * 4'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload results to code scanning. Pull requests from forks get a
      # read-only token, and code scanning accepts their results anyway.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
