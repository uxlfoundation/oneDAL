name: "Windows CI"

on:
  pull_request:
    branches:
      - main
      - 'feature/**'
    # Skip PR builds for changes that cannot affect the library build or tests.
    # Pushes to main are not filtered.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'dev/agent_evals/**'
      - 'conda-recipe/**'
      - 'third-party-programs.txt'
      - '.ci/pipeline/docs.yml'
      - '.github/CODEOWNERS'
      - '.github/renovate.json'
      - '.github/.licenserc.yaml'
      - '.github/.mergify.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/instructions/**'
      - '.github/workflows/check-intel-urls.yml'
      - '.github/workflows/ci-conda-recipe.yml'
      - '.github/workflows/coverity.yml'
      - '.github/workflows/docker-validation-nightly.yml'
      - '.github/workflows/docs-release.yml'
      - '.github/workflows/label-enforcement.yml'
      - '.github/workflows/nightly-build.yml'
      - '.github/workflows/nightly-test.yml'
      - '.github/workflows/openssf-scorecard.yml'
      - '.github/workflows/pr-checklist.yml'
      - '.github/workflows/renovate-validation.yml'
      - '.github/workflows/skywalking-eyes.yml'
      - '.github/workflows/slack-pr-notification.yml'
  push:
    branches:
      - main
      - 'feature/**'
  
permissions:
  contents: read

env:
  DEP_DIR: ${{ github.workspace }}/__deps
  TBB_VERSION: v2023.1.0
  OPENBLAS_VERSION: v0.3.34
  LLVM_VERSION: 22.1.8
  CMAKE_VERSION: 4.4.5
  NINJA_VERSION: 1.13.2
  VS_VER: 2026_build_tools

# A PR push cancels the older run of that PR. A push to main waits behind the
# running one, and a newer push replaces the waiting one, so the latest commit runs.
# Matters on the scarce ARM64 runners, where this workflow is the only consumer.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [
          { name: GitHub hosted, label: windows-11-vs2026-arm, cxx: clang, arch: arm64, isa: sve }
        ]
    name: Windows-${{ matrix.os.arch }}-${{ matrix.os.cxx }}-${{ matrix.os.isa }}-${{ matrix.os.name }}
    runs-on: ${{ matrix.os.label }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install LLVM for Win-${{ matrix.os.arch }}
        shell: pwsh
        run: .\.ci\env\llvm.ps1 -Arch ${{ matrix.os.arch }}

      - name: Install CMake and Ninja for Win-${{ matrix.os.arch }}
        shell: pwsh
        run: .\.ci\env\cmake_ninja.ps1 -Arch ${{ matrix.os.arch }}

      # openBLAS install is keyed on the build script and the runner. Saved only
      # from main; pull request jobs restore it and never write the main scope.
      - name: Restore OpenBLAS
        id: cache-openblas
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}\__deps\open_blas
          key: openblas-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENBLAS_VERSION }}-llvm-${{ env.LLVM_VERSION }}-cmake-${{ env.CMAKE_VERSION }}-ninja-${{ env.NINJA_VERSION }}-vs-${{ env.VS_VER }}-${{ hashFiles('.ci/env/openblas.bat') }}

      - name: Build OpenBLAS
        if: steps.cache-openblas.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          CALL "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.os.arch }}
          set PATH=%ProgramFiles%\LLVM\bin;%PATH%
          .ci\env\openblas.bat

      - name: Save OpenBLAS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-openblas.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}\__deps\open_blas
          key: openblas-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENBLAS_VERSION }}-llvm-${{ env.LLVM_VERSION }}-cmake-${{ env.CMAKE_VERSION }}-ninja-${{ env.NINJA_VERSION }}-vs-${{ env.VS_VER }}-${{ hashFiles('.ci/env/openblas.bat') }}

      - name: Build oneTBB
        shell: cmd
        run: |
          CALL "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.os.arch }}
          set PATH=%ProgramFiles%\LLVM\bin;%PATH%
          .ci\env\tbb.bat

      - name: Build daal
        shell: cmd
        run: |
          CALL "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.os.arch }}
          set PATH=%ProgramFiles%\LLVM\bin;%PATH%
          .ci\scripts\build.bat daal ${{ matrix.os.cxx }} ${{ matrix.os.isa }}

      - name: Build onedal_c
        shell: cmd
        run: |
          CALL "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.os.arch }}
          set PATH=%ProgramFiles%\LLVM\bin;%PATH%
          .ci\scripts\build.bat onedal_c ${{ matrix.os.cxx }} ${{ matrix.os.isa }}

      # `.ci/scripts/test.bat` runs each example executable with no timeout and
      # redirects its output to a file, so a crash that pops the Windows Error
      # Reporting dialog would wait for a click that never comes: the step then
      # hangs until the job limit instead of reporting the non-zero exit code.
      - name: Disable Windows Error Reporting dialogs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          New-Item -Path $wer -Force | Out-Null
          Set-ItemProperty -Path $wer -Name DontShowUI -Value 1 -Type DWord
          Set-ItemProperty -Path $wer -Name Disabled -Value 1 -Type DWord

      # OpenBLAS is linked statically (.ci/env/openblas.bat), so no oneDAL binary
      # may import a DLL named `openblas.dll`: that name is not oneDAL's to claim,
      # and Windows would resolve the import against whichever `openblas.dll` is
      # already loaded in the process. Same idea as `Verify ARM64 PE output` in
      # the Bazel job: check the artifact rather than trust the link.
      - name: Verify no OpenBLAS import
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          CALL "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.os.arch }}
          if errorlevel 1 exit /b 1
          set /a checked=0
          for /R __release_win_${{ matrix.os.cxx }} %%f in (onedal*.dll) do (
            set /a checked+=1
            dumpbin /nologo /dependents "%%f" > "%TEMP%\dependents.txt"
            rem A `dumpbin` that cannot read the binary would otherwise look the
            rem same as one reporting no match.
            if errorlevel 1 (
              echo ::error::dumpbin failed on %%f
              exit /b 1
            )
            findstr /I /C:"openblas" /C:"flang" "%TEMP%\dependents.txt" >nul && (
              echo ::error::%%f imports a math backend DLL
              type "%TEMP%\dependents.txt"
              exit /b 1
            )
          )
          rem Zero matches must not pass as "no bad imports": that is the shape a
          rem renamed release directory or a build that produced nothing takes.
          if !checked! equ 0 (
            echo ::error::no onedal*.dll found under __release_win_${{ matrix.os.cxx }}
            exit /b 1
          )
          echo checked !checked! libraries: no OpenBLAS or flang imports
          rem `findstr` leaves errorlevel 1 behind when it matches nothing, and
          rem `echo` does not clear it, so the step needs an explicit success.
          exit /b 0

      - name: Test daal
        timeout-minutes: 30
        shell: cmd
        run: |
          CALL "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.os.arch }}
          set PATH=%ProgramFiles%\LLVM\bin;%PATH%
          set "CMAKE_GENERATOR=Visual Studio 18 2026"
          .ci\scripts\test.bat daal\cpp "" ${{ matrix.os.cxx }} cmake

      - name: Test oneapi
        timeout-minutes: 30
        shell: cmd
        run: |
          CALL "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.os.arch }}
          set PATH=%ProgramFiles%\LLVM\bin;%PATH%
          set "CMAKE_GENERATOR=Visual Studio 18 2026"
          .ci\scripts\test.bat oneapi\cpp "" ${{ matrix.os.cxx }} cmake

  bazel-build:
    name: WindowsBazel_OpenBLAS(SVE)-GitHub hosted
    if: github.repository == 'uxlfoundation/oneDAL'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 180
    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # clang-cl / lld-link / llvm-lib are the toolchain oneDAL uses for
      # Windows ARM64, in both build systems
      # (dev/make/compiler_definitions/clang.ref.arm.mk and
      # dev/bazel/toolchains/cc_toolchain_win.bzl).
      - name: Install LLVM for Win-arm64
        shell: pwsh
        run: .\.ci\env\llvm.ps1 -Arch arm64

      - name: Install CMake and Ninja for Win-arm64
        shell: pwsh
        run: .\.ci\env\cmake_ninja.ps1 -Arch arm64

      # The script appends its install directory to GITHUB_PATH itself.
      - name: Install Bazelisk
        shell: pwsh
        run: .\.ci\env\bazelisk.ps1

      # Both `@openblas` and `@tbb` default to x86_64 packages (`@openblas` has
      # no download at all), so an ARM64 build of each has to be supplied
      # through OPENBLASROOT / TBBROOT. Without them the repo rules now fail
      # outright instead of producing wrong-arch binaries (see
      # `_check_download_arch` in dev/bazel/repos.bzl).
      # Build and export are split so a cache hit still exports OPENBLASROOT.
      - name: Restore OpenBLAS
        id: cache-openblas
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}\__deps\open_blas
          key: openblas-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENBLAS_VERSION }}-llvm-${{ env.LLVM_VERSION }}-cmake-${{ env.CMAKE_VERSION }}-ninja-${{ env.NINJA_VERSION }}-vs-${{ env.VS_VER }}-${{ hashFiles('.ci/env/openblas.bat') }}

      - name: Build OpenBLAS
        if: steps.cache-openblas.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          CALL "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          if errorlevel 1 exit /b 1
          rem `CALL` is required: without it cmd transfers control to the child
          rem script and never comes back, silently skipping the GITHUB_ENV write
          rem in the next step.
          CALL .ci\env\openblas.bat
          if errorlevel 1 exit /b 1

      - name: Export OpenBLAS root
        shell: cmd
        run: |
          rem The static archive is what @openblas links (dev/bazel/deps/openblas.bzl);
          rem assert it here so a half-installed tree fails at this step instead of
          rem inside the repository rule.
          if not exist "%CD%\__deps\open_blas\lib\openblas.lib" exit /b 1
          echo OPENBLASROOT=%CD%\__deps\open_blas>> "%GITHUB_ENV%"

      - name: Save OpenBLAS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-openblas.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}\__deps\open_blas
          key: openblas-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENBLAS_VERSION }}-llvm-${{ env.LLVM_VERSION }}-cmake-${{ env.CMAKE_VERSION }}-ninja-${{ env.NINJA_VERSION }}-vs-${{ env.VS_VER }}-${{ hashFiles('.ci/env/openblas.bat') }}

      - name: Build oneTBB
        shell: cmd
        run: |
          CALL "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          if errorlevel 1 exit /b 1
          CALL .ci\env\tbb.bat
          if errorlevel 1 exit /b 1
          if not exist "%CD%\__deps\tbb\win\tbb\lib\tbb12.lib" exit /b 1
          echo TBBROOT=%CD%\__deps\tbb\win\tbb>> "%GITHUB_ENV%"

      - name: bazel build core_dynamic
        shell: cmd
        env:
          BAZEL_SH: 'C:\msys64\usr\bin\bash.exe'
          # Windows ARM64 implies clang-cl either way; setting it keeps the
          # selection explicit in the log.
          ONEDAL_WIN_COMPILER: clang
        run: |
          CALL "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          rem Appended, not prepended: MSYS2 ships its own link.exe/find.exe/sort.exe,
          rem and this PATH is captured into the generated toolchain
          rem (`%{env_path}` in dev/bazel/toolchains/cc_toolchain_win.bzl), so it
          rem must not shadow the MSVC and LLVM tools.
          set PATH=%PATH%;C:\msys64\usr\bin
          rem `thread_dynamic` is what links `@openblas//:openblas` through
          rem `mathbackend_thread`, so it is listed explicitly: without it the
          rem lane would not exercise the new Windows OpenBLAS static archive
          rem at all.
          bazel build --platforms=@config//:windows_arm64 --backend_config=ref ^
            //cpp/daal:core_dynamic //cpp/daal:thread_dynamic //cpp/oneapi/dal:dynamic

      # A successful link is not proof of the target arch: confirm the PE
      # machine type, as the AArch64 Linux lane does with `readelf`
      # (.github/workflows/ci-aarch64.yml).
      - name: Verify ARM64 PE output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Windows DLLs carry the ABI major (`onedal_core.4.dll`) and, for an
          # `-MDd` build, a `d` suffix (dev/bazel/cc.bzl), so match by pattern
          # instead of spelling the version out here.
          foreach ($pattern in @("bazel-bin\cpp\daal\onedal_core*.dll",
                                 "bazel-bin\cpp\daal\onedal_thread*.dll",
                                 "bazel-bin\cpp\oneapi\dal\onedal.*.dll")) {
            $found = @(Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue)
            if ($found.Count -eq 0) {
              Write-Host "::error::no DLL matching $pattern was produced"
              exit 1
            }
            foreach ($lib in $found) {
              $headers = & "$env:ProgramFiles\LLVM\bin\llvm-readobj.exe" --file-headers $lib.FullName
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::error::llvm-readobj failed on $($lib.FullName)"
                exit 1
              }
              $headers | Select-String "Machine"
              if (-not ($headers | Select-String "IMAGE_FILE_MACHINE_ARM64")) {
                Write-Host "::error::$($lib.FullName) is not an ARM64 PE image"
                exit 1
              }
            }
          }

      # Same environment as `bazel build core_dynamic`: PATH is captured into
      # the generated toolchain, so any difference would rebuild everything.
      # --enable_runfiles: Windows builds no runfiles tree by default, and the
      # example finds its data CSVs only through it when DALROOT is unset. Set
      # here, not in .bazelrc: the Azure lanes would copy MKL into every tree.
      - name: bazel test oneapi example
        shell: cmd
        env:
          BAZEL_SH: 'C:\msys64\usr\bin\bash.exe'
          ONEDAL_WIN_COMPILER: clang
        run: |
          CALL "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          set PATH=%PATH%;C:\msys64\usr\bin
          bazel test --platforms=@config//:windows_arm64 --backend_config=ref ^
            --test_link_mode=dev --enable_runfiles --test_output=errors ^
            //examples/oneapi/cpp:kmeans_lloyd_dense_batch_host

  # x86_64 with plain MSVC `cl` (rules_cc's MSVC configuration, see
  # dev/bazel/toolchains/cc_toolchain_win.bzl). MKL and TBB come from the
  # `@mkl`/`@tbb` downloads, so the stock runner needs no Intel compiler.
  bazel-msvc:
    name: WindowsBazel_MKL(AVX2)-MSVC-GitHub hosted
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bazelisk
        shell: pwsh
        run: .\.ci\env\bazelisk.ps1

      # Located with vswhere rather than spelled out, so a runner image that
      # moves to another Visual Studio release keeps working.
      - name: Locate Visual Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            Write-Host "::error::no Visual Studio with the x64 C++ tools found"
            exit 1
          }
          "VS_INSTALL_DIR=$vs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: bazel test oneapi example
        shell: cmd
        env:
          BAZEL_SH: 'C:\Program Files\Git\bin\bash.exe'
          ONEDAL_WIN_COMPILER: cl
        run: |
          if not exist "%BAZEL_SH%" (
            echo ::error::Bazel shell not found: %BAZEL_SH%
            exit /b 1
          )
          CALL "%VS_INSTALL_DIR%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          rem A short output root keeps object paths under MAX_PATH, as in the
          rem Azure Bazel lane (.ci/pipeline/ci.yml, BAZEL_OUTPUT_USER_ROOT).
          bazel --output_user_root=C:\b test --cpu=avx2 --test_link_mode=dev --enable_runfiles --test_output=errors ^
            //examples/oneapi/cpp:kmeans_lloyd_dense_batch_host
