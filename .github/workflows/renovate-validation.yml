name: renovate-validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/renovate-validation.yml
      - .github/renovate.json
      - .ci/env/apt.sh
      - .ci/env/tbb.sh
      - dev/bazel/deps/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/renovate-validation.yml
      - .github/renovate.json
      - .ci/env/apt.sh
      - .ci/env/tbb.sh
      - dev/bazel/deps/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Renovate validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate
        uses: suzuki-shunsuke/github-action-renovate-config-validator@1e1604219a6b38ae9a10aff42a28a3656322c31a # v2.4.1
        with:
          config_file_path: .github/renovate.json
  pins:
    name: Make and Bazel dependency pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: oneMKL and oneTBB releases match
        run: python3 dev/bazel/deps/check_pins.py
      # Queries api.anaconda.org, so only when gcc.bzl itself changed: a conda-forge
      # rebuild or an API outage must not fail an unrelated dependency change.
      - name: conda pins of gcc.bzl are complete
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE" HEAD -- dev/bazel/deps/gcc.bzl 2>/dev/null; then
            echo "gcc.bzl unchanged; skipping"
          else
            python3 dev/bazel/deps/relock_conda.py --check
          fi
