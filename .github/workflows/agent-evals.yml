# No-LLM checks: dokimi's reusable repo-eval workflow, pinned by SHA. No model call, no token.
# Runs on eval-path PRs, weekly (schedule) and on demand (workflow_dispatch).
name: Agent evals

on:
  pull_request:
    branches: [main]
    paths:
      - 'dev/agent_evals/**'
      - '**/AGENTS.md'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/agent-evals.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Space-separated task ids for the self-check (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  # The task sets come from the task.json tiers (run.py), not from a list here; the bazel versions must match the
  # committed task-bazel-versions.txt that the eval image pre-fetches.
  plan:
    name: eval sets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      retired: ${{ steps.sets.outputs.retired }}
      smoke: ${{ steps.sets.outputs.smoke }}
    steps:
      # Full history: `bazel-versions --check` reads each task base's .bazelversion.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Task sets and bazel versions
        id: sets
        run: |
          set -euo pipefail
          python3 dev/agent_evals/run.py validate
          python3 dev/agent_evals/run.py bazel-versions --check
          echo "retired=$(python3 dev/agent_evals/run.py list --tier retired | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "smoke=$(python3 dev/agent_evals/run.py list --smoke | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "retired (not in tasks: all): $(python3 dev/agent_evals/run.py list --tier retired | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
          echo "smoke (set for a harness change): $(python3 dev/agent_evals/run.py list --smoke | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

  repo-eval:
    name: dokimi
    needs: plan
    if: github.repository == 'uxlfoundation/oneDAL' || github.event_name != 'schedule'
    permissions:
      contents: read
    # intel/dokimi main; keep the two SHAs equal, and update them together with any change the new version needs in
    # repo-eval.yaml or the tasks
    uses: intel/dokimi/.github/workflows/repo-eval.yml@09be35bf0a1e887ba7b146357b839052c830c3b9
    with:
      dokimi-ref: 09be35bf0a1e887ba7b146357b839052c830c3b9
      manifest: dev/agent_evals/repo-eval.yaml
      tasks: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tasks || 'all') || 'changed' }}
      # retired tasks are left out of `all` and of the smoke set; a task named by hand on workflow_dispatch is skipped too
      exclude-tasks: ${{ needs.plan.outputs.retired }}
      smoke-tasks: ${{ needs.plan.outputs.smoke }}
      # fix_cel_thread_race needs 4+ Intel CPUs (its task.json `host`); a hosted runner may be AMD or smaller, where
      # its null run would pass. dokimi then reports it unsupported, with the reason, and this passes the job.
      allow-unsupported: true
      # the caches start empty on a hosted runner: null and oracle run with network
      warm: true
      runs-on: ubuntu-24.04
      max-parallel: 4  # shares the org runner pool with the main CI
      timeout-minutes: 180
