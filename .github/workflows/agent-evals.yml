# No-LLM checks: dokimi's reusable repo-eval workflow, pinned by SHA. No model call, no token.
# Runs on eval-path PRs, weekly (schedule) and on demand (workflow_dispatch).
name: Agent evals

on:
  pull_request:
    branches: [main]
    paths:
      - 'dev/agent_evals/**'
      - '**/AGENTS.md'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/agent-evals.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Space-separated task ids for the self-check (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  repo-eval:
    name: dokimi
    if: github.repository == 'uxlfoundation/oneDAL' || github.event_name != 'schedule'
    permissions:
      contents: read
    # intel/dokimi main; keep the two SHAs equal, and update them together with any change the new version needs in
    # repo-eval.yaml or the tasks
    uses: intel/dokimi/.github/workflows/repo-eval.yml@09be35bf0a1e887ba7b146357b839052c830c3b9
    with:
      dokimi-ref: 09be35bf0a1e887ba7b146357b839052c830c3b9
      manifest: dev/agent_evals/repo-eval.yaml
      tasks: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tasks || 'all') || 'changed' }}
      smoke-tasks: >-
        build_kmeans_host build_make_gnu build_release_host fix_finiteness_mut fix_avx2_dispatch
        review_seeded_fc review_replay_pr3580 test_add_chebyshev
      # fix_cel_thread_race needs 4+ Intel CPUs (its task.json `host`); a hosted runner may be AMD or smaller, where
      # its null run would pass. dokimi then reports it unsupported, with the reason, and this passes the job.
      allow-unsupported: true
      # the caches start empty on a hosted runner: null and oracle run with network
      warm: true
      runs-on: ubuntu-24.04
      max-parallel: 4  # shares the org runner pool with the main CI
      timeout-minutes: 180
