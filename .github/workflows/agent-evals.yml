# No-LLM checks for dev/agent_evals with dokimi's reusable repo-eval workflow
# (https://github.com/intel/dokimi/blob/main/.github/workflows/repo-eval.yml), pinned by commit SHA.
# Nothing here calls a model or needs a token.
#  - `dokimi repo validate` (a gate) and `dokimi repo scan` (report only): on every change to the eval directory or
#    to agent guidance, a few minutes.
#  - `dokimi repo tasks check` (untouched workspace must fail, reference solution must pass) in the eval image:
#    weekly and on demand for every task; on a pull request only for the tasks it touches, or for one task per
#    grader (smoke-tasks) when the entry points, a grader, the manifest or this file change.
name: Agent evals

on:
  pull_request:
    branches: [main]
    paths:
      - 'dev/agent_evals/**'
      - '**/AGENTS.md'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/agent-evals.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Space-separated task ids for the self-check (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  repo-eval:
    name: dokimi
    if: github.repository == 'uxlfoundation/oneDAL' || github.event_name != 'schedule'
    permissions:
      contents: read
    # intel/dokimi main; keep the two SHAs equal, and update them together with any change the new version needs in
    # repo-eval.yaml or the tasks
    uses: intel/dokimi/.github/workflows/repo-eval.yml@ad1cbd0873d5d9e3b7a6537c705169d80e91ae42
    with:
      dokimi-ref: ad1cbd0873d5d9e3b7a6537c705169d80e91ae42
      manifest: dev/agent_evals/repo-eval.yaml
      tasks: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tasks || 'all') || 'changed' }}
      smoke-tasks: >-
        build_kmeans_host build_make_gnu build_release_host fix_finiteness_mut fix_avx2_dispatch
        review_seeded_fc review_replay_pr3580 test_add_chebyshev
      # fix_cel_thread_race needs 4+ Intel CPUs (its task.json `host`); a hosted runner may be AMD, where its null
      # run passes. dokimi does not judge the host under --warm (needed here: caches start empty), and the workflow
      # cannot pass --allow-unsupported yet (intel/dokimi#156), so it is not checked here.
      exclude-tasks: fix_cel_thread_race
      # the caches start empty on a hosted runner: null and oracle run with network
      warm: true
      runs-on: ubuntu-24.04
      max-parallel: 4  # shares the org runner pool with the main CI
      timeout-minutes: 180
