# No-LLM checks for dev/agent_evals with dokimi (https://github.com/intel/dokimi), installed at a pinned commit.
# Nothing here calls a model or needs a token.
#  - `dokimi repo validate` (a gate) and `dokimi repo scan` (report only): on every change to the eval directory or
#    to agent guidance, a few minutes.
#  - `dokimi repo tasks check` (untouched workspace must fail, reference solution must pass) in the eval image:
#    weekly and on demand for every task; on a pull request only for the tasks it touches, or for one task per
#    grader when the entry points or a grader change.
name: Agent evals

on:
  pull_request:
    branches: [main]
    paths:
      - 'dev/agent_evals/**'
      - '**/AGENTS.md'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/agent-evals.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Space-separated task ids for the self-check (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
  # intel/dokimi main; update the SHA together with any change the new version needs in repo-eval.yaml or the tasks
  DOKIMI_SHA: 6e695ce27511248562202f83b264d14264d84b03
  MANIFEST: dev/agent_evals/repo-eval.yaml

jobs:
  validate:
    name: Validate tasks and guidance
    if: github.repository == 'uxlfoundation/oneDAL' || github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tasks: ${{ steps.select.outputs.tasks }}
    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # every task base must resolve, and workspaces are archived from those commits
          persist-credentials: false
      - name: Install dokimi
        run: |
          python3 -m venv "$RUNNER_TEMP/dokimi"
          "$RUNNER_TEMP/dokimi/bin/pip" install -q \
            -c "https://raw.githubusercontent.com/intel/dokimi/$DOKIMI_SHA/dokimi/requirements.lock.txt" \
            "dokimi @ git+https://github.com/intel/dokimi@$DOKIMI_SHA#subdirectory=dokimi"
          echo "$RUNNER_TEMP/dokimi/bin" >> "$GITHUB_PATH"
      - name: Validate task definitions
        run: dokimi repo validate .@HEAD --manifest "$MANIFEST"
      - name: Check guidance claims against the tree (report only)
        run: |
          dokimi repo scan .@HEAD --manifest "$MANIFEST" --out readiness.json 2>&1 | tee scan.txt
          { echo "### Guidance claims"; echo; echo '```text'; cat scan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload guidance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-evals-static
          path: readiness.json
      - name: Select tasks for the self-check
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_TASKS: ${{ github.event.inputs.tasks }}
        run: |
          all=$(ls dev/agent_evals/tasks)
          # one task per grader: what a change to the entry points or a grader is checked against on a pull request
          smoke="build_kmeans_host build_make_gnu build_release_host fix_finiteness_mut fix_avx2_dispatch
                 review_seeded_fc review_replay_pr3580 test_add_chebyshev"
          # fix_cel_thread_race only shows its bug on 4+ Intel CPUs; until dokimi reports such a task as unsupported
          # on other hosts (task `host` requirements, intel/dokimi#41 step D3) it would be a false pass or a false
          # failure on a hosted runner, so it is not self-checked here.
          skip="fix_cel_thread_race"
          if [ "$EVENT" = schedule ]; then
            sel=$all
          elif [ "$EVENT" = workflow_dispatch ]; then
            sel=${INPUT_TASKS:-$all}
          else
            changed=$(git diff --name-only "$BASE" HEAD -- dev/agent_evals)
            sel=$(echo "$changed" | sed -n 's|^dev/agent_evals/tasks/\([^/]*\)/.*|\1|p' | sort -u)
            if echo "$changed" | grep -v '^dev/agent_evals/tasks/' | grep -v '\.md$' | grep -q .; then
              sel="$sel $smoke"
            fi
          fi
          json=$(for t in $sel; do [[ "$t" =~ ^[A-Za-z0-9_]+$ && -d "dev/agent_evals/tasks/$t" && " $skip " != *" $t "* ]] && echo "$t"; done | sort -u | python3 -c \
            'import json, sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "tasks=$json" >> "$GITHUB_OUTPUT"
          echo "Self-check tasks: $json"

  self-check:
    name: Self-check ${{ matrix.task }}
    needs: validate
    if: needs.validate.outputs.tasks != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4  # shares the org runner pool with the main CI
      matrix:
        task: ${{ fromJSON(needs.validate.outputs.tasks) }}
    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dokimi
        run: |
          python3 -m venv "$RUNNER_TEMP/dokimi"
          "$RUNNER_TEMP/dokimi/bin/pip" install -q \
            -c "https://raw.githubusercontent.com/intel/dokimi/$DOKIMI_SHA/dokimi/requirements.lock.txt" \
            "dokimi @ git+https://github.com/intel/dokimi@$DOKIMI_SHA#subdirectory=dokimi"
          echo "$RUNNER_TEMP/dokimi/bin" >> "$GITHUB_PATH"
      - name: Run the self-check
        # dokimi builds the eval image from the tree without its tasks, prepares the null and oracle workspaces as
        # for an agent, and runs the grade/oracle entry points of repo-eval.yaml in the image. The caches start
        # empty on a hosted runner, so it runs with network (--warm); task bases resolve modules from a BCR mirror.
        env:
          TASK: ${{ matrix.task }}
        run: |
          c="$RUNNER_TEMP/cache"
          mkdir -p "$c"
          git clone -q --depth 1 https://github.com/bazelbuild/bazel-central-registry "$c/bazel-registry"
          dokimi repo tasks check .@HEAD --manifest "$MANIFEST" --task "$TASK" --warm \
            --cache-root "$c" --out "$RUNNER_TEMP/check"
      - name: Upload self-check logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-evals-check-${{ matrix.task }}
          path: |
            ${{ runner.temp }}/check/check/check.json
            ${{ runner.temp }}/check/check/*/grade.json
            ${{ runner.temp }}/check/check/*/*.log
            ${{ runner.temp }}/check/check/*/*.err
          if-no-files-found: ignore
