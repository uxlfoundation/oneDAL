name: PR CI

# Pull request CI. The label check and LinuxBazelNoCompiler run first, and the
# test workflows start only after both pass, so a change that does not build
# does not hold the other runners. Pushes to main start ci.yml, ci-win.yml and
# ci-aarch64.yml directly, without the gate.

on:
  pull_request:
    # ready_for_review starts the jobs a draft skipped. labeled and unlabeled
    # rerun the label check; the build reruns only if this commit has no
    # passing or running build yet.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches:
      - main
    # Skip PR builds for changes that cannot affect the library build or tests.
    # Pushes to main are not filtered.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'dev/agent_evals/**'
      - 'conda-recipe/**'
      - 'third-party-programs.txt'
      - '.ci/pipeline/docs.yml'
      - '.github/CODEOWNERS'
      - '.github/renovate.json'
      - '.github/.licenserc.yaml'
      - '.github/.mergify.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/instructions/**'
      - '.github/workflows/check-intel-urls.yml'
      - '.github/workflows/ci-conda-recipe.yml'
      - '.github/workflows/coverity.yml'
      - '.github/workflows/docker-validation-nightly.yml'
      - '.github/workflows/docs-release.yml'
      - '.github/workflows/nightly-build.yml'
      - '.github/workflows/nightly-test.yml'
      - '.github/workflows/openssf-scorecard.yml'
      - '.github/workflows/pr-checklist.yml'
      - '.github/workflows/renovate-validation.yml'
      - '.github/workflows/skywalking-eyes.yml'
      - '.github/workflows/slack-pr-notification.yml'

permissions:
  contents: read

# Label events have their own group, so changing a label never cancels a
# running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && 'labels' || 'build' }}
  cancel-in-progress: true

jobs:
  labels:
    name: Labels
    if: github.event.pull_request.state == 'open'
    uses: ./.github/workflows/label-enforcement.yml

  # On a label event the build is skipped when another PR CI run of this
  # commit has passed or is still running.
  build_needed:
    name: Build needed
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        run: |
          needed=true
          if [ "$ACTION" = labeled ] || [ "$ACTION" = unlabeled ]; then
            others=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"$WORKFLOW\" and .id != $RUN_ID and (.status != \"completed\" or .conclusion == \"success\"))] | length")
            [ "$others" = 0 ] || needed=false
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  gate:
    name: Gate
    needs: build_needed
    if: needs.build_needed.outputs.needed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      part: gate

  linux:
    name: Linux
    needs: [labels, gate]
    uses: ./.github/workflows/ci.yml
    with:
      part: tests

  windows:
    name: Windows
    needs: [labels, gate]
    uses: ./.github/workflows/ci-win.yml

  aarch64:
    name: AArch64
    needs: [labels, gate]
    # A called workflow may not ask for more than its caller grants.
    permissions: read-all
    uses: ./.github/workflows/ci-aarch64.yml
