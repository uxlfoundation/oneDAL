name: CI Conda Recipe

on:
  pull_request:
    # ready_for_review starts the jobs a draft pull request skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'conda-recipe/**'
      - '.github/workflows/ci-conda-recipe.yml'
      - 'makefile'
      - 'dev/make/**'
  push:
    branches:
      - main

permissions:
  contents: read

# A PR push cancels the older run of that PR. A push to main waits behind the
# running one, and a newer push replaces the waiting one, so the latest commit runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Draft pull requests skip this job; it runs once the pull request is
  # marked ready for review.
  LinuxCondaRecipe:
    if: github.repository == 'uxlfoundation/oneDAL' && !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cxx: gxx, version: "15" }
          # clang-21 gives compilation errors coming from immintrin.h header
          - { cxx: clangxx, version: "20" }
          - { cxx: dpcpp, version: "2025" }
        # A pull request builds the recipe with gxx only; pushes to main build all three.
        exclude:
          - compiler: ${{ github.event_name == 'pull_request' && fromJSON('{"cxx":"clangxx","version":"20"}') || fromJSON('{"cxx":"none"}') }}
          - compiler: ${{ github.event_name == 'pull_request' && fromJSON('{"cxx":"dpcpp","version":"2025"}') || fromJSON('{"cxx":"none"}') }}
    name: Linux(${{ matrix.compiler.cxx }}-${{ matrix.compiler.version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fetch tags for conda-build
      - name: System Info
        run: .ci/scripts/describe_system.sh
      - name: Install Miniforge
        run: |
          .ci/env/apt.sh miniforge
          echo "/usr/share/miniconda/bin" >> "${GITHUB_PATH}"
      - name: Conda update
        run: |
          echo -e "default_channels:\n  - https://conda.anaconda.org/conda-forge" > ~/.condarc
          conda config --add channels conda-forge
          conda config --set channel_priority strict
          conda config --set remote_max_retries 10
          conda config --set remote_backoff_factor 2
          conda update -y -q conda python
          conda install -y -q -n base conda-build
      - name: Conda build and test
        run: |
          conda build . \
            --variants "{cxx_compiler: ${{ matrix.compiler.cxx }}, cxx_compiler_version: ${{ matrix.compiler.version }}}"
        env:
          # Note: AVX2 is used as the most common denominator for CI systems
          REQCPU: avx2
