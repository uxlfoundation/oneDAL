# Publishes the ABI baselines that ci.yml's LinuxAbicheckScan job compares
# against: one abicheck snapshot per public library, dumped from a release tag
# built the same way the PR-side build is, uploaded as release assets, with
# their sha256 digests committed to the repository as the trust anchor.
#
# The full picture -- why the snapshots are not committed themselves, why the
# digest file is, why the tag has to be rebuilt rather than downloaded, and how
# to rotate to a newer baseline -- is in .github/abicheck/README.md.
name: Publish Abicheck Baseline

on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: "oneDAL release tag to publish as the abicheck baseline"
        required: true
        default: "2026.0.0"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  PublishBaseline:
    if: github.repository == 'uxlfoundation/oneDAL'
    runs-on: ubuntu-24.04
    # Measured end to end against the abicheck commit pinned below, on the
    # no-debug-info build this workflow produces: the daal snapshot takes
    # 7m42s / 3.32 GiB peak RSS, oneapi::dal 4m23s / 1.79 GiB and
    # oneapi::dal-dpc 11m45s / 4.81 GiB -- ~24 min of dumping, all three well
    # inside a 16 GB standard runner. (An earlier revision of this workflow had
    # to fallocate a 16 G swapfile for a debug-info daal dump; abicheck's
    # bounded DWARF DIE cache and the no-debug-info build together removed
    # that need.) Every pin bump so far has landed within noise of these
    # figures (the two previous pins measured 7m38s / 4m24s / 11m43s and
    # 7m40s / 4m23s / 12m06s), so re-pinning has been a correctness change
    # here, never a cost one.
    #
    # The three builds took 1m32s + 16s + 1m41s at -j64 on a 224-core host, so
    # those are a lower bound: on a standard runner the builds, not the dumps,
    # dominate this job, which is why the timeout stays at 180 rather than
    # tracking the measured ~24 min of dumping.
    timeout-minutes: 180
    env:
      ABICHECK_BASELINE_DIR: __abi_baselines
      # The bytes actually on the release after the publish step: this run's
      # freshly dumped snapshot for a new asset, the already-published asset for
      # one that exists. The digest file is computed from here, never from
      # ABICHECK_BASELINE_DIR, because those two differ on a re-run.
      ABICHECK_PUBLISHED_DIR: __abi_published
    steps:
      - name: Resolve baseline tag
        id: baseline
        run: |
          set -euo pipefail
          tag="${{ inputs.baseline_tag }}"
          if [ -z "$tag" ]; then
            tag="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$tag" ]; then
            echo "::error::No baseline tag: neither the baseline_tag input nor a release tag_name is set."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Explicitly on `main` (not whatever ref triggered this workflow -- for
      # the `release: published` trigger that would be the release's tag), since
      # the digest file gets committed back here.
      - name: Checkout oneDAL main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Checkout oneDAL sources at the baseline tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.baseline.outputs.tag }}
          path: __baseline_src

      - name: Install DPC++
        working-directory: __baseline_src
        run: .ci/env/apt.sh dpcpp
      - name: Install MKL
        working-directory: __baseline_src
        run: .ci/env/apt.sh mkl

      # The same three targets, the same ISA and the same debug setting as
      # ci.yml's LinuxMakeDPCPP job, so the baseline binaries match what every
      # PR is actually compared against: daal produces libonedal_core.so,
      # oneapi_c produces libonedal.so, oneapi_dpc produces libonedal_dpc.so.
      #
      # No --debug symbols, because LinuxMakeDPCPP does not pass it either. The
      # scan is L2 (headers + exported symbols) and needs no DWARF, but the two
      # sides do have to agree: if the PR-side build ever starts building with
      # debug info, re-dispatch this workflow for the published tags -- the same
      # rule that applies to bumping the abicheck pin.
      #
      # No --jobs either: .ci/scripts/build.sh already falls back to
      # -j$(nproc --all) on Linux, so the build sizes itself to whatever runner
      # it lands on instead of hard-coding a number.
      - name: Build daal + oneapi_c + oneapi_dpc (avx2)
        working-directory: __baseline_src
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/build.sh --compiler icx --optimizations avx2 --target daal
          rm -rf __work
          .ci/scripts/build.sh --compiler icx --optimizations avx2 --target oneapi_c
          rm -rf __work
          .ci/scripts/build.sh --compiler icx --optimizations avx2 --target oneapi_dpc
          rm -rf __work

      - name: Ensure output directories exist
        run: mkdir -p "${ABICHECK_BASELINE_DIR}" .github/abicheck/baselines

      - name: Put icpx on PATH
        run: |
          source /opt/intel/oneapi/setvars.sh
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # Three dumps, one per public library, each with the header roots,
      # frontend and compile options its matching scan in ci.yml uses. Those
      # header lists must stay byte-for-byte in step with that job's: a baseline
      # dumped from a different header set than the scan uses reports every
      # header-only difference as a spurious add/remove.
      #
      # public-header-dir is absent here, and absent from the scan steps too --
      # the two have to agree or abicheck refuses to compare the snapshots at
      # all (scope_fingerprint covers public_header_dirs). `dump` has no such
      # flag any more; the Action forwards the input as one more -H root, which
      # for a *directory* parses every header in the tree in one aggregate TU
      # and fails outright on both of oneDAL's header trees. What that costs on
      # the scan side, and why the comparison is worth more than the four
      # provenance cross-checks it gives up, is in .github/abicheck/README.md
      # ("Known gap").
      #
      # The .json.zst suffix is load-bearing: abicheck infers the compression
      # envelope from it (--compression auto) on both the dump and the scan
      # side, and an uncompressed snapshot is 115-152 MiB against ~2 MiB
      # compressed, with identical findings.
      #
      # Keep this pin equal to the three in ci.yml's LinuxAbicheckScan job, and
      # re-dispatch this workflow for every published tag whenever that pin
      # moves. Mismatched pins do not fail in any way that points at the cause:
      # they either under-report silently, or fail *loudly for the wrong
      # reason*. Both halves of that are measured, not hypothetical.
      #
      # The loud half, seen while validating an earlier bump: abicheck fixed a
      # dumper bug where an enumerator whose initializer's folded value sits on
      # an intermediate clang AST wrapper node (`csrArray = 1 << 4`) fell back
      # to positional auto-increment, so `NumericTableIface::StorageLayout` was
      # recorded as csrArray=3, arrow=4 instead of 16 and 2048. Scanning an
      # unchanged source tree with the new pin against baselines dumped by the
      # old one therefore reported 155 breaking `enum_member_value_changed`
      # findings for libonedal_core.so and 125 for libonedal_dpc.so -- exit 4,
      # a red X, and nothing in the report naming the baseline as the cause.
      # Re-dumping the same tag with the same pin as the scanner took all 280 to
      # zero with no other change.
      #
      # What that obliges is re-*verifying* on every bump, not blindly
      # re-dumping. Bumping to the pin below needed no new baselines: scanning
      # the unchanged tree with it against the previous pin's snapshots produced
      # reports identical line-for-line apart from timings, and re-dumping all
      # three anyway differed only in created_at and in L5 source_graph edge
      # order. Do that check before landing a bump; if the reports differ,
      # re-dispatch this workflow for every published tag first. See
      # .github/abicheck/README.md.
      - name: Dump baseline snapshot (daal)
        uses: abicheck/abicheck@b6ec8b493e84937856fc75afddf6e606477b24d3 # main
        with:
          mode: dump
          new-library: __baseline_src/__release_lnx/daal/latest/lib/intel64/libonedal_core.so
          new-header: >-
            __baseline_src/cpp/daal/include/daal.h
            __baseline_src/cpp/daal/include/algorithms/tsne/tsne_gradient_descent.h
            __baseline_src/cpp/daal/include/data_management/data/internal/finiteness_checker.h
            __baseline_src/cpp/daal/include/data_management/data/internal/roc_auc_score.h
            __baseline_src/cpp/daal/include/data_management/data/internal/train_test_split.h
            __baseline_src/cpp/daal/include/services/internal/hash_table.h
            __baseline_src/cpp/daal/include/data_management/data/internal/base_arrow_numeric_table.h
          include: __baseline_src/cpp/daal/include
          new-version: ${{ steps.baseline.outputs.tag }}
          depth: headers
          ast-frontend: clang
          gcc-path: icpx
          gcc-options: "-std=c++17"
          output-file: "${{ env.ABICHECK_BASELINE_DIR }}/${{ steps.baseline.outputs.tag }}-daal.abicheck.json.zst"
      - name: Dump baseline snapshot (oneapi::dal)
        uses: abicheck/abicheck@b6ec8b493e84937856fc75afddf6e606477b24d3 # main
        with:
          mode: dump
          new-library: __baseline_src/__release_lnx/daal/latest/lib/intel64/libonedal.so
          new-header: >-
            __baseline_src/cpp/oneapi/dal.hpp
            __baseline_src/cpp/oneapi/dal/algo/correlation_distance.hpp
            __baseline_src/cpp/oneapi/dal/algo/cosine_distance.hpp
            __baseline_src/cpp/oneapi/dal/algo/dbscan.hpp
            __baseline_src/cpp/oneapi/dal/algo/linear_regression.hpp
            __baseline_src/cpp/oneapi/dal/algo/logistic_regression.hpp
            __baseline_src/cpp/oneapi/dal/table/csr_accessor.hpp
          include: __baseline_src/cpp
          new-version: ${{ steps.baseline.outputs.tag }}
          depth: headers
          ast-frontend: clang
          gcc-path: icpx
          gcc-options: "-fsycl -std=c++17"
          output-file: "${{ env.ABICHECK_BASELINE_DIR }}/${{ steps.baseline.outputs.tag }}-oneapi-dal.abicheck.json.zst"
      - name: Dump baseline snapshot (oneapi::dal dpc)
        uses: abicheck/abicheck@b6ec8b493e84937856fc75afddf6e606477b24d3 # main
        with:
          mode: dump
          new-library: __baseline_src/__release_lnx/daal/latest/lib/intel64/libonedal_dpc.so
          new-header: >-
            __baseline_src/cpp/oneapi/dal.hpp
            __baseline_src/cpp/oneapi/dal/algo/correlation_distance.hpp
            __baseline_src/cpp/oneapi/dal/algo/cosine_distance.hpp
            __baseline_src/cpp/oneapi/dal/algo/dbscan.hpp
            __baseline_src/cpp/oneapi/dal/algo/linear_regression.hpp
            __baseline_src/cpp/oneapi/dal/algo/logistic_regression.hpp
            __baseline_src/cpp/oneapi/dal/table/csr_accessor.hpp
          include: __baseline_src/cpp
          new-version: ${{ steps.baseline.outputs.tag }}
          depth: headers
          ast-frontend: clang
          gcc-path: icpx
          gcc-options: "-fsycl -DONEDAL_DATA_PARALLEL -std=c++17"
          output-file: "${{ env.ABICHECK_BASELINE_DIR }}/${{ steps.baseline.outputs.tag }}-oneapi-dal-dpc.abicheck.json.zst"

      # Release assets have a 2 GiB per-file limit, so size is no longer a hard
      # blocker the way it was when these snapshots were committed to git. This
      # guard stays as a tripwire for the case it actually catches: compression
      # silently not applying. A compressed snapshot is ~2-5 MiB; anything two
      # orders of magnitude larger means the .json.zst envelope was not used and
      # every consumer would pay for it on download.
      - name: Report snapshot sizes and check the compression tripwire
        run: |
          set -euo pipefail
          ls -l "${ABICHECK_BASELINE_DIR}"
          du -sh "${ABICHECK_BASELINE_DIR}"
          limit=$((100 * 1024 * 1024))
          rc=0
          for f in "${ABICHECK_BASELINE_DIR}"/*.abicheck.json.zst; do
            size=$(stat -c %s "$f")
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=${f}::$(( size / 1048576 )) MiB is far above the ~2-5 MiB a compressed snapshot takes, which means compression did not apply (check the dump step's 'Storage:' line) or the snapshot grew by two orders of magnitude."
              rc=1
            fi
          done
          exit "$rc"

      # Upload before computing digests, so the digest file always describes the
      # bytes that are actually published rather than the bytes this run
      # happened to dump.
      #
      # Fails closed on an immutability violation rather than passing
      # --clobber: a published baseline is what every already-merged PR's
      # "compatible with <tag>" verdict was computed against, and silently
      # replacing it would make those verdicts stop meaning what they said.
      #
      # It does not try to recognise a re-run as a harmless retry by comparing
      # bytes, because a snapshot is not byte-reproducible: measured, dumping
      # the same tag twice with the same pin and the same build differs in
      # created_at and in the edge order of the L5 source_graph (same
      # serialized length, same content, different order). A byte compare would
      # therefore fail on every legitimate retry and never on anything else. So
      # the rule is by asset *existence*: an already-published snapshot is left
      # exactly as it is and its published bytes -- not this run's -- are what
      # the digest step below hashes. That makes a re-run after a transient
      # failure (upload succeeded, digest commit did not) converge instead of
      # deadlocking, and still makes replacing a baseline an explicit act.
      - name: Publish baseline snapshots to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.baseline.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::No release found for tag '${TAG}'. This workflow attaches baseline assets to an existing release; publish the release first, or dispatch with a tag that has one."
            exit 1
          fi
          mkdir -p "${ABICHECK_PUBLISHED_DIR}"
          for path in "${ABICHECK_BASELINE_DIR}"/*.abicheck.json.zst; do
            name="$(basename "$path")"
            if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" \
                 --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "::warning::'${name}' is already published on release '${TAG}'; keeping the published asset and ignoring this run's freshly dumped one. A release-tag baseline is immutable: every merged PR's verdict was computed against the published bytes. To replace it deliberately, run 'gh release delete-asset ${TAG} ${name}' and re-run this workflow, or publish under a new tag."
              rm -f "${ABICHECK_PUBLISHED_DIR}/${name}"
              gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" \
                --pattern "$name" --dir "${ABICHECK_PUBLISHED_DIR}"
              continue
            fi
            gh release upload "$TAG" "$path" --repo "${GITHUB_REPOSITORY}"
            cp "$path" "${ABICHECK_PUBLISHED_DIR}/${name}"
          done

      # The digest file, not the snapshots, is what enters version control: a
      # few hundred bytes, reviewable, and the anchor that lets the PR-side job
      # prove the asset it downloaded is the one on the release.
      - name: Compute baseline digests
        working-directory: ${{ env.ABICHECK_PUBLISHED_DIR }}
        run: |
          set -euo pipefail
          sha256sum *.abicheck.json.zst \
            > "${GITHUB_WORKSPACE}/.github/abicheck/baselines/${{ steps.baseline.outputs.tag }}.abicheck.sha256"
          cat "${GITHUB_WORKSPACE}/.github/abicheck/baselines/${{ steps.baseline.outputs.tag }}.abicheck.sha256"

      - name: Commit baseline digests
        run: |
          set -euo pipefail
          sums=".github/abicheck/baselines/${{ steps.baseline.outputs.tag }}.abicheck.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$sums"
          if git diff --cached --quiet; then
            echo "Baseline digests unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Publish abicheck baseline digests for ${{ steps.baseline.outputs.tag }}"
          git push origin HEAD:main

      - name: Summarize
        run: |
          {
            echo "### Abicheck baseline published"
            echo ""
            echo "Release: \`${{ steps.baseline.outputs.tag }}\`"
            echo ""
            echo '```'
            cat ".github/abicheck/baselines/${{ steps.baseline.outputs.tag }}.abicheck.sha256"
            echo '```'
            echo ""
            echo "Set \`ABICHECK_BASELINE_TAG\` in \`.github/workflows/ci.yml\` to this tag to gate PRs against it."
          } >> "$GITHUB_STEP_SUMMARY"
