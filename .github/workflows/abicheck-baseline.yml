name: Publish Abicheck Baseline

on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: "oneDAL release tag to publish as the abicheck baseline"
        required: true
        default: "2026.0.0"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  PublishBaseline:
    if: github.repository == 'uxlfoundation/oneDAL'
    runs-on: ubuntu-24.04
    # Measured end to end in an ubuntu:24.04 container running the exact apt
    # oneAPI packages this workflow installs: the two builds take ~20 min
    # each, the daal snapshot 20m58s and the oneapi::dal snapshot 7m07s, so
    # ~70 min of real work. 120 leaves margin for a cold apt mirror.
    #
    # The snapshot timings above are from abicheck main *after* its DWARF
    # DIE-cache bound landed, which is a straight time-for-memory trade: the
    # daal dump went from 11m48s / 16.7 GB peak RSS to 20m58s / 5.44 GB, and
    # oneapi::dal from 4m54s / 3.9 GB to 7m07s / 3.7 GB. The memory half of
    # that is what removes the swap workaround an earlier revision of this
    # workflow needed; the time half is why this timeout stays at 120 rather
    # than dropping.
    timeout-minutes: 120
    steps:
      - name: Resolve baseline tag
        id: baseline
        run: |
          tag="${{ inputs.baseline_tag }}"
          if [ -z "$tag" ]; then
            tag="${{ github.event.release.tag_name }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Explicitly on `main` (not whatever ref triggered this workflow --
      # for the `release: published` trigger that would be the release's
      # tag/commit, not a branch) since the dump gets committed back here.
      - name: Checkout oneDAL main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Checkout oneDAL sources at the baseline tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.baseline.outputs.tag }}
          path: __baseline_src

      - name: Install DPC++
        working-directory: __baseline_src
        run: .ci/env/apt.sh dpcpp
      - name: Install MKL
        working-directory: __baseline_src
        run: .ci/env/apt.sh mkl

      # Same targets as the PR-side LinuxMakeDPCPP job in ci.yml, so the
      # baseline binaries match what every PR's LinuxAbicheckScan job
      # actually compares against: daal produces libonedal_core.so (the
      # classic DAAL API), oneapi_c produces libonedal.so (the oneapi::dal
      # API) -- see the "Make onedal debug" step in LinuxMakeDPCPP.
      - name: Build daal + oneapi_c (avx2 debug)
        working-directory: __baseline_src
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/build.sh --compiler icx --optimizations avx2 --target daal --debug symbols --jobs 20
          .ci/scripts/build.sh --compiler icx --optimizations avx2 --target oneapi_c --debug symbols --jobs 20

      - name: Ensure baseline output directory exists
        run: mkdir -p .github/abicheck-baselines

      # Use icpx itself (via --ast-frontend clang) instead of the default
      # castxml/GCC frontend, so cpp/oneapi/dal's SYCL headers parse -- see
      # the matching comment in ci.yml's LinuxAbicheckScan job. #606 made
      # --gcc-path recognize icx/icpx by name, so gcc-path: icpx below needs
      # no symlink workaround.
      - name: Put icpx on PATH
        run: |
          source /opt/intel/oneapi/setvars.sh
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # MEMORY: a full `dump` of the debug-symbol libonedal_core.so peaks at
      # 5.44 GB RSS, measured with /usr/bin/time -v against the pinned
      # abicheck below -- comfortable on a 16 GB standard runner, so no swap
      # step is needed. That figure is recent: before abicheck bounded its
      # DWARF DIE cache the same dump peaked at 16.7 GB and this workflow had
      # to fallocate a 16 G swapfile to survive. Most of the remaining peak is
      # still the binary/DWARF layer rather than the headers -- the same
      # library dumped at `--depth binary` with no headers at all used to peak
      # at 12.2 GB -- so trimming the header list below would not help if the
      # figure ever regresses. Re-measure before assuming there is headroom.
      #
      # L4 source-fact extraction (macro/constexpr/inline-body diffing) via
      # a Clang plugin is confirmed impossible against the apt-installed
      # icpx package (no LLVMConfig/ClangConfig CMake files -- see the
      # matching comment in ci.yml's LinuxAbicheckScan job).
      #
      # Two separate dumps, not one -- see the matching comment in ci.yml's
      # LinuxAbicheckScan job for why cpp/daal/include and cpp/oneapi/dal
      # each need their own library/baseline file.
      #
      # The header roots below are umbrella-plus-explicit-list and must stay
      # byte-for-byte in step with the ones in ci.yml's LinuxAbicheckScan
      # job: a baseline dumped from a different header set than the scan uses
      # reports every header-only difference as a spurious add/remove. The
      # long rationale (why the plain directories fail, and why
      # --public-header-dir is required for the provenance cross-checks to do
      # anything at all) lives with that job.
      - name: Dump baseline snapshot (daal)
        uses: abicheck/abicheck@4f9061560b2312138cd6d895088fb31c996b9de5 # main
        with:
          mode: dump
          new-library: __baseline_src/__release_lnx/daal/latest/lib/intel64/libonedal_core.so
          new-header: >-
            __baseline_src/cpp/daal/include/daal.h
            __baseline_src/cpp/daal/include/algorithms/tsne/tsne_gradient_descent.h
            __baseline_src/cpp/daal/include/data_management/data/internal/finiteness_checker.h
            __baseline_src/cpp/daal/include/data_management/data/internal/roc_auc_score.h
            __baseline_src/cpp/daal/include/data_management/data/internal/train_test_split.h
            __baseline_src/cpp/daal/include/services/internal/hash_table.h
            __baseline_src/cpp/daal/include/data_management/data/internal/base_arrow_numeric_table.h
          include: __baseline_src/cpp/daal/include
          new-version: ${{ steps.baseline.outputs.tag }}
          depth: headers
          ast-frontend: clang
          gcc-path: icpx
          gcc-options: "-std=c++17"
          extra-args: --public-header-dir __baseline_src/cpp/daal/include
          output-file: ".github/abicheck-baselines/${{ steps.baseline.outputs.tag }}-daal.abicheck.json"
      - name: Dump baseline snapshot (oneapi::dal)
        uses: abicheck/abicheck@4f9061560b2312138cd6d895088fb31c996b9de5 # main
        with:
          mode: dump
          new-library: __baseline_src/__release_lnx/daal/latest/lib/intel64/libonedal.so
          new-header: >-
            __baseline_src/cpp/oneapi/dal.hpp
            __baseline_src/cpp/oneapi/dal/algo/correlation_distance.hpp
            __baseline_src/cpp/oneapi/dal/algo/cosine_distance.hpp
            __baseline_src/cpp/oneapi/dal/algo/dbscan.hpp
            __baseline_src/cpp/oneapi/dal/algo/linear_regression.hpp
            __baseline_src/cpp/oneapi/dal/algo/logistic_regression.hpp
            __baseline_src/cpp/oneapi/dal/table/csr_accessor.hpp
          include: __baseline_src/cpp
          new-version: ${{ steps.baseline.outputs.tag }}
          depth: headers
          ast-frontend: clang
          gcc-path: icpx
          gcc-options: "-fsycl -std=c++17"
          extra-args: --public-header-dir __baseline_src/cpp/oneapi
          output-file: ".github/abicheck-baselines/${{ steps.baseline.outputs.tag }}-oneapi-dal.abicheck.json"

      # 149 MB (daal) + 115 MB (oneapi::dal) of JSON per release, ~57 MB of
      # each being the L5 header-declaration graph that `depth: headers`
      # attaches unconditionally. Report it so a reviewer sees the repo cost
      # before the commit step below runs.
      #
      # These stay *uncompressed* on purpose, even though abicheck can now
      # write .json.zst and the ratio is dramatic (149 MB -> 2.2 MB and
      # 115 MB -> 2.1 MB, ~68x and ~55x, measured on these exact snapshots).
      # `scan --against a-baseline.json.zst` currently fails before it starts:
      #
      #   Error: Failed to load --baseline ...json.zst: Cannot detect format
      #   of '...json.zst'. Expected: ELF (.so), PE (.dll), Mach-O (.dylib),
      #   JSON snapshot, or ABICC Perl dump.
      #
      # so a compressed baseline would break every PR's scan. Root-caused to
      # a unit bug in abicheck's own reader (its zstd window-size ceiling is
      # passed in KiB where the library expects bytes, capping the accepted
      # window at 2 MiB against the 8 MiB window its writer picks), i.e.
      # abicheck cannot read back the compressed snapshot it just wrote. With
      # that fixed locally, a .json.zst baseline yields byte-identical
      # findings to the uncompressed one (same 63 breaking, same 20 reported,
      # identical finding_id sets), so switching is a one-line change to the
      # two output-file paths below -- once the fix is released.
      - name: Report snapshot sizes
        run: |
          ls -l --block-size=M .github/abicheck-baselines/
          du -sh .github/abicheck-baselines/

      # Commit the dumps directly into the repo (rather than a GitHub
      # Release asset) so the baselines PRs compare against live in version
      # control, reviewable and diffable like any other file.
      - name: Commit baseline dumps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ".github/abicheck-baselines/${{ steps.baseline.outputs.tag }}-daal.abicheck.json" \
                  ".github/abicheck-baselines/${{ steps.baseline.outputs.tag }}-oneapi-dal.abicheck.json"
          if git diff --cached --quiet; then
            echo "No changes to the baseline dumps; nothing to commit."
            exit 0
          fi
          git commit -m "Update abicheck baselines for ${{ steps.baseline.outputs.tag }}"
          git push origin HEAD:main
