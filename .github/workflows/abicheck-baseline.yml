# Publishes the ABI baseline that ci.yml's LinuxAbicheckScan job compares
# against: one abicheck BundleFacts document holding a header-scoped snapshot
# for each of oneDAL's six libraries, captured from a release tag built the same
# way the PR-side build is, uploaded as a release asset, with its sha256 digest
# committed to the repository as the trust anchor.
#
# The full picture -- why the facts are not committed themselves, why the digest
# file is, why the tag has to be rebuilt rather than downloaded, and how to
# rotate to a newer baseline -- is in .github/abicheck/README.md.
name: Publish Abicheck Baseline

on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: "oneDAL release tag to publish as the abicheck baseline"
        required: true
        default: "2026.0.0"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  PublishBaseline:
    if: github.repository == 'uxlfoundation/oneDAL'
    runs-on: ubuntu-24.04
    # Measured end to end against the abicheck commit pinned below, on the
    # no-debug-info build this workflow produces. Per library, header-scoped:
    # libonedal_core.so 6m35s, libonedal.so 3m35s, libonedal_dpc.so 10m01s,
    # libonedal_parameters.so 59s, libonedal_parameters_dpc.so 7m29s,
    # libonedal_thread.so 0.1s (ELF-only) -- 28m40s of resolving, plus ~2.5 min
    # to build and serialize the BundleFacts document, so ~31 min wall for the
    # whole capture.
    #
    # Peak RSS does *not* accumulate across the six: it is the max of the
    # libraries, 5.4 GiB, reached on libonedal_dpc.so and held. That fits a
    # 16 GB standard runner with room to spare. (An earlier revision of this
    # workflow had to fallocate a 16 G swapfile for a debug-info daal dump;
    # abicheck's bounded DWARF DIE cache and the no-debug-info build together
    # removed that need.) The SYCL headers, not oneDAL's, dominate: one header
    # under `-fsycl -DONEDAL_DATA_PARALLEL` costs 7m29s / 4.0 GiB against
    # 59s / 0.6 GiB for the same header without.
    #
    # The three builds took 1m32s + 16s + 1m41s at -j64 on a 224-core host, so
    # those are a lower bound: on a standard runner the builds, not the
    # capture, dominate this job, which is why the timeout stays at 180 rather
    # than tracking the measured ~39 min of capturing.
    timeout-minutes: 180
    env:
      ABICHECK_BASELINE_DIR: __abi_baselines
      # Must equal ci.yml's ABICHECK_PIN. Not a `uses:` pin because the capture
      # drives abicheck as a Python library -- see the capture step's comment.
      ABICHECK_PIN: 793849f3cb7c3eb7c5add2b90ca31b6c5849834b
      # The bytes actually on the release after the publish step: this run's
      # freshly dumped snapshot for a new asset, the already-published asset for
      # one that exists. The digest file is computed from here, never from
      # ABICHECK_BASELINE_DIR, because those two differ on a re-run.
      ABICHECK_PUBLISHED_DIR: __abi_published
    steps:
      - name: Resolve baseline tag
        id: baseline
        run: |
          set -euo pipefail
          tag="${{ inputs.baseline_tag }}"
          if [ -z "$tag" ]; then
            tag="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$tag" ]; then
            echo "::error::No baseline tag: neither the baseline_tag input nor a release tag_name is set."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Explicitly on `main` (not whatever ref triggered this workflow -- for
      # the `release: published` trigger that would be the release's tag), since
      # the digest file gets committed back here.
      - name: Checkout oneDAL main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Checkout oneDAL sources at the baseline tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.baseline.outputs.tag }}
          path: __baseline_src

      - name: Install DPC++
        working-directory: __baseline_src
        run: .ci/env/apt.sh dpcpp
      - name: Install MKL
        working-directory: __baseline_src
        run: .ci/env/apt.sh mkl

      # The same three targets, the same ISA and the same debug setting as
      # ci.yml's LinuxMakeDPCPP job, so the baseline binaries match what every
      # PR is actually compared against: daal produces libonedal_core.so,
      # oneapi_c produces libonedal.so, oneapi_dpc produces libonedal_dpc.so.
      #
      # No --debug symbols, because LinuxMakeDPCPP does not pass it either. The
      # scan is L2 (headers + exported symbols) and needs no DWARF, but the two
      # sides do have to agree: if the PR-side build ever starts building with
      # debug info, re-dispatch this workflow for the published tags -- the same
      # rule that applies to bumping the abicheck pin.
      #
      # No --jobs either: .ci/scripts/build.sh already falls back to
      # -j$(nproc --all) on Linux, so the build sizes itself to whatever runner
      # it lands on instead of hard-coding a number.
      - name: Build daal + oneapi_c + oneapi_dpc (avx2)
        working-directory: __baseline_src
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/build.sh --compiler icx --optimizations avx2 --target daal
          rm -rf __work
          .ci/scripts/build.sh --compiler icx --optimizations avx2 --target oneapi_c
          rm -rf __work
          .ci/scripts/build.sh --compiler icx --optimizations avx2 --target oneapi_dpc
          rm -rf __work

      - name: Ensure output directories exist
        run: mkdir -p "${ABICHECK_BASELINE_DIR}" .github/abicheck/baselines

      - name: Put icpx on PATH
        run: |
          source /opt/intel/oneapi/setvars.sh
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # One capture, six libraries, one asset. The scan-side gate in ci.yml is
      # a whole-product (bundle) comparison, so the baseline it needs is one
      # BundleFacts document holding a header-scoped snapshot per library --
      # not three independent per-library snapshots. Both halves read the same
      # LIBRARIES table in .github/abicheck/onedal_libraries.py, which is the
      # point: a baseline captured from a different header set than the gate
      # uses reports every header-only difference as a spurious add/remove, and
      # keeping the two sides in one table makes that drift impossible rather
      # than merely documented.
      #
      # The .json.zst suffix is load-bearing: abicheck infers the compression
      # envelope from it on both sides, and this document is enormous
      # uncompressed -- measured 902 MiB of JSON against 13.2 MiB compressed,
      # a 65x ratio, because it embeds a full header-scoped snapshot per
      # library rather than only the dependency graph.
      #
      # Keep ABICHECK_PIN equal to ci.yml's, and re-dispatch this workflow for
      # every published tag whenever it moves. Mismatched pins do not fail in
      # any way that points at the cause: they either under-report silently, or
      # fail *loudly for the wrong reason*. Both halves are measured.
      #
      # The loud half, seen while validating an earlier bump: abicheck fixed a
      # dumper bug where an enumerator whose initializer's folded value sits on
      # an intermediate clang AST wrapper node (`csrArray = 1 << 4`) fell back
      # to positional auto-increment, so `NumericTableIface::StorageLayout` was
      # recorded as csrArray=3, arrow=4 instead of 16 and 2048. Scanning an
      # unchanged source tree with the new pin against baselines dumped by the
      # old one therefore reported 155 breaking `enum_member_value_changed`
      # findings for libonedal_core.so and 125 for libonedal_dpc.so -- exit 4,
      # a red X, and nothing in the report naming the baseline as the cause.
      # Re-dumping the same tag with the same pin as the scanner took all 280
      # to zero with no other change.
      #
      # What that obliges is re-*verifying* on every bump, not blindly re-
      # capturing. Bumping to the pin below needed no new baselines: scanning
      # the unchanged tree with it against the previous pin's snapshots
      # produced reports identical line-for-line apart from timings. Do that
      # check before landing a bump; if the reports differ, re-dispatch this
      # workflow for every published tag first. See .github/abicheck/README.md.
      - name: Install abicheck
        run: python3 -m pip install --disable-pip-version-check
          "abicheck @ git+https://github.com/abicheck/abicheck@${{ env.ABICHECK_PIN }}"
      - name: Capture baseline bundle facts
        run: |
          python3 .github/abicheck/bundle_gate.py capture \
            --source __baseline_src \
            --lib-dir __baseline_src/__release_lnx/daal/latest/lib/intel64 \
            --version "${{ steps.baseline.outputs.tag }}" \
            --output "${ABICHECK_BASELINE_DIR}/${{ steps.baseline.outputs.tag }}-bundle.abicheck.json.zst"

      # Release assets have a 2 GiB per-file limit, so size is no longer a hard
      # blocker the way it was when these snapshots were committed to git. This
      # guard stays as a tripwire for the case it actually catches: compression
      # silently not applying. The bundle facts asset is 13.2 MiB compressed
      # (measured: six header-scoped snapshots) against 902 MiB of raw JSON, so
      # the 100 MiB limit sits between the two and catches exactly that failure.
      #
      # The glob is *.abicheck.json.zst and the asset is named
      # <tag>-bundle.abicheck.json.zst deliberately: this loop, the publish
      # loop and the PR-side digest check all key on that one suffix, so an
      # asset named outside it would make all three silently no-op rather than
      # fail.
      - name: Report snapshot sizes and check the compression tripwire
        run: |
          set -euo pipefail
          ls -l "${ABICHECK_BASELINE_DIR}"
          du -sh "${ABICHECK_BASELINE_DIR}"
          limit=$((100 * 1024 * 1024))
          rc=0
          for f in "${ABICHECK_BASELINE_DIR}"/*.abicheck.json.zst; do
            size=$(stat -c %s "$f")
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=${f}::$(( size / 1048576 )) MiB is far above the ~13 MiB compressed bundle facts take, which means compression did not apply (the .json.zst suffix is what selects it) or the captured surface grew by an order of magnitude."
              rc=1
            fi
          done
          exit "$rc"

      # Upload before computing digests, so the digest file always describes the
      # bytes that are actually published rather than the bytes this run
      # happened to dump.
      #
      # Fails closed on an immutability violation rather than passing
      # --clobber: a published baseline is what every already-merged PR's
      # "compatible with <tag>" verdict was computed against, and silently
      # replacing it would make those verdicts stop meaning what they said.
      #
      # The rule is asset *existence*, not a byte compare, and it has to be:
      # this document is not byte-reproducible. Two captures of the same tree by
      # the same pin measured 13,800,260 and 13,799,608 bytes with different
      # sha256s, while decompressing to the same 902,160,393 bytes and to
      # identical line multisets -- the L5 source-graph decl nodes come out in a
      # different order. So the content is reproducible and the bytes are not,
      # which rules out "re-capture and compare digests" as a check and leaves
      # existence as the only workable one.
      #
      # That is the weaker mechanism but the right rule anyway: every
      # already-merged PR's "compatible with <tag>" verdict was computed against
      # the published bytes, so replacing them has to be an explicit act even
      # when the content behind them is the same. An already-published asset is
      # therefore left exactly as it is, and its published bytes -- not this
      # run's -- are what the digest step below hashes. That makes a re-run
      # after a transient failure (upload succeeded, digest commit did not)
      # converge instead of deadlocking.
      - name: Publish baseline snapshots to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.baseline.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::No release found for tag '${TAG}'. This workflow attaches baseline assets to an existing release; publish the release first, or dispatch with a tag that has one."
            exit 1
          fi
          mkdir -p "${ABICHECK_PUBLISHED_DIR}"
          for path in "${ABICHECK_BASELINE_DIR}"/*.abicheck.json.zst; do
            name="$(basename "$path")"
            if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" \
                 --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "::warning::'${name}' is already published on release '${TAG}'; keeping the published asset and ignoring this run's freshly dumped one. A release-tag baseline is immutable: every merged PR's verdict was computed against the published bytes. To replace it deliberately, run 'gh release delete-asset ${TAG} ${name}' and re-run this workflow, or publish under a new tag."
              rm -f "${ABICHECK_PUBLISHED_DIR}/${name}"
              gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" \
                --pattern "$name" --dir "${ABICHECK_PUBLISHED_DIR}"
              continue
            fi
            gh release upload "$TAG" "$path" --repo "${GITHUB_REPOSITORY}"
            cp "$path" "${ABICHECK_PUBLISHED_DIR}/${name}"
          done

      # The digest file, not the snapshots, is what enters version control: a
      # few hundred bytes, reviewable, and the anchor that lets the PR-side job
      # prove the asset it downloaded is the one on the release.
      - name: Compute baseline digests
        working-directory: ${{ env.ABICHECK_PUBLISHED_DIR }}
        run: |
          set -euo pipefail
          sha256sum *.abicheck.json.zst \
            > "${GITHUB_WORKSPACE}/.github/abicheck/baselines/${{ steps.baseline.outputs.tag }}.abicheck.sha256"
          cat "${GITHUB_WORKSPACE}/.github/abicheck/baselines/${{ steps.baseline.outputs.tag }}.abicheck.sha256"

      - name: Commit baseline digests
        run: |
          set -euo pipefail
          sums=".github/abicheck/baselines/${{ steps.baseline.outputs.tag }}.abicheck.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$sums"
          if git diff --cached --quiet; then
            echo "Baseline digests unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Publish abicheck baseline digests for ${{ steps.baseline.outputs.tag }}"
          git push origin HEAD:main

      - name: Summarize
        run: |
          {
            echo "### Abicheck baseline published"
            echo ""
            echo "Release: \`${{ steps.baseline.outputs.tag }}\`"
            echo ""
            echo '```'
            cat ".github/abicheck/baselines/${{ steps.baseline.outputs.tag }}.abicheck.sha256"
            echo '```'
            echo ""
            echo "Set \`ABICHECK_BASELINE_TAG\` in \`.github/workflows/ci.yml\` to this tag to gate PRs against it."
          } >> "$GITHUB_STEP_SUMMARY"
