name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # use workflow dispatch to regenerate cache
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  LinuxMakeDPCPP:
    if: github.repository == 'uxlfoundation/oneDAL'
    strategy:
      fail-fast: false
      matrix:
        include:
          - ISA: avx2
            runner: ubuntu-24.04

    runs-on: ${{ matrix.runner }}
    name: LinuxMakeDPCPP(${{ matrix.ISA }})
    timeout-minutes: 360

    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install DPC++
        run: .ci/env/apt.sh dpcpp
      - name: Install MKL
        run: .ci/env/apt.sh mkl
      - name: System Info
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/describe_system.sh
      - name: Set environment variables
        run: |
          # reduce GPU driver/runner related memory issues
          echo "NEOReadDebugKeys=1" >> "$GITHUB_ENV"
          echo "EnableRecoverablePageFaults=1" >> "$GITHUB_ENV"
          echo "GpuFaultCheckThreshold=0" >> "$GITHUB_ENV"
      - name: Make daal
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target daal --jobs 20
          rm -rf __work
      - name: Make onedal
        id: onedal-dbg
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target oneapi_c --jobs 20
          rm -rf __work
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target oneapi_dpc --jobs 20
          # clean up build directory due to space limitations
          rm -rf __work
          echo "key=__release_lnx-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare Cache build
        if: github.event_name != 'pull_request'
        run: cp -r __release_lnx __release_lnx_main
      - name: Cache build
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.onedal-dbg.outputs.key }}
          path: ./__release_lnx_main
      - name: Remove Cache build
        if: github.event_name != 'pull_request'
        run: rm -rf __release_lnx_main
      - name: Archive build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: __release_lnx
          path: ./__release_lnx
      - name: Make onedal
        if: matrix.runner != 'ubuntu-24.04'
        run: |
          source /opt/intel/oneapi/setvars.sh
          rm -rf __work
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target onedal --jobs 20
          rm -rf __work
      - name: daal/cpp examples
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind examples --build-dir __release_lnx --compiler icx --interface daal/cpp --build-system cmake
      - name: oneapi/cpp examples
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind examples --build-dir __release_lnx --compiler icx --interface oneapi/cpp --build-system cmake
      - name: oneapi/dpc examples
        if: matrix.runner != 'ubuntu-24.04'
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind examples --build-dir __release_lnx --compiler icx --interface oneapi/dpc --build-system cmake
      # Miniforge is necessary in order to get Intel MPI from conda-forge for MPI samples
      - name: Install Miniforge
        run: .ci/env/apt.sh miniforge
      - name: daal/cpp/mpi samples
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind samples --build-dir __release_lnx --compiler gnu --interface daal/cpp/mpi --conda-env ci-env --build-system cmake

  LinuxABICheck:
    name: ABI Conformance(avx2)
    needs: LinuxMakeDPCPP
    if: |
      github.repository == 'uxlfoundation/oneDAL' &&
      github.event_name == 'pull_request' &&
      ! contains(toJson(github.event.pull_request.labels.*.name), '"API/ABI breaking change"')
    runs-on: ubuntu-24.04
    env:
      LIBABIGAIL_DEFAULT_USER_SUPPRESSION_FILE: ${{ github.workspace }}/.github/.abignore
    timeout-minutes: 20

    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@v7
      - name: install ABI checking tools
        run: .ci/env/apt.sh abigail
      - name: Check Cache
        id: get-cache-key
        run: |
          CACHE_KEY=`gh cache list --sort created_at --key __release_lnx --json key --jq .[0].key`
          echo "key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"
          echo $CACHE_KEY
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download oneDAL main build
        uses: actions/cache/restore@v6
        with:
          path: ./__release_lnx_main
          key: ${{ steps.get-cache-key.outputs.key }}
      - name: Download oneDAL build artifact
        uses: actions/download-artifact@v8
        with:
          name: __release_lnx
          path: ./__release_lnx
      - name: Check ABI conformance
        run: |
          echo "Note: This check uses abidiff to verify ABI compliance of an SSE/AVX512 oneDAL build."
          echo "It compares to the last completed main build, whose commit can be found in the 'Check Cache' step."
          echo "The ABI for other ISAs are assumed to match the SSE or AVX512 version, any ISA-specific exported "
          echo "information that is ISA unique must be manually checked. If no shared objects are found, then "
          echo "please rerun the main 'CI' workflow via GitHub's workflow dispatch to regenerate the cache."
          echo "Keep the branch up to date with oneDAL 'main' as it may otherwise not contain the latest changes "
          echo "in the ABI that can lead to erroneous failures in the ABI check."
          .ci/scripts/abi_check.sh __release_lnx_main/daal/latest/lib/intel64/ __release_lnx/daal/latest/lib/intel64/

  LinuxAbicheckScan:
    name: Abicheck (header scan + binary, avx2)
    needs: LinuxMakeDPCPP
    if: |
      github.repository == 'uxlfoundation/oneDAL' &&
      github.event_name == 'pull_request' &&
      ! contains(toJson(github.event.pull_request.labels.*.name), '"API/ABI breaking change"')
    runs-on: ubuntu-24.04
    # Measured end to end in an ubuntu:24.04 container running the exact apt
    # oneAPI packages this workflow installs: daal scan 7m06s-7m16s (eight
    # cold runs across two abicheck pins, spread under 10s), oneapi::dal scan
    # 3m57s-4m06s, plus the DPC++ apt install and artifact download. 30
    # minutes left no margin for a cold apt mirror, so this is 45.
    #
    # Do not read anything into a *rerun* being much faster (the same daal
    # scan finishes in ~2m05s the second time): abicheck caches the candidate
    # snapshot, so only the first run in a fresh runner is representative,
    # and that is the one this timeout has to cover.
    #
    # MEMORY: the peak here is the *scan*, not the baseline dump -- the scan
    # of libonedal_core.so peaks at 3.42 GB RSS and libonedal.so at 1.88 GB,
    # both comfortable on a 16 GB standard runner. The full baseline *dump*
    # of libonedal_core.so is the more expensive one (5.44 GB) and runs in
    # the separate, manually-triggered Publish Abicheck Baseline workflow.
    timeout-minutes: 45
    permissions:
      contents: read
    # The baseline tag appears in three places -- the guard below and both
    # abicheck steps -- and all three have to name the same snapshots, so it
    # lives here. Moving to a newer baseline means editing these two lines and
    # re-dispatching .github/workflows/abicheck-baseline.yml for that tag; see
    # the pin discussion further down.
    env:
      ABICHECK_BASELINE_DAAL: .github/abicheck-baselines/2026.0.0-daal.abicheck.json.zst
      ABICHECK_BASELINE_ONEAPI_DAL: .github/abicheck-baselines/2026.0.0-oneapi-dal.abicheck.json.zst
    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@v6
      - name: Download oneDAL build artifact
        uses: actions/download-artifact@v7
        with:
          name: __release_lnx
          path: ./__release_lnx
      - name: Install DPC++
        run: .ci/env/apt.sh dpcpp
      # depth: headers is L2 only -- public-header AST diffing against the
      # binary's exported symbols. Use icpx itself (via --ast-frontend
      # clang) instead of the default castxml/GCC frontend, so headers that
      # pull in SYCL (cpp/oneapi/dal/detail/common.hpp includes
      # sycl/sycl.hpp) parse correctly -- castxml/GCC has no SYCL support
      # at all.
      #
      # abicheck/abicheck#606 (merged to main) made --gcc-path recognize
      # icx/icpx/dpcpp/dpcpp-cl by name directly, so gcc-path: icpx below
      # needs no symlink workaround (an earlier revision of this job used
      # one, before #606 landed). setvars.sh still needs sourcing + PATH
      # persisted so `icpx` resolves and links against the right runtime.
      #
      # #606 also confirmed (via dpkg-deb -c against the real
      # 2026.1.0-235 package) that Intel's apt package ships no
      # LLVMConfig.cmake/ClangConfig.cmake at all -- only IntelSYCL/
      # IntelDPCPP cmake helpers -- so building the abicheck-facts Clang
      # plugin (L4: macro/constexpr/inline-body diffing) against icpx is
      # confirmed impossible with this package, not just unresolved.
      # --ast-frontend clang is the correct/only portable L2 path for icpx
      # per abicheck's own docs, not a stopgap.
      - name: Put icpx on PATH
        run: |
          source /opt/intel/oneapi/setvars.sh
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      # `.github/abicheck-baselines/` is produced by
      # .github/workflows/abicheck-baseline.yml, which commits the snapshots to
      # main. That workflow can only be dispatched once it is *on* main, so on
      # the way in -- and on any branch older than the first dispatch -- the
      # directory does not exist yet and there is nothing to compare against.
      #
      # Left unguarded, that state does not report itself as "no baseline". The
      # Action's `abi-baseline` input takes a file path *or* a release tag, so a
      # path that is not on disk falls through to a release lookup and the job
      # dies with `release not found` / `No ABI baseline found in release
      # '.github/abicheck-baselines/…json.zst'` -- which reads like a broken
      # action, not a bootstrap state, and blocks the very pull request that
      # would deliver the publishing workflow.
      #
      # So: skip the scans and say so loudly, in the annotations and in the job
      # summary, rather than fail or pass quietly. Once the baselines are on
      # main the guard is satisfied on every branch that merges it and the gate
      # arms itself with no further edit.
      - name: Locate ABI baselines
        id: baselines
        run: |
          set -euo pipefail
          missing=""
          for f in "${ABICHECK_BASELINE_DAAL}" "${ABICHECK_BASELINE_ONEAPI_DAL}"; do
            [ -f "$f" ] || missing="${missing} ${f}"
          done
          if [ -z "${missing}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          note="ABI scan skipped: no committed baseline (missing:${missing}). Dispatch the 'Publish Abicheck Baseline' workflow on main to arm this gate."
          echo "::warning title=ABI baseline missing::${note}"
          {
            echo "### Abicheck"
            echo ""
            echo "${note}"
          } >> "$GITHUB_STEP_SUMMARY"
      # Two separate scans, not one: scan/dump analyse exactly one artifact
      # (no per-library fan-out), and cpp/daal/include's classic DAAL API
      # and cpp/oneapi/dal's API are exported from two different .so files
      # (libonedal_core.so vs. libonedal.so -- see the "Make onedal debug"
      # step in LinuxMakeDPCPP above, which builds the oneapi_c target
      # producing libonedal.so). Scanning either library against the
      # other's headers would report every declaration as missing.
      #
      # ── Why the header roots below are umbrella headers plus a short
      #    explicit list, and not the directories ────────────────────────────
      #
      # `new-header: <dir>` expands to *every* header in the tree and parses
      # them in one aggregate TU. Both directories fail that way, hard
      # (abicheck exits 1, no snapshot):
      #
      #  * cpp/daal/include contains arrow_numeric_table.h, which includes
      #    <arrow/table.h>. Apache Arrow dev headers do not exist in the
      #    ubuntu-24.04 apt archive (no libarrow-dev in main/universe), and
      #    oneDAL's own build never compiles that header either. abicheck's
      #    auto-exclusion (dumper_clang_errors.retry_excluding_error_headers)
      #    deliberately only drops headers that raise a preprocessor #error
      #    direct-inclusion guard -- a missing include is a hard failure by
      #    design -- so it cannot rescue this.
      #  * cpp/oneapi/dal contains headers that only resolve relative to
      #    `cpp` (e.g. oneapi/dal/algo/basic_statistics/common.hpp) and
      #    headers referring to cpp/daal internals; several also need
      #    -I cpp/daal/include.
      #
      # So each side passes its umbrella header plus exactly those public
      # installed headers the umbrella does not reach. That list is not
      # cosmetic: for the oneapi::dal side the 6 extra headers add 687
      # functions and 130 types to the snapshot (5289 -> 5976 functions)
      # -- dbscan, linear_regression, logistic_regression,
      # correlation_distance, cosine_distance and csr_accessor are shipped
      # in include/ but unreachable from dal.hpp, i.e. the umbrella alone
      # silently under-covers the public API. Each list was verified by
      # reachability analysis against __release_lnx/daal/latest/include
      # (what actually ships) and by an icpx -fsyntax-only aggregate compile.
      #
      # public-header-dir is what establishes the public/internal boundary:
      # without it the exported_not_public / public_not_exported / RTTI
      # cross-checks all report "skipped -- no public-header provenance", and
      # abicheck cannot tell a public-reachable detail:: symbol from a truly
      # internal one.
      #
      # public-header-dir and policy-file are passed as real Action inputs
      # here. An earlier revision of this job had to smuggle them through
      # extra-args, because the composite Action forwarded the policy and
      # suppression options only in its compare branch, never in scan. The
      # pinned commit forwards them in the scan branch too (action/run.sh:661
      # and :723-727), gated on a baseline being present, which is the case
      # here.
      #
      # extra-args is still used, for one thing only: --max-findings. It
      # defaults to 20 (cli_scan.py:1223-1233) and the text renderer stops
      # there with "... additional findings omitted; rerun `compare` for the
      # full list" -- measured, exactly 20 of daal's 82 findings printed
      # without it. Raising the cap cannot change the verdict or the exit code,
      # only how much of the list a reviewer gets to see.
      #
      # Not set, and deliberately: `policy`. It has a non-empty action.yml
      # default (strict_abi) that reaches the CLI as an explicit
      # --policy strict_abi whenever a baseline is present, so it is passed on
      # every run whether this job asks for it or not. Verified harmless
      # alongside policy-file: the same scan with `--policy strict_abi
      # --policy-file .github/.abicheck-policy.yaml` and with the policy file
      # alone produce byte-identical results, so the file takes precedence and
      # the combination is not a usage error.
      #
      # ── The baseline must come from this exact abicheck commit ────────────
      #
      # Both `uses:` below and both dump steps in abicheck-baseline.yml pin
      # the SAME commit, and that is a hard requirement, not tidiness. A
      # snapshot carries a schema_version, and detectors whose evidence
      # postdates that version decline to run rather than trust stale facts --
      # so a baseline dumped by an older abicheck than the one scanning does
      # not fail, it silently *under-reports*. Measured against a
      # schema_version 18 baseline read by this schema_version 24 scanner, the
      # scan misses the two genuine constant_changed findings and the
      # type_vtable_changed finding that the matched baseline surfaces, because
      # clang_vtable_facts_reliable and four sibling flags are marked
      # unreliable on the old snapshot. The pinned commit does warn about this
      # on stderr, naming every degraded flag ("Snapshot schema_version 18
      # predates this abicheck's schema_version 24: ... Detection coverage for
      # these fields is reduced until this snapshot is regenerated"), so the
      # skew is visible in the job log -- but a warning is not a gate, and the
      # reverse direction (a snapshot newer than the reader) is a hard reject.
      #
      # So: bumping the pin below obliges re-dispatching
      # .github/workflows/abicheck-baseline.yml for the same tag, and the two
      # pins must be changed together. The full analysis lives in
      # .github/.abicheck-policy.yaml.
      #
      # Note also that .github/abicheck-baselines/ does not exist until that
      # workflow has been dispatched at least once; until then the `Locate ABI
      # baselines` step above skips both scans with a warning, so this gate is
      # inert rather than red.
      #
      # The baselines are .json.zst, which is what makes committing them
      # possible at all: the uncompressed snapshots are 151.4 MiB (daal) and
      # 115.3 MiB (oneapi::dal), both over GitHub's hard 100 MiB per-file push
      # limit, while zstd brings them to 2.26 MiB and 2.07 MiB (1.5% and 1.8%
      # of the decoded size). Compression is a storage envelope only --
      # abicheck infers it from the .zst suffix on both the dump and the scan
      # side, and a scan against the compressed baseline produces identical
      # findings to the same scan against the uncompressed one (same
      # finding_id sets, same verdict, same exit code). Verified on both
      # libraries, end to end on the pinned commit.
      #
      # ── Gating: report every difference, gate only on a real break ────────
      #
      # Two separate questions, answered by two separate mechanisms:
      #
      #  * "what changed" -- every finding is printed, with its symbol and its
      #    source location. Nothing is filtered out of the report.
      #  * "did oneDAL break its ABI" -- the severity model in .abicheck.yml,
      #    reclassified per finding kind by .github/.abicheck-policy.yaml.
      #
      # An earlier revision of this job answered both with a suppression file,
      # and that was wrong, because a suppression rule *removes* the matching
      # change before the verdict and the severity counts are computed. In the
      # format this job runs -- `scan --format text`, the only formats scan
      # accepts being text and json -- a suppressed finding leaves no trace at
      # all: not the finding, not a count, not even a note that a suppression
      # file was in effect. Measured on libonedal.so: 3 findings shown, 17
      # dropped, among them 6 func_visibility_changed and 1
      # type_vtable_changed. (The markdown reporter does itemize suppressed
      # findings, but markdown is not a legal format for scan; SARIF drops
      # them and is compare-only; the sticky PR comment mentions neither the
      # list nor the count.) The worst case is not noise but silence: a
      # synthesized STRONG-symbol visibility regression -- exactly the class of
      # break the kind rule was covering for -- produced a suppressed run whose
      # visible finding set was byte-identical to a clean run's, exit 0, with
      # the change of suppressed_count from 16 to 17 as its only trace
      # anywhere.
      #
      # A policy-file override changes only the classification, so the finding
      # stays in the list. That is the whole reason for the swap.
      #
      # Not used, and deliberately: fail-on-breaking. It only zeroes the
      # *step's* exit status after the fact (action/run.sh:1483). The CLI still
      # exits 4 and the report still says verdict: BREAKING, so the JSON, the
      # SARIF upload and the PR comment all keep claiming oneDAL broke its ABI.
      # That is the wrong signal to publish, and it also disables gating on
      # genuine breaks.
      #
      # .abicheck.yml sets exit_code_scheme: severity (abicheck#700 wired
      # `scan --against` to the severity model; the default is still "legacy",
      # which ignores it) with preset: default -- so abi_breaking stays `error`
      # and a real break still fails this job. .github/.abicheck-policy.yaml
      # moves five things to `risk` -- four of them as selector-scoped
      # `reclassify:` rules naming the specific types, namespace and constant
      # involved, and only one as a kind-global `overrides:` entry -- each with
      # the evidence and, importantly, the class of break it gives up gating
      # on, recorded there:
      #
      #  * func_visibility_changed (the one kind-global entry) -- the 2026.0.0
      #    baseline predates
      #    makefile:134 gaining -fvisibility-inlines-hidden, so main dropped
      #    1966 libonedal_core.so and 352 libonedal.so exports. All 2318 are
      #    WEAK COMDAT inline/template instantiations that clients instantiate
      #    locally, and all 2318 are still defined in the new binaries' .symtab
      #    as LOCAL FUNC -- the code was not removed, only its export
      #    visibility demoted. Zero STRONG symbols, data objects, vtables,
      #    typeinfos or guard variables are affected. 77 of daal's 82 findings
      #    and 6 of oneapi::dal's 16. Goes away once a post-inlines-hidden
      #    release is published as the baseline.
      #  * type_vtable_changed (three rules, one per named type, each also
      #    scoped to the header it is declared in) -- 2 types on
      #    libonedal_core.so, 1 on
      #    libonedal.so, and an artifact of abicheck's own capture path rather
      #    than a change in oneDAL: `abicheck dump` of the current tree records
      #    the same vtable, size_bits and base_offsets as the baseline, while
      #    `abicheck scan` of that same tree records none of them, so the diff
      #    sees populated -> empty. dump-vs-dump emits neither this finding nor
      #    its paired layout_unverifiable; only the scan path does. abicheck
      #    keeps the finding BREAKING by design (an unverifiable vtable
      #    transition may hide a real break) and only cross-references the
      #    paired layout finding, so the demotion is oneDAL's own risk call.
      #  * experimental_removed_without_replacement (scoped to the
      #    oneapi::dal::preview namespace) -- four of those same lost
      #    WEAK spmd::communicator symbols, reported a second time under a
      #    second kind; all four still declared in
      #    cpp/oneapi/dal/spmd/communicator.hpp on both sides.
      #  * constant_changed (scoped to detail::cpu_feature_map, both spellings)
      #    -- one entity reported twice through a
      #    `using v1::cpu_feature_map;` re-export, whose real content is the
      #    amx_bf16 row main added to detail::cpu_feature_map. A true positive,
      #    in an internal table, of exactly the kind this job should print and
      #    not fail on.
      #
      # Only the first of those five is kind-global, and only because abicheck
      # cannot yet tell a WEAK COMDAT demotion from a STRONG one on this finding
      # kind: its `binding:` selector reads Change.symbol_binding, which is
      # stamped on the removal kinds (func_removed / func_removed_elf_only /
      # var_removed) and not on func_visibility_changed, where the symbol is
      # still present but hidden. The other four name the exact types,
      # namespace and constant involved, so a vtable change on any other type, an
      # experimental removal outside preview::, and a change to any other
      # constant -- including the daal-side ones in the `daal::` root -- all still
      # gate. See the policy file for the per-rule evidence.
      #
      # Two kinds an earlier revision of this job had to silence are absent
      # from the policy file because they no longer fire at all against a
      # version-matched baseline: internal_template_leaks_via_public_api (was
      # 46) and constant_changed at its old scale (was 44 on libonedal.so, now
      # 2) were both version-skew artifacts of detectors that keyed identity on
      # a `name` field the two abicheck versions spelled differently.
      #
      # Verified locally against the pinned abicheck, both libraries, with this
      # exact config and policy file and a baseline dumped by that same commit:
      #
      #   libonedal_core.so  COMPATIBLE_WITH_RISK  exit 0
      #                      breaking=0 api_break=0 risk=82 compatible=1
      #   libonedal.so       COMPATIBLE_WITH_RISK  exit 0
      #                      breaking=0 api_break=0 risk=16 compatible=12
      #
      # abi_breaking count 0 and blocking false on both, "severity gate: pass
      # (no error-level findings)", every finding printed with symbol and
      # location, and no `suppressed` key in the JSON at all. Both runs used
      # `--max-findings 200` and `--policy strict_abi --policy-file ...`, i.e.
      # exactly what the steps below send. Three negative controls:
      #
      #  * the same two scans with neither policy file nor suppressions exit 4
      #    (79 breaking on daal; 7 breaking + 6 api_break on oneapi::dal);
      #  * the policy file with every selector string suffixed so that each rule
      #    still parses but matches nothing -- libonedal.so returns to verdict
      #    BREAKING, exit 4, with type_vtable_changed back at breaking and both
      #    experimental_removed_without_replacement and constant_changed back at
      #    api_break, which is what shows the four scoped rules and not the
      #    kind-global one are doing that work;
      #  * the reverse direction -- 2026.0.0's binaries scanned against a
      #    baseline dumped from main, so that symbols really are gone -- exits 4
      #    with verdict BREAKING, blocking true, abi_breaking 8 (5 func_removed,
      #    2 type_removed, 1 enum_member_removed) even *with* this policy file
      #    applied.
      #
      # The gate has not been disabled.
      - name: Run abicheck (daal)
        if: steps.baselines.outputs.available == 'true'
        uses: abicheck/abicheck@93374aad379e6319bfc2d044336ceb6a41bb7df2 # main
        with:
          mode: scan
          new-library: __release_lnx/daal/latest/lib/intel64/libonedal_core.so
          new-header: >-
            cpp/daal/include/daal.h
            cpp/daal/include/algorithms/tsne/tsne_gradient_descent.h
            cpp/daal/include/data_management/data/internal/finiteness_checker.h
            cpp/daal/include/data_management/data/internal/roc_auc_score.h
            cpp/daal/include/data_management/data/internal/train_test_split.h
            cpp/daal/include/services/internal/hash_table.h
            cpp/daal/include/data_management/data/internal/base_arrow_numeric_table.h
          include: cpp/daal/include
          depth: headers
          ast-frontend: clang
          gcc-path: icpx
          gcc-options: "-std=c++17"
          abi-baseline: ${{ env.ABICHECK_BASELINE_DAAL }}
          public-header-dir: cpp/daal/include
          policy-file: .github/.abicheck-policy.yaml
          extra-args: --max-findings 200
          build-config: .abicheck.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
