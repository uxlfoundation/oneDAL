name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # use workflow dispatch to regenerate cache
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  LinuxMakeDPCPP:
    if: github.repository == 'uxlfoundation/oneDAL'
    strategy:
      fail-fast: false
      matrix:
        include:
          - ISA: avx2
            runner: ubuntu-24.04

    runs-on: ${{ matrix.runner }}
    name: LinuxMakeDPCPP(${{ matrix.ISA }})
    timeout-minutes: 360

    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install DPC++
        run: .ci/env/apt.sh dpcpp
      - name: Install MKL
        run: .ci/env/apt.sh mkl
      - name: System Info
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/describe_system.sh
      - name: Set environment variables
        run: |
          # reduce GPU driver/runner related memory issues
          echo "NEOReadDebugKeys=1" >> "$GITHUB_ENV"
          echo "EnableRecoverablePageFaults=1" >> "$GITHUB_ENV"
          echo "GpuFaultCheckThreshold=0" >> "$GITHUB_ENV"
      - name: Make daal
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target daal --jobs 20
          rm -rf __work
      - name: Make onedal
        id: onedal-dbg
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target oneapi_c --jobs 20
          rm -rf __work
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target oneapi_dpc --jobs 20
          # clean up build directory due to space limitations
          rm -rf __work
          echo "key=__release_lnx-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare Cache build
        if: github.event_name != 'pull_request'
        run: cp -r __release_lnx __release_lnx_main
      - name: Cache build
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.onedal-dbg.outputs.key }}
          path: ./__release_lnx_main
      - name: Remove Cache build
        if: github.event_name != 'pull_request'
        run: rm -rf __release_lnx_main
      - name: Archive build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: __release_lnx
          path: ./__release_lnx
      - name: Make onedal
        if: matrix.runner != 'ubuntu-24.04'
        run: |
          source /opt/intel/oneapi/setvars.sh
          rm -rf __work
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target onedal --jobs 20
          rm -rf __work
      - name: daal/cpp examples
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind examples --build-dir __release_lnx --compiler icx --interface daal/cpp --build-system cmake
      - name: oneapi/cpp examples
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind examples --build-dir __release_lnx --compiler icx --interface oneapi/cpp --build-system cmake
      - name: oneapi/dpc examples
        if: matrix.runner != 'ubuntu-24.04'
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind examples --build-dir __release_lnx --compiler icx --interface oneapi/dpc --build-system cmake
      # Miniforge is necessary in order to get Intel MPI from conda-forge for MPI samples
      - name: Install Miniforge
        run: .ci/env/apt.sh miniforge
      - name: daal/cpp/mpi samples
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind samples --build-dir __release_lnx --compiler gnu --interface daal/cpp/mpi --conda-env ci-env --build-system cmake

  LinuxABICheck:
    name: ABI Conformance(avx2)
    needs: LinuxMakeDPCPP
    if: |
      github.repository == 'uxlfoundation/oneDAL' &&
      github.event_name == 'pull_request' &&
      ! contains(toJson(github.event.pull_request.labels.*.name), '"API/ABI breaking change"')
    runs-on: ubuntu-24.04
    env:
      LIBABIGAIL_DEFAULT_USER_SUPPRESSION_FILE: ${{ github.workspace }}/.github/.abignore
    timeout-minutes: 20

    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@v7
      - name: install ABI checking tools
        run: .ci/env/apt.sh abigail
      - name: Check Cache
        id: get-cache-key
        run: |
          CACHE_KEY=`gh cache list --sort created_at --key __release_lnx --json key --jq .[0].key`
          echo "key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"
          echo $CACHE_KEY
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download oneDAL main build
        uses: actions/cache/restore@v6
        with:
          path: ./__release_lnx_main
          key: ${{ steps.get-cache-key.outputs.key }}
      - name: Download oneDAL build artifact
        uses: actions/download-artifact@v8
        with:
          name: __release_lnx
          path: ./__release_lnx
      - name: Check ABI conformance
        run: |
          echo "Note: This check uses abidiff to verify ABI compliance of an SSE/AVX512 oneDAL build."
          echo "It compares to the last completed main build, whose commit can be found in the 'Check Cache' step."
          echo "The ABI for other ISAs are assumed to match the SSE or AVX512 version, any ISA-specific exported "
          echo "information that is ISA unique must be manually checked. If no shared objects are found, then "
          echo "please rerun the main 'CI' workflow via GitHub's workflow dispatch to regenerate the cache."
          echo "Keep the branch up to date with oneDAL 'main' as it may otherwise not contain the latest changes "
          echo "in the ABI that can lead to erroneous failures in the ABI check."
          .ci/scripts/abi_check.sh __release_lnx_main/daal/latest/lib/intel64/ __release_lnx/daal/latest/lib/intel64/

  # Second, independent ABI gate, running in parallel with the libabigail
  # LinuxABICheck job above -- both depend only on LinuxMakeDPCPP, not on each
  # other. abicheck diffs this PR's public-header AST plus the library's
  # exported symbols against the last release's stored snapshot, one job per
  # shared object -- catching header/binary mismatches and release-over-release
  # drift that a binary-vs-last-main `abidiff` cannot see. Design, measurements
  # and the evidence behind every policy downgrade: .github/abicheck/README.md.
  # Keep that document in step with this job.
  LinuxAbicheckScan:
    name: Abicheck (${{ matrix.library }})
    needs: LinuxMakeDPCPP
    if: |
      github.repository == 'uxlfoundation/oneDAL' &&
      github.event_name == 'pull_request' &&
      ! contains(toJson(github.event.pull_request.labels.*.name), '"API/ABI breaking change"')
    runs-on: ubuntu-24.04
    # Worst case is libonedal_dpc.so: the whole oneapi::dal header tree parsed
    # by icpx with -fsycl -DONEDAL_DATA_PARALLEL. Measured with the pin below,
    # on the no-debug-info build LinuxMakeDPCPP produces -- L2 evidence
    # (public-header AST plus exported symbols) needs no DWARF, so nothing here
    # depends on debug info that build does not emit. A *rerun* is much faster
    # only because abicheck caches resolved snapshots, so it is the first run on
    # a fresh runner this timeout has to cover. Per-library timings and the
    # memory breakdown: .github/abicheck/README.md.
    timeout-minutes: 45
    permissions:
      contents: read
      # Only for upload-sarif at the end of the job. The check itself needs
      # nothing beyond contents: read.
      security-events: write
    strategy:
      # Every library is analysed even when another one breaks: a change that
      # breaks libonedal.so usually breaks libonedal_dpc.so too, and seeing
      # both in one run is the difference between one fix and two.
      fail-fast: false
      matrix:
        # oneDAL's public surface is three independent header sets across six
        # shared objects, so each one is scoped explicitly here -- a library
        # compared against the wrong header set reports every header-only
        # difference as a spurious add/remove. -fsycl is required for any header
        # that reaches sycl/sycl.hpp, and -DONEDAL_DATA_PARALLEL is what makes
        # the sycl::queue overloads visible -- exactly the part of the API only
        # the _dpc libraries export. The baseline workflow
        # (.github/workflows/abicheck-baseline.yml) captures each library with
        # this same scoping; if the two drift apart, the profile fingerprint
        # stops matching and the comparison fails as NOT_COMPARABLE rather than
        # reporting a false break.
        include:
          - library: libonedal_core.so
            headers: >-
              cpp/daal/include/daal.h
              cpp/daal/include/algorithms/tsne/tsne_gradient_descent.h
              cpp/daal/include/data_management/data/internal/finiteness_checker.h
              cpp/daal/include/data_management/data/internal/roc_auc_score.h
              cpp/daal/include/data_management/data/internal/train_test_split.h
              cpp/daal/include/services/internal/hash_table.h
              cpp/daal/include/data_management/data/internal/base_arrow_numeric_table.h
            include: cpp/daal/include
            options: -std=c++17
          - library: libonedal.so
            headers: >-
              cpp/oneapi/dal.hpp
              cpp/oneapi/dal/algo/correlation_distance.hpp
              cpp/oneapi/dal/algo/cosine_distance.hpp
              cpp/oneapi/dal/algo/dbscan.hpp
              cpp/oneapi/dal/algo/linear_regression.hpp
              cpp/oneapi/dal/algo/logistic_regression.hpp
              cpp/oneapi/dal/table/csr_accessor.hpp
            include: cpp
            options: -fsycl -std=c++17
          - library: libonedal_dpc.so
            headers: >-
              cpp/oneapi/dal.hpp
              cpp/oneapi/dal/algo/correlation_distance.hpp
              cpp/oneapi/dal/algo/cosine_distance.hpp
              cpp/oneapi/dal/algo/dbscan.hpp
              cpp/oneapi/dal/algo/linear_regression.hpp
              cpp/oneapi/dal/algo/logistic_regression.hpp
              cpp/oneapi/dal/table/csr_accessor.hpp
            include: cpp
            options: -fsycl -DONEDAL_DATA_PARALLEL -std=c++17
          # Of the 14 installed parameters headers only system_parameters.hpp is
          # consumable as shipped: the other 12 include
          # oneapi/dal/backend/dispatcher.hpp, and oneapi/dal/backend/ is not
          # installed, so scoping to them would scope against a surface no
          # consumer can reach. That packaging gap is an oneDAL issue of its own.
          - library: libonedal_parameters.so
            headers: cpp/oneapi/dal/detail/parameters/system_parameters.hpp
            include: cpp
            options: -fsycl -std=c++17
          - library: libonedal_parameters_dpc.so
            headers: cpp/oneapi/dal/detail/parameters/system_parameters.hpp
            include: cpp
            options: -fsycl -DONEDAL_DATA_PARALLEL -std=c++17
          # No installed public header at all -- libonedal_thread.so's _daal_*
          # threading entry points are declared only in cpp/daal/src/threading/,
          # which is not shipped -- so it is carried ELF-only, by design rather
          # than as a gap. With no headers to parse it needs no DPC++ either.
          - library: libonedal_thread.so
    env:
      # The baseline release tag lives here once: the fetch step and the check
      # have to name the same asset. Rotating to a newer baseline means
      # dispatching "Publish Abicheck Baseline" for that tag and editing this
      # line -- see .github/abicheck/README.md ("Rotation").
      ABICHECK_BASELINE_TAG: 2026.0.0
      ABICHECK_BASELINE_DIR: __abi_baselines
    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download oneDAL build artifact
        uses: actions/download-artifact@v8
        with:
          name: __release_lnx
          path: ./__release_lnx
      # abicheck parses the public headers with icpx (ast-frontend: clang)
      # because cpp/oneapi/dal pulls in sycl/sycl.hpp, which castxml and GCC
      # cannot parse at all; setvars.sh has to be sourced and PATH persisted so
      # `icpx` resolves in the check step.
      - name: Install DPC++
        if: matrix.headers != ''
        run: .ci/env/apt.sh dpcpp
      - name: Put icpx on PATH
        if: matrix.headers != ''
        run: |
          source /opt/intel/oneapi/setvars.sh
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      # The baselines are release assets published by
      # .github/workflows/abicheck-baseline.yml; the committed digest file is
      # the trust anchor, so a replaced or corrupted asset fails this job
      # instead of silently changing every PR's verdict. Before that file
      # exists on main the check cannot compare anything -- the publishing
      # workflow can only be dispatched once it is *on* the default branch --
      # so that state is a skip with a warning annotation, i.e. visibly inert
      # rather than red (which would block the PR delivering it) or quietly
      # green.
      - name: Fetch and verify ABI baselines
        id: baselines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sums=".github/abicheck/baselines/${ABICHECK_BASELINE_TAG}.abicheck.sha256"
          if [ ! -f "$sums" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            note="ABI scan skipped: no baseline digest file (${sums}) on this branch, so there is nothing to verify a release asset against. Dispatch the 'Publish Abicheck Baseline' workflow on main for tag ${ABICHECK_BASELINE_TAG} to arm this gate."
            echo "::warning title=ABI baseline missing::${note}"
            {
              echo "### Abicheck"
              echo ""
              echo "${note}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # __abi_report is created here because the check step below writes its
          # SARIF into it and abicheck does not create the parent directory.
          mkdir -p "${ABICHECK_BASELINE_DIR}" __abi_report
          # Download exactly the assets the digest file names, one --pattern per
          # line: an extra asset on the release cannot be pulled in, and a
          # missing one fails here rather than later as a confusing "no
          # baseline" error. --pattern is a glob, and the published names
          # (<tag>-<library>.abicheck.json.zst) contain no metacharacter.
          while read -r _digest name; do
            [ -n "${name:-}" ] || continue
            gh release download "${ABICHECK_BASELINE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${name}" \
              --dir "${ABICHECK_BASELINE_DIR}" \
              --clobber
          done < "$sums"
          # Verify before use. --check fails on a digest mismatch or a missing
          # file, --strict on a malformed line, so a truncated or hand-edited
          # digest file cannot degrade into "nothing to check, all good".
          ( cd "${ABICHECK_BASELINE_DIR}" && sha256sum --check --strict "${GITHUB_WORKSPACE}/${sums}" )
          echo "available=true" >> "$GITHUB_OUTPUT"
      # The pin must stay equal to the one in abicheck-baseline.yml: a baseline
      # captured by an older abicheck silently under-reports rather than
      # failing. `uses:` takes no expression, so it cannot be shared through an
      # env var -- the two workflows carry the same literal SHA.
      - name: Check ABI against the released baseline
        if: steps.baselines.outputs.available == 'true'
        uses: abicheck/abicheck@c599daf737b673531a6611a7005e0efde18345b5
        with:
          mode: compare
          old-library: ${{ env.ABICHECK_BASELINE_DIR }}/${{ env.ABICHECK_BASELINE_TAG }}-${{ matrix.library }}.abicheck.json.zst
          new-library: __release_lnx/daal/latest/lib/intel64/${{ matrix.library }}
          header: ${{ matrix.headers }}
          include: ${{ matrix.include }}
          gcc-options: ${{ matrix.options }}
          ast-frontend: ${{ matrix.headers && 'clang' || '' }}
          gcc-path: ${{ matrix.headers && 'icpx' || '' }}
          old-version: ${{ env.ABICHECK_BASELINE_TAG }}
          new-version: ${{ github.sha }}
          # Every downgrade in here is evidence-backed; .github/abicheck/README.md
          # records the evidence per rule.
          policy-file: .github/abicheck/policy.yaml
          # icpx and the release artifact are already on the runner, and the
          # default (conda-forge) would install a castxml/GCC toolchain this
          # check never uses -- castxml cannot parse sycl/sycl.hpp at all.
          dependency-source: none
          format: sarif
          output-file: __abi_report/${{ matrix.library }}.sarif
          # One sticky PR comment, six jobs: they would overwrite each other's
          # report. Each job's own summary carries its verdict instead.
          pr-comment: false
          # The Action's own SARIF upload hardcodes category "abicheck", so six
          # uploads would collide into one result set; the step below uploads
          # each library under its own category.
          upload-sarif: false
      # always(): the findings are most useful when the check failed. abicheck
      # writes the report before exiting non-zero, so hashFiles() coming back
      # empty means it died earlier and its own step log is the signal -- which
      # upload-sarif failing hard on a missing file would only bury.
      - name: Upload ABI findings to code scanning
        if: |
          always() && steps.baselines.outputs.available == 'true' &&
          hashFiles(format('__abi_report/{0}.sarif', matrix.library)) != ''
        uses: github/codeql-action/upload-sarif@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
        with:
          sarif_file: __abi_report/${{ matrix.library }}.sarif
          category: abicheck-${{ matrix.library }}
