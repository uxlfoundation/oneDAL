name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # use workflow dispatch to regenerate cache
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  LinuxMakeDPCPP:
    if: github.repository == 'uxlfoundation/oneDAL'
    strategy:
      fail-fast: false
      matrix:
        include:
          - ISA: avx2
            runner: ubuntu-24.04

    runs-on: ${{ matrix.runner }}
    name: LinuxMakeDPCPP(${{ matrix.ISA }})
    timeout-minutes: 360

    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install DPC++
        run: .ci/env/apt.sh dpcpp
      - name: Install MKL
        run: .ci/env/apt.sh mkl
      - name: System Info
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/describe_system.sh
      - name: Set environment variables
        run: |
          # reduce GPU driver/runner related memory issues
          echo "NEOReadDebugKeys=1" >> "$GITHUB_ENV"
          echo "EnableRecoverablePageFaults=1" >> "$GITHUB_ENV"
          echo "GpuFaultCheckThreshold=0" >> "$GITHUB_ENV"
      - name: Make daal
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target daal --jobs 20
          rm -rf __work
      - name: Make onedal
        id: onedal-dbg
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target oneapi_c --jobs 20
          rm -rf __work
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target oneapi_dpc --jobs 20
          # clean up build directory due to space limitations
          rm -rf __work
          echo "key=__release_lnx-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare Cache build
        if: github.event_name != 'pull_request'
        run: cp -r __release_lnx __release_lnx_main
      - name: Cache build
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.onedal-dbg.outputs.key }}
          path: ./__release_lnx_main
      - name: Remove Cache build
        if: github.event_name != 'pull_request'
        run: rm -rf __release_lnx_main
      - name: Archive build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: __release_lnx
          path: ./__release_lnx
      - name: Make onedal
        if: matrix.runner != 'ubuntu-24.04'
        run: |
          source /opt/intel/oneapi/setvars.sh
          rm -rf __work
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target onedal --jobs 20
          rm -rf __work
      - name: daal/cpp examples
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind examples --build-dir __release_lnx --compiler icx --interface daal/cpp --build-system cmake
      - name: oneapi/cpp examples
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind examples --build-dir __release_lnx --compiler icx --interface oneapi/cpp --build-system cmake
      - name: oneapi/dpc examples
        if: matrix.runner != 'ubuntu-24.04'
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind examples --build-dir __release_lnx --compiler icx --interface oneapi/dpc --build-system cmake
      # Miniforge is necessary in order to get Intel MPI from conda-forge for MPI samples
      - name: Install Miniforge
        run: .ci/env/apt.sh miniforge
      - name: daal/cpp/mpi samples
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind samples --build-dir __release_lnx --compiler gnu --interface daal/cpp/mpi --conda-env ci-env --build-system cmake

  LinuxABICheck:
    name: ABI Conformance(avx2)
    needs: LinuxMakeDPCPP
    if: |
      github.repository == 'uxlfoundation/oneDAL' &&
      github.event_name == 'pull_request' &&
      ! contains(toJson(github.event.pull_request.labels.*.name), '"API/ABI breaking change"')
    runs-on: ubuntu-24.04
    env:
      LIBABIGAIL_DEFAULT_USER_SUPPRESSION_FILE: ${{ github.workspace }}/.github/.abignore
    timeout-minutes: 20

    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@v7
      - name: install ABI checking tools
        run: .ci/env/apt.sh abigail
      - name: Check Cache
        id: get-cache-key
        run: |
          CACHE_KEY=`gh cache list --sort created_at --key __release_lnx --json key --jq .[0].key`
          echo "key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"
          echo $CACHE_KEY
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download oneDAL main build
        uses: actions/cache/restore@v6
        with:
          path: ./__release_lnx_main
          key: ${{ steps.get-cache-key.outputs.key }}
      - name: Download oneDAL build artifact
        uses: actions/download-artifact@v8
        with:
          name: __release_lnx
          path: ./__release_lnx
      - name: Check ABI conformance
        run: |
          echo "Note: This check uses abidiff to verify ABI compliance of an SSE/AVX512 oneDAL build."
          echo "It compares to the last completed main build, whose commit can be found in the 'Check Cache' step."
          echo "The ABI for other ISAs are assumed to match the SSE or AVX512 version, any ISA-specific exported "
          echo "information that is ISA unique must be manually checked. If no shared objects are found, then "
          echo "please rerun the main 'CI' workflow via GitHub's workflow dispatch to regenerate the cache."
          echo "Keep the branch up to date with oneDAL 'main' as it may otherwise not contain the latest changes "
          echo "in the ABI that can lead to erroneous failures in the ABI check."
          .ci/scripts/abi_check.sh __release_lnx_main/daal/latest/lib/intel64/ __release_lnx/daal/latest/lib/intel64/

  # Second, independent ABI gate, running in parallel with the libabigail
  # LinuxABICheck job above -- both depend only on LinuxMakeDPCPP, not on each
  # other. abicheck diffs this PR's public-header AST plus its exported symbols,
  # per library, against the last release's stored bundle facts, and then folds
  # the six diffs into one whole-product comparison -- so it catches
  # header/binary mismatches, cross-library breaks and release-over-release
  # drift that a binary-vs-last-main `abidiff` cannot see.
  #
  # What each of the two checks sees and misses, why the header roots are an
  # explicit list rather than the directories, how the baselines are published
  # and digest-verified, and the evidence behind every policy downgrade:
  # .github/abicheck/README.md. Keep that document in step with this job.
  LinuxAbicheckScan:
    name: Abicheck (header scan + binary, avx2)
    needs: LinuxMakeDPCPP
    if: |
      github.repository == 'uxlfoundation/oneDAL' &&
      github.event_name == 'pull_request' &&
      ! contains(toJson(github.event.pull_request.labels.*.name), '"API/ABI breaking change"')
    runs-on: ubuntu-24.04
    # Measured end to end with the abicheck commit pinned below, against a
    # baseline captured by that same commit, on the same no-debug-info build
    # LinuxMakeDPCPP produces: **31m28s wall, 8.03 GiB peak RSS**, exit 0.
    # Per library, resolving the new side: libonedal_core.so 6m45s,
    # libonedal.so 3m42s, libonedal_dpc.so 10m03s, libonedal_parameters.so
    # 1m00s, libonedal_parameters_dpc.so 7m32s, libonedal_thread.so 0.1s
    # (ELF-only) -- 29m02s of resolving, plus ~2.5 min to load the baseline,
    # fold the six diffs and write the reports. All six are parsed serially,
    # one process, one core, so the wall time is a sum and adding a library
    # adds its full cost.
    #
    # The peak is the number to watch, and it is higher than the three
    # per-library scans this replaced (6.25 GB) for a structural reason: the
    # baseline is one BundleFacts document covering all six libraries, so it
    # stays resident (~3-4 GB, 902 MiB of JSON inflated in memory) while each
    # new side is resolved on top of it. That resident baseline plus the 5.4 GB
    # libonedal_dpc.so parse is where 8.03 GiB comes from. It still fits a
    # 16 GB standard runner, but the margin is now ~8 GB rather than ~10, so
    # re-measure before adding a library or raising evidence depth.
    #
    # 75 minutes leaves room for the DPC++ apt install and the artifact
    # download on top. (Measured on a 224-core host; since the work is
    # single-threaded the wall time is still a lower bound for a
    # GitHub-hosted runner, which has slower cores.)
    #
    # Do not read anything into a *rerun* being much faster: abicheck caches
    # resolved snapshots, so only the first run on a fresh runner is
    # representative, and that is the one this timeout has to cover.
    timeout-minutes: 75
    permissions:
      contents: read
      # Only for upload-sarif at the end of the job. The gate itself needs
      # nothing beyond contents: read.
      security-events: write
    env:
      # The baseline release tag lives here once: the fetch step and the gate
      # have to name the same asset. Rotating to a newer baseline means
      # dispatching "Publish Abicheck Baseline" for that tag and editing this
      # line -- see .github/abicheck/README.md ("Rotation").
      ABICHECK_BASELINE_TAG: 2026.0.0
      ABICHECK_BASELINE_DIR: __abi_baselines
      # The abicheck commit this gate runs. Not a `uses:` pin because the gate
      # drives abicheck as a Python library, so it is installed with pip; it
      # must still equal the pin in abicheck-baseline.yml.
      ABICHECK_PIN: 793849f3cb7c3eb7c5add2b90ca31b6c5849834b
    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download oneDAL build artifact
        uses: actions/download-artifact@v8
        with:
          name: __release_lnx
          path: ./__release_lnx
      - name: Install DPC++
        run: .ci/env/apt.sh dpcpp
      # abicheck parses the public headers with icpx itself (--ast-frontend
      # clang / gcc-path: icpx) because cpp/oneapi/dal pulls in sycl/sycl.hpp,
      # which castxml/GCC cannot parse at all. setvars.sh has to be sourced and
      # PATH persisted so `icpx` resolves. Rationale and the L4/plugin
      # limitation: .github/abicheck/README.md.
      - name: Put icpx on PATH
        run: |
          source /opt/intel/oneapi/setvars.sh
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      # The baselines are release assets, published by
      # .github/workflows/abicheck-baseline.yml. The committed digest file is
      # the trust anchor: the assets are downloaded from the release and then
      # checked against sha256sums pinned by a reviewed commit, so a replaced
      # or corrupted asset fails this job instead of silently changing every
      # PR's verdict.
      #
      # Before that digest file exists on main this gate cannot compare
      # anything -- the publishing workflow can only be dispatched once it is
      # *on* the default branch. That state is reported as a skip with a
      # warning annotation and a job-summary note, i.e. inert and visibly
      # inert, rather than red (which would block the PR that delivers the
      # workflow) or quietly green.
      - name: Fetch and verify ABI baselines
        id: baselines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sums=".github/abicheck/baselines/${ABICHECK_BASELINE_TAG}.abicheck.sha256"
          if [ ! -f "$sums" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            note="ABI scan skipped: no baseline digest file (${sums}) on this branch, so there is nothing to verify a release asset against. Dispatch the 'Publish Abicheck Baseline' workflow on main for tag ${ABICHECK_BASELINE_TAG} to arm this gate."
            echo "::warning title=ABI baseline missing::${note}"
            {
              echo "### Abicheck"
              echo ""
              echo "${note}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "${ABICHECK_BASELINE_DIR}"
          # Download exactly the assets the digest file names, one --pattern
          # per line: an extra asset appearing on the release cannot be pulled
          # in, and a missing one fails here rather than later as a confusing
          # "no baseline" error. gh's --pattern is a glob, so names containing
          # a metacharacter would over-match; the names this workflow publishes
          # are <tag>-<library>.abicheck.json.zst, which contain none.
          while read -r _digest name; do
            [ -n "${name:-}" ] || continue
            gh release download "${ABICHECK_BASELINE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${name}" \
              --dir "${ABICHECK_BASELINE_DIR}" \
              --clobber
          done < "$sums"
          # Verify before use. --check fails on a digest mismatch or a missing
          # file, --strict on a malformed line, so a truncated or hand-edited
          # digest file cannot degrade into "nothing to check, all good".
          ( cd "${ABICHECK_BASELINE_DIR}" && sha256sum --check --strict "${GITHUB_WORKSPACE}/${sums}" )
          echo "available=true" >> "$GITHUB_OUTPUT"
      # One whole-product gate, not three per-library scans. `scan` analyses
      # exactly one artifact, so covering oneDAL's classic DAAL API,
      # oneapi::dal host API and oneapi::dal SYCL API took three scans -- and
      # three scans structurally cannot see a cross-library break, because each
      # one is blind to the other five DSOs. oneDAL is one header tree
      # implemented across six interdependent shared objects, so the breakage
      # that matters most here (a symbol moving between libraries, an
      # intra-bundle DT_NEEDED edge losing its provider) was invisible to the
      # gate that shipped before this step.
      #
      # abicheck's bundle layer (ADR-023) is built for exactly this shape and
      # names oneDAL as its motivating case, but it is reachable only from
      # Python -- upstream deliberately left
      # `compare_release_against_bundle_facts` off `abicheck compare`, and it
      # can express neither a per-library compile context nor per-library
      # header roots, both of which oneDAL needs. So this step drives abicheck
      # as a library instead of through the composite Action, via
      # .github/abicheck/bundle_gate.py. Everything the three scans produced --
      # report text, SARIF, the per-library verdicts -- is produced there too;
      # see that file's docstring and .github/abicheck/README.md.
      #
      # The pin below must stay equal to the one in abicheck-baseline.yml: a
      # baseline captured by an older abicheck silently under-reports rather
      # than failing. Because this is a pip install rather than a `uses:`, the
      # sha is in ABICHECK_PIN at the top of the job.
      - name: Install abicheck
        if: steps.baselines.outputs.available == 'true'
        run: python3 -m pip install --disable-pip-version-check
          "abicheck @ git+https://github.com/abicheck/abicheck@${{ env.ABICHECK_PIN }}"
      # Header-scoped, per library: L2 evidence (public-header AST plus the
      # binary's exported symbols) needs no debug info, which is what keeps
      # this practical -- LinuxMakeDPCPP builds without --debug symbols, so no
      # evidence here depends on DWARF being present.
      #
      # policy.yaml still applies: the driver loads it through the same
      # service.load_suppression_and_policy/compare_snapshots chokepoints the
      # CLI uses, so the re-classifications survive the switch off `scan`.
      - name: Run whole-product ABI gate
        id: gate
        if: steps.baselines.outputs.available == 'true'
        run: |
          python3 .github/abicheck/bundle_gate.py gate \
            --source . \
            --lib-dir __release_lnx/daal/latest/lib/intel64 \
            --facts "${ABICHECK_BASELINE_DIR}/${ABICHECK_BASELINE_TAG}-bundle.abicheck.json.zst" \
            --policy .github/abicheck/policy.yaml \
            --version "${GITHUB_SHA}" \
            --output __abi_report/summary.json \
            --report-md __abi_report/report.md \
            --sarif __abi_report/abicheck.sarif
      # always(): the report is most useful exactly when the gate failed. The
      # gate writes both reports before returning a non-zero exit, so a missing
      # file means it died earlier than that -- in which case its own stderr is
      # the signal and a bare `cat` failure here would only bury it. Same reason
      # for the hashFiles() guard on the upload below: upload-sarif fails hard on
      # a missing file, which would turn one real failure into two red steps.
      - name: Publish the ABI report
        if: always() && steps.baselines.outputs.available == 'true'
        run: |
          if [ -f __abi_report/report.md ]; then
            cat __abi_report/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The ABI gate wrote no report; see its step log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload ABI findings to code scanning
        if: |
          always() && steps.baselines.outputs.available == 'true' &&
          hashFiles('__abi_report/abicheck.sarif') != ''
        uses: github/codeql-action/upload-sarif@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
        with:
          sarif_file: __abi_report/abicheck.sarif
          category: abicheck
