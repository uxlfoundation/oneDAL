name: CI

on:
  pull_request:
    branches:
      - main
    # Skip PR builds for changes that cannot affect the library build or tests.
    # Pushes to main are not filtered.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'dev/agent_evals/**'
      - 'conda-recipe/**'
      - 'third-party-programs.txt'
      - '.ci/pipeline/docs.yml'
      - '.github/CODEOWNERS'
      - '.github/renovate.json'
      - '.github/.licenserc.yaml'
      - '.github/.mergify.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/instructions/**'
      - '.github/workflows/check-intel-urls.yml'
      - '.github/workflows/ci-conda-recipe.yml'
      - '.github/workflows/coverity.yml'
      - '.github/workflows/docker-validation-nightly.yml'
      - '.github/workflows/docs-release.yml'
      - '.github/workflows/label-enforcement.yml'
      - '.github/workflows/nightly-build.yml'
      - '.github/workflows/nightly-test.yml'
      - '.github/workflows/openssf-scorecard.yml'
      - '.github/workflows/pr-checklist.yml'
      - '.github/workflows/renovate-validation.yml'
      - '.github/workflows/skywalking-eyes.yml'
      - '.github/workflows/slack-pr-notification.yml'
  push:
    branches:
      - main
  # use workflow dispatch to regenerate cache
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  LinuxMakeDPCPP:
    if: false  # TEMPORARY: only LinuxMakeIncremental runs on this PR; revert before merge
    strategy:
      fail-fast: false
      matrix:
        include:
          - ISA: avx2
            runner: ubuntu-24.04

    runs-on: ${{ matrix.runner }}
    name: LinuxMakeDPCPP(${{ matrix.ISA }})
    timeout-minutes: 360

    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install DPC++
        run: .ci/env/apt.sh dpcpp
      - name: Install MKL
        run: .ci/env/apt.sh mkl
      - name: System Info
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/describe_system.sh
      - name: Set environment variables
        run: |
          # reduce GPU driver/runner related memory issues
          echo "NEOReadDebugKeys=1" >> "$GITHUB_ENV"
          echo "EnableRecoverablePageFaults=1" >> "$GITHUB_ENV"
          echo "GpuFaultCheckThreshold=0" >> "$GITHUB_ENV"
      - name: Make daal
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target daal --jobs 20
          rm -rf __work
      - name: Make onedal
        id: onedal-dbg
        run: |
          source /opt/intel/oneapi/setvars.sh
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target oneapi_c --jobs 20
          rm -rf __work
          .ci/scripts/build.sh --compiler icx  --optimizations ${{ matrix.ISA }} --target oneapi_dpc --jobs 20
          # clean up build directory due to space limitations
          rm -rf __work
          echo "key=__release_lnx-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare Cache build
        if: github.event_name != 'pull_request'
        run: cp -r __release_lnx __release_lnx_main
      - name: Cache build
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.onedal-dbg.outputs.key }}
          path: ./__release_lnx_main
      - name: Remove Cache build
        if: github.event_name != 'pull_request'
        run: rm -rf __release_lnx_main
      - name: Archive build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: __release_lnx
          path: ./__release_lnx
      - name: daal/cpp examples
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind examples --build-dir __release_lnx --compiler icx --interface daal/cpp --build-system cmake
      - name: oneapi/cpp examples
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind examples --build-dir __release_lnx --compiler icx --interface oneapi/cpp --build-system cmake
      # The runner exposes no GPU, so the DPC++ examples run on the OpenCL CPU
      # device the compiler package itself registers: its
      # `intel-oneapi-compiler-dpcpp-cpp-runtime` part installs
      # /etc/OpenCL/vendors/intel64.icd and `setvars.sh` points
      # OCL_ICD_FILENAMES at the matching libintelocl.so. That is the same
      # device the retired Azure `LinuxMakeIntel_MKL` job used.
      - name: oneapi/dpc examples
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind examples --build-dir __release_lnx --compiler icx --interface oneapi/dpc --build-system cmake
      # Miniforge is necessary in order to get Intel MPI from conda-forge for MPI samples
      - name: Install Miniforge
        run: .ci/env/apt.sh miniforge
      - name: daal/cpp/mpi samples
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind samples --build-dir __release_lnx --compiler gnu --interface daal/cpp/mpi --conda-env ci-env --build-system cmake
      - name: oneapi/cpp/mpi samples
        run: |
            source /opt/intel/oneapi/setvars.sh
            .ci/scripts/test.sh --test-kind samples --build-dir __release_lnx --compiler gnu --interface oneapi/cpp/mpi --conda-env ci-env --build-system cmake

  # Times make rebuilds of single-file edits on top of the cached build of the last main commit.
  LinuxMakeIncremental:
    if: github.repository == 'uxlfoundation/oneDAL'
    runs-on: ubuntu-24.04
    name: LinuxMakeIncremental(avx2)
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The sources are diffed against the commit the cached build came from.
          fetch-depth: 0
      - name: Install DPC++
        run: .ci/env/apt.sh dpcpp
      - name: Install MKL
        run: .ci/env/apt.sh mkl
      # Objects built by another compiler or MKL must not be reused.
      - name: Cache key
        id: cache-key
        run: |
          source /opt/intel/oneapi/setvars.sh > /dev/null
          toolchain=$( { icpx --version | sed -n 1p; dpkg-query -W -f='${Version}' intel-oneapi-mkl-devel; } | sha256sum | cut -c1-16)
          echo "prefix=make-work-avx2-${toolchain}-" >> "$GITHUB_OUTPUT"
          {
            echo "| Step | Build time | Objects compiled |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore the last main build
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}
          path: |
            ./__work
            ./__release_lnx
      # A fresh checkout dates every file now, newer than all cached objects, so only the files
      # changed since the cached commit are dated now. Removed or renamed files would leave stale
      # objects in the link lists, so those start from scratch.
      - name: Date the sources against the cached build
        id: cached
        if: github.event_name == 'pull_request'
        run: |
          if [[ -f __work/.cache_commit ]] && [[ -z "$(git diff --name-only --diff-filter=DR "$(cat __work/.cache_commit)" HEAD)" ]]; then
            git ls-files -z | xargs -0 touch -h -d "2000-01-01 00:00:00"
            git diff --name-only -z --diff-filter=AMT "$(cat __work/.cache_commit)" HEAD | xargs -0 -r touch -h
            echo "Rebuilding on top of the cached build of $(cat __work/.cache_commit)"
            echo "hit=yes" >> "$GITHUB_OUTPUT"
          else
            rm -rf __work __release_lnx
            echo "hit=no" >> "$GITHUB_OUTPUT"
          fi
      # Without a cached build, the main commit the pull request merges into is built here.
      - name: Check out the main commit
        if: github.event_name == 'pull_request' && steps.cached.outputs.hit == 'no'
        run: git checkout -q --detach HEAD^1
      - name: Build main from scratch
        id: main_from_scratch
        if: github.event_name != 'pull_request' || steps.cached.outputs.hit == 'no'
        run: &build |
          source /opt/intel/oneapi/setvars.sh > /dev/null
          mkdir -p __incr_logs
          if [[ -n "${EDIT:-}" ]]; then
            echo "// incremental build check" >> "${EDIT}"
          fi
          log="__incr_logs/${GITHUB_ACTION}.log"
          start=${SECONDS}
          if ! .ci/scripts/build.sh --compiler icx --optimizations avx2 --target onedal > "${log}" 2>&1; then
            tail -n 100 "${log}"
            exit 1
          fi
          elapsed=$((SECONDS - start))
          compiled=$(awk '/^(icx|icpx) .* -c /{ n++ } END { print n + 0 }' "${log}")
          echo "| ${GITHUB_ACTION}${EDIT:+: \`${EDIT}\`} | $((elapsed / 60))m $((elapsed % 60))s | ${compiled} |" >> "$GITHUB_STEP_SUMMARY"
      # Checking out the merge commit rewrites, and so dates now, only the files that differ.
      - name: Check out the pull request
        if: github.event_name == 'pull_request' && steps.cached.outputs.hit == 'no'
        run: git checkout -q --detach "${GITHUB_SHA}"
      - name: Rebuild the pull request on top of main
        id: pull_request_changes
        if: github.event_name == 'pull_request'
        run: *build
      - name: Rebuild with no changes
        id: no_changes
        if: github.event_name == 'pull_request'
        run: *build
      - name: Rebuild after a DAAL kernel edit
        id: daal_kernel_impl
        if: github.event_name == 'pull_request'
        env:
          EDIT: cpp/daal/src/algorithms/kmeans/kmeans_plusplus_init_impl.i
        run: *build
      - name: Rebuild after a DAAL public header edit
        id: daal_header
        if: github.event_name == 'pull_request'
        env:
          EDIT: cpp/daal/include/algorithms/kmeans/kmeans_init_types.h
        run: *build
      - name: Rebuild after a oneAPI algorithm header edit
        id: oneapi_algo_header
        if: github.event_name == 'pull_request'
        env:
          EDIT: cpp/oneapi/dal/algo/kmeans/common.hpp
        run: *build
      - name: Rebuild after a oneAPI core header edit
        id: oneapi_core_header
        if: github.event_name == 'pull_request'
        env:
          EDIT: cpp/oneapi/dal/table/common.hpp
        run: *build
      - name: Rebuild after a DPC++ kernel edit
        id: dpc_kernel
        if: github.event_name == 'pull_request'
        env:
          EDIT: cpp/oneapi/dal/algo/kmeans/backend/gpu/infer_kernel_dpc.cpp
        run: *build
      - name: Record the cached commit
        if: github.event_name != 'pull_request'
        run: git rev-parse HEAD > __work/.cache_commit
      - name: Cache the build for pull requests
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.sha }}
          path: |
            ./__work
            ./__release_lnx
      - name: Archive build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: incremental_build_logs
          path: ./__incr_logs

  LinuxABICheck:
    name: ABI Conformance(avx2)
    needs: LinuxMakeDPCPP
    if: |
      github.repository == 'uxlfoundation/oneDAL' &&
      github.event_name == 'pull_request' &&
      ! contains(toJson(github.event.pull_request.labels.*.name), '"API/ABI breaking change"')
    runs-on: ubuntu-26.04
    env:
      LIBABIGAIL_DEFAULT_USER_SUPPRESSION_FILE: ${{ github.workspace }}/.github/.abignore
    timeout-minutes: 20

    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@v7
      - name: install ABI checking tools
        run: .ci/env/apt.sh abigail
      - name: Check Cache
        id: get-cache-key
        run: |
          # `gh cache list` reports every scope in the repository, not only the
          # ones this run can restore from. Without `--ref` the newest matching
          # key can belong to another pull request's scope, which `cache/restore`
          # cannot read: the restore then misses silently and the check below
          # compares against an empty directory. Only main-scoped entries are
          # both restorable here and produced by a build of main.
          CACHE_KEY=$(gh cache list --ref refs/heads/main --sort created_at --limit 1 --key __release_lnx --json key --jq '.[0].key')
          if [ -z "${CACHE_KEY}" ] || [ "${CACHE_KEY}" = "null" ]; then
            echo "::error::No __release_lnx cache found on refs/heads/main. Rerun the 'CI' workflow on main via workflow dispatch to regenerate it."
            exit 1
          fi
          echo "key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"
          echo $CACHE_KEY
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download oneDAL main build
        uses: actions/cache/restore@v6
        with:
          path: ./__release_lnx_main
          key: ${{ steps.get-cache-key.outputs.key }}
          # A miss must stop the job. Continuing leaves `__release_lnx_main`
          # empty, and an ABI comparison against nothing reports success.
          fail-on-cache-miss: true
      - name: Download oneDAL build artifact
        uses: actions/download-artifact@v8
        with:
          name: __release_lnx
          path: ./__release_lnx
      - name: Check ABI conformance
        run: |
          echo "Note: This check uses abidiff to verify ABI compliance of an SSE/AVX512 oneDAL build."
          echo "It compares to the last completed main build, whose commit can be found in the 'Check Cache' step."
          echo "The ABI for other ISAs are assumed to match the SSE or AVX512 version, any ISA-specific exported "
          echo "information that is ISA unique must be manually checked. If no shared objects are found, then "
          echo "please rerun the main 'CI' workflow via GitHub's workflow dispatch to regenerate the cache."
          echo "Keep the branch up to date with oneDAL 'main' as it may otherwise not contain the latest changes "
          echo "in the ABI that can lead to erroneous failures in the ABI check."
          .ci/scripts/abi_check.sh __release_lnx_main/daal/latest/lib/intel64/ __release_lnx/daal/latest/lib/intel64/

  # The only job that builds oneDAL against conda-forge MKL and TBB rather than
  # the apt oneAPI packages, so it guards the dependency layout that the
  # conda-forge feedstock and the sklearnex conda builds see.
  LinuxMakeGNU_MKL_Conda:
    if: false  # TEMPORARY: only LinuxMakeIncremental runs on this PR; revert before merge
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    env:
      CONDA_ENV: onedal_env
      RELEASE_DIR: __release_lnx_gnu
      # `.ci/env/apt.sh miniforge` installs to this prefix and sources `conda.sh`
      # only in its own shell, so later steps cannot rely on `conda` being on
      # PATH. Name the script explicitly instead of asking `conda info --base`
      # for it, which would depend on the runner image shipping conda already.
      # `.ci/scripts/test.sh` resolves the same path the same way.
      CONDA_SH: /usr/share/miniconda/etc/profile.d/conda.sh

    steps:
      - name: Checkout oneDAL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Also creates the `ci-env` conda environment from .ci/env/environment.yml,
      # which supplies the Intel MPI that `test.sh --interface */mpi` activates.
      - name: Install Miniforge
        run: .ci/env/apt.sh miniforge
      - name: Create conda environment
        run: |
          source "${CONDA_SH}"
          conda create -y -n "${CONDA_ENV}"
          conda activate "${CONDA_ENV}"
          conda install -y -c conda-forge \
              make \
              tbb tbb-devel \
              mkl mkl-devel mkl-static \
              cmake \
              impi-devel impi_rt
      - name: System Info
        run: |
          source "${CONDA_SH}"
          conda activate "${CONDA_ENV}"
          .ci/scripts/describe_system.sh
      - name: Make daal
        run: |
          source "${CONDA_SH}"
          conda activate "${CONDA_ENV}"
          export TBBROOT="${CONDA_PREFIX}"
          export MKLROOT="${CONDA_PREFIX}"
          .ci/scripts/build.sh --compiler gnu --optimizations avx2 --backend-config mkl --target daal --jobs 20
      - name: Make onedal_c
        run: |
          source "${CONDA_SH}"
          conda activate "${CONDA_ENV}"
          export TBBROOT="${CONDA_PREFIX}"
          export MKLROOT="${CONDA_PREFIX}"
          .ci/scripts/build.sh --compiler gnu --optimizations avx2 --backend-config mkl --target onedal_c --jobs 20
      - name: Make onedal_dpc
        run: |
          source "${CONDA_SH}"
          conda activate "${CONDA_ENV}"
          conda install -y -c conda-forge \
              mkl-dpcpp mkl-devel-dpcpp \
              dpcpp-cpp-rt dpcpp_linux-64 intel-sycl-rt \
              onedpl-devel
          export TBBROOT="${CONDA_PREFIX}"
          export MKLROOT="${CONDA_PREFIX}"
          .ci/scripts/build.sh --compiler gnu --optimizations avx2 --backend-config mkl --target onedal_dpc --jobs 20
      - name: daal/cpp examples
        run: |
          source "${CONDA_SH}"
          conda activate "${CONDA_ENV}"
          export TBBROOT="${CONDA_PREFIX}"
          export MKLROOT="${CONDA_PREFIX}"
          .ci/scripts/test.sh --test-kind examples --build-dir "${RELEASE_DIR}" --compiler gnu --interface daal/cpp --build-system cmake
      - name: oneapi/cpp examples
        run: |
          source "${CONDA_SH}"
          conda activate "${CONDA_ENV}"
          export TBBROOT="${CONDA_PREFIX}"
          export MKLROOT="${CONDA_PREFIX}"
          .ci/scripts/test.sh --test-kind examples --build-dir "${RELEASE_DIR}" --compiler gnu --interface oneapi/cpp --build-system cmake
      - name: oneapi/dpc examples
        run: |
          source "${CONDA_SH}"
          conda activate "${CONDA_ENV}"
          export TBBROOT="${CONDA_PREFIX}"
          export MKLROOT="${CONDA_PREFIX}"
          .ci/scripts/test.sh --test-kind examples --build-dir "${RELEASE_DIR}" --compiler icx --interface oneapi/dpc --build-system cmake
      - name: daal/cpp/mpi samples
        run: |
          source "${CONDA_SH}"
          conda activate "${CONDA_ENV}"
          export TBBROOT="${CONDA_PREFIX}"
          export MKLROOT="${CONDA_PREFIX}"
          .ci/scripts/test.sh --test-kind samples --build-dir "${RELEASE_DIR}" --compiler gnu --interface daal/cpp/mpi --conda-env ci-env --build-system cmake
