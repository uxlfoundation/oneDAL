name: Comment blocks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  comment-blocks:
    name: Comment blocks of at most two lines
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14"
    - name: Test the check
      if: ${{ !cancelled() }}
      run: |
        python -m pip install --quiet pytest==9.0.3
        python -m pytest -q .ci/scripts/test_check_comment_blocks.py
    # Fails a comment block over two lines that the PR adds or edits; AGENTS.md has the rule.
    - name: Comment blocks
      if: ${{ !cancelled() }}
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: python .ci/scripts/check_comment_blocks.py --base "origin/$BASE_REF" --head HEAD
