#
# Project-wide abicheck configuration (see abicheck's docs/reference/config-file.md).
#
# This holds the settings that are a property of oneDAL itself rather than of
# one CI invocation: what the public header surface is, and how public headers
# must be compiled to parse at all. The workflows in .github/workflows only
# pass what genuinely varies per artifact (which .so, which umbrella header,
# whether -fsycl is needed, which baseline).
#
# Config loading is strict: an unknown key or a wrong type is a hard error
# (exit 64), so this file is deliberately limited to keys verified against
# abicheck 0.5.0 / main.

version: 1

# Public header surface. oneDAL exports two independent APIs from two
# libraries, so both roots are listed here; each CI step still points -H at
# the one umbrella header matching the library it is scanning.
sources:
  public_headers:
    - cpp/daal/include/**
    - cpp/oneapi/dal/**
  exclude:
    # Not part of either public API: internal helpers that only ship because
    # the install step copies whole directories.
    - cpp/daal/include/services/internal/**
    - cpp/daal/include/data_management/data/internal/**
    - cpp/oneapi/dal/**/detail/**
    - cpp/oneapi/dal/**/backend/**
    - cpp/oneapi/dal/test/**

# Stable half of the L2 header compile context. castxml (the default AST
# frontend) has no SYCL support at all and cpp/oneapi/dal/detail/common.hpp
# includes sycl/sycl.hpp, so the clang frontend driven by icpx is the only
# workable parser for this project -- not a stopgap.
#
# Deliberately no `include_dirs:` here. Include directories belong on the CLI
# (`include:` in each workflow step), because the two sides of a comparison
# resolve them from different roots: a PR scan runs against the checkout root
# (`cpp`, `cpp/daal/include`) while the baseline job builds a release tag into
# `__baseline_src/` and needs `__baseline_src/cpp/...`. Putting them here
# instead makes both sides load the *same* literal paths, which changes the
# include sequence on exactly one side and abicheck then -- correctly --
# refuses the comparison outright:
#
#   verdict: NOT_COMPARABLE (exit 6)
#   "old and new snapshots were extracted under different compile contexts
#    (profile_fingerprint mismatch; differing fields: include_sequence)"
#
# Verified: an otherwise-identical scan with `include_dirs` in this file exits
# 6 with zero findings, and exits 4 (i.e. actually compares) without it.
# Per-artifact driver flags (-fsycl for the oneapi::dal side) stay on the CLI
# for the same reason; compile.std/defines also accept only single
# whitespace-free option atoms.
compile:
  frontend: clang
  std: c++17

# Restrict findings to the exported public surface. This is the main
# false-positive control and matches what .github/.abignore already asserts
# for libabigail.
scope:
  public: true

# Suppression-file hygiene. oneDAL deliberately ships no suppression file --
# .github/.abicheck-policy.yaml reclassifies findings instead of deleting them,
# so that every difference stays in the report; see the rationale there. These
# two keys are inert while no --suppress is passed, and are kept so that any
# suppression file added later has to be well-formed and has to justify every
# entry, rather than that requirement having to be remembered.
suppression:
  strict: true
  require_justification: true

# Exit-code policy.
#
# `scan --against` historically computed its exit code straight from its own
# verdict (BREAKING -> 4) and ignored the severity model entirely; abicheck
# #700 wired the two together, but kept "legacy" as the default so existing
# pipelines do not change behaviour. Opting in explicitly is what lets the
# severity block below actually decide whether CI fails, instead of
# .github/workflows papering over a non-zero exit after the fact.
#
# The preset stays `default` on purpose -- abi_breaking=error, so a genuine
# ABI break still fails the job. Silencing a *category* wholesale (preset
# info-only) would also silence real breaks; the finding kinds oneDAL currently
# needs to tolerate are reclassified individually, per kind, in
# .github/.abicheck-policy.yaml, which keeps them in the report.
exit_code_scheme: severity

severity:
  preset: default
