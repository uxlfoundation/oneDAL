# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Only non-default settings, plus a few defaults the review workflow relies on.
# Reference: https://docs.coderabbit.ai/reference/configuration

inheritance: false

reviews:
  profile: chill

  # Keep the PR description author-owned; pr-checklist.yml reads it
  high_level_summary_in_walkthrough: true
  sequence_diagrams: false
  related_prs: false
  # CODEOWNERS assigns reviewers
  suggested_reviewers: false
  in_progress_fortune: false

  path_filters:
    - "!**/*.csv"
    - "!data/**"

  auto_review:
    # Review once when the PR opens or leaves draft; later pushes only on `@coderabbitai review`
    auto_incremental_review: false
    drafts: false
    ignore_usernames:
      - "renovate[bot]"
      - "dependabot[bot]"
      - "mergify[bot]"

  # Tests and docstrings stay author-written
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"

  tools:
    # ruff covers these for the few Python scripts here
    flake8:
      enabled: false
    pylint:
      enabled: false
    # Prose linters; grammar nits in docs and comments are noise
    languagetool:
      enabled: false
    vale:
      enabled: false

chat:
  art: false

knowledge_base:
  # Reads AGENTS.md, CLAUDE.md and Copilot instruction files (default)
  code_guidelines:
    enabled: true
