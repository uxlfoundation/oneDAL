# Manifest read by agent-benchmark (repo_manifest.v1). guidance.globs is also the harness's own list: config.py
# reads that one line without PyYAML, so keep it a single-line list of double-quoted strings.
schema: repo_manifest.v1
id: onedal
source: {url: https://github.com/uxlfoundation/oneDAL}
eval_dir: dev/agent_evals

guidance:
  # .github/copilot-instructions.md exists at no task base (agent-benchmark warns); kept so `none` still removes it
  # if a later base adds one
  globs: ["**/AGENTS.md", ".github/instructions/*.md", ".github/copilot-instructions.md"]
  also_scan: ["CONTRIBUTING.md"]

image:
  dockerfile: dev/agent_evals/Dockerfile
  caches:
    - {name: bazel-repo-cache, path: /cache/bazel-repo}
    - {name: bazel-disk-cache, path: /cache/bazel-disk}
    - {name: bazel-registry, path: /cache/bazel-registry}
    - {name: bazel-install, path: /cache/bazel-install}
  env: {EVAL_BAZEL_OUTPUT_BASE: "{run_dir}/ob"}
  network: none

# cwd is {run_dir}/workspace, where eval_dir has been deleted; {eval_dir} is the framework's read-only copy, and the
# scripts find their tasks, graders and bin/ from __file__.
entry_points:
  grade:  "python3 {eval_dir}/run.py grade --contract {run_dir} --source {source_dir}"
  oracle: "python3 {eval_dir}/run.py oracle --contract {run_dir} --source {source_dir}"
  static: "python3 {eval_dir}/static_check.py --out {out}"

tasks: dev/agent_evals/tasks
explore_tasks: null
build_systems: [bazel, make]
